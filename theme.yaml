apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-nucma
spec:
  displayName: NUCMA
  author:
    name: NUCMA
    website: https://nucma.cn
  description: 简约政府风格的 Halo 主题，适合校园官方站点使用
  logo: /themes/theme-nucma/assets/avatar-nucma.svg
  homepage: https://nucma.cn
  repo: https://github.com/chenhufei/theme-nucma
  issues: https://qm.qq.com/q/YEqkx4fa0M
  version: "3.26.15"
  requires: ">=2.22.0"
  settingName: theme-nucma-setting
  configMapName: theme-nucma-config
  license:
    - name: "MIT"
      url: "https://github.com/chenhufei/theme-nucma/blob/main/LICENSE"
  customTemplates:
    page:
      - name: 关于页
        description: 站点介绍、统计与常见问题
        file: page_about.html
    category:
      - name: 知识库列表
        description: 适合文档和专题内容
        file: category-knowledge.html
      - name: 网格卡片
        description: 适合封面内容展示
        file: category-grid-template.html
    post:
      - name: 信件 / 公告
        description: 不缩进正文，适合公文和信件
        file: post-letter.html
      - name: 杂志大图
        description: 强调封面和首段的视觉文章
        file: post-magazine.html
