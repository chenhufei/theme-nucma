<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=|${post?.spec?.title} - ${site.title}|, content=~{::content}, headExtra=~{modules/seo :: article(post=${post})}, description=${post?.spec?.excerpt?.raw != null and !#strings.isEmpty(post.spec.excerpt.raw) ? post.spec.excerpt.raw : post?.status?.excerpt}, canonical=${post?.status?.permalink}, image=${post?.spec?.cover}, pageType='article', robots=null)}">
<th:block th:fragment="content">
  <div class="template-post-letter">
    <th:block th:replace="~{post :: content}"></th:block>
  </div>
</th:block>
</html>
