<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(title='标签 - ' + ${site.title}, content=~{::content}, description='浏览本站全部内容标签', canonical=${site.routes.tagsUri}, image=${site.logo}, pageType='website', robots=null)}">
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">标签</h1>
  </div>
  
  <div class="tag-cloud" th:if="${tags != null and !tags.isEmpty()}">
    <a th:each="tag : ${tags}" th:href="@{${tag.status?.permalink}}" class="badge badge-outline tag-item"
       th:text="${tag.spec?.displayName}"></a>
  </div>
  
  <div class="empty-state" th:unless="${tags != null and !tags.isEmpty()}">
    <p>暂无标签</p>
  </div>
</th:block>
</html>
