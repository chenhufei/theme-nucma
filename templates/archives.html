<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=|${#messages.msg('archives.heading')} - ${site.title}|, content=~{::content}, headExtra=~{modules/layout :: noHead}, description=|${#messages.msg('archives.description')}|, canonical=${site.routes.archivesUri}, image=${site.logo}, pageType='website', robots=null)}">
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title" th:text="#{archives.heading}">归档</h1>
  </div>

  <!--
    归档页自行分页：page 取自 ?page=，只接受 1-99999 的纯数字，非法值回落第 1 页。
    ListResult 没有 prevUrl/nextUrl，分页链接必须显式拼 /archives(page=n)。
    注意：Thymeleaf 3.1 的 #strings 没有 matches，#numbers 没有 toInteger，
    校验用 String#matches，转换用 #conversions。
  -->
  <th:block th:with="archivePage = ${param.page != null and !#arrays.isEmpty(param.page) and param.page[0].matches('[1-9][0-9]{0,4}') ? #conversions.convert(param.page[0], 'java.lang.Integer') : 1},
                   posts = ${postFinder.list({page: archivePage, size: 30})},
                   notePalette = ${ {'#f4c09c', '#bfd0a8', '#b9c4d2', '#d8cbb4', '#dcb9b4', '#c3bccf'} }">
    <div class="article-grid article-grid--portalflow archives-flow"
         th:if="${posts != null and posts.items != null and !posts.items.isEmpty()}">

      <th:block th:each="post, iter : ${posts.items}"
                th:with="currentYear = ${#temporals.format(post.spec?.publishTime, 'yyyy')},
                         prevYear = ${iter.index > 0 ? #temporals.format(posts.items[iter.index - 1].spec?.publishTime, 'yyyy') : ''},
                         hasCover = ${post.spec?.cover != null and !#strings.isEmpty(post.spec?.cover)},
                         cardCat = ${post.spec?.categories != null and !#lists.isEmpty(post.spec.categories) ? categoryFinder.getByName(post.spec.categories[0]) : null},
                         cardAuthor = ${post.metadata?.annotations != null and !#strings.isEmpty(post.metadata.annotations['nucma.cn/author']) ? post.metadata.annotations['nucma.cn/author'] : post.owner?.displayName}">

        <div th:if="${iter.index == 0 or currentYear != prevYear}" class="archive-year-section">
          <h2 class="archive-year-title" th:text="${currentYear}">2024</h2>
        </div>

        <!-- 年份行也是网格子元素，nth-child 会把六档色的下标错开，所以按页内序号直接写 --nk-b -->
        <article class="article-card archive-timeline-item"
                 th:classappend="${hasCover ? '' : 'article-card--note'}"
                 th:style="${hasCover ? null : '--nk-b:' + notePalette[iter.index % 6]}">
          <a class="article-link" th:href="@{${post.status?.permalink}}">
            <div class="article-cover" th:if="${hasCover}">
              <img th:src="${post.spec?.cover}" th:alt="${post.spec?.title}" loading="lazy" decoding="async"
                   sizes="(max-width: 767px) 80px, 152px" width="152" height="95" />
              <span class="article-tag" th:if="${cardCat != null}" th:text="${cardCat.spec?.displayName}">分类</span>
            </div>
            <div class="article-cover article-cover--empty" th:unless="${hasCover}" aria-hidden="true"><span>NUCMA</span></div>
            <div class="article-body">
              <div class="article-meta">
                <span class="article-cat" th:if="${cardCat != null}" th:text="${cardCat.spec?.displayName}">分类</span>
                <time class="article-date" th:text="${#temporals.format(post.spec?.publishTime, 'MM-dd')}">11-03</time>
                <span class="article-pin" th:if="${post.spec?.pinned == true}" th:text="#{home.pinned}">置顶</span>
              </div>
              <h3 class="article-title" th:text="${post.spec?.title}">文章标题</h3>
              <span class="article-author" th:if="${cardAuthor != null and !#strings.isEmpty(cardAuthor)}">
                <em th:text="#{post.bylinePrefix}">文</em><span th:text="${cardAuthor}">作者</span>
              </span>
              <span class="article-more"><span th:text="#{home.heroReadMore}">阅读全文</span><i aria-hidden="true">→</i></span>
            </div>
          </a>
        </article>
      </th:block>

    </div>

    <div class="alert alert-soft alert-vertical empty-state" th:if="${posts == null or posts.items == null or posts.items.isEmpty()}">
      <p th:text="#{archives.emptyPosts}">暂无归档内容</p>
    </div>

    <nav class="join pagination" th:if="${posts != null and (posts.hasPrevious() or posts.hasNext())}">
      <a th:if="${posts.hasPrevious()}" th:href="@{/archives(page=${posts.page - 1})}" class="btn btn-outline btn-sm join-item page-btn" th:text="#{common.previousPage}">上一页</a>
      <span class="pagination-info" th:if="${posts.totalPages > 1}" th:text="|${posts.page} / ${posts.totalPages}|">1 / 1</span>
      <a th:if="${posts.hasNext()}" th:href="@{/archives(page=${posts.page + 1})}" class="btn btn-outline btn-sm join-item page-btn" th:text="#{common.nextPage}">下一页</a>
    </nav>
  </th:block>
</th:block>
</html>
