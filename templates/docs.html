<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(title=${title ?: '文档中心'} + ' - ' + ${site.title}, content=~{::content}, description='浏览本站文档内容', canonical='/docs', image=${site.logo}, pageType='website', robots=null)}">
<th:block th:fragment="content">
  <div class="page-header" style="text-align: center; padding: var(--space-xl) 0; margin-bottom: var(--space-xl);">
    <h1 class="page-title" th:text="${title ?: '文档中心'}">文档中心</h1>
    <p class="page-desc">规章制度与操作指南</p>
  </div>

  <div class="docs-list" th:if="${docs != null and docs.items != null and !#lists.isEmpty(docs.items)}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-xl);">
    <a th:each="doc : ${docs.items}" th:href="@{${doc.status?.permalink ?: '#'}}" style="display: flex; flex-direction: column; padding: var(--space-xl); background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: var(--radius-md); text-decoration: none; transition: all var(--transition-normal); box-shadow: var(--shadow-sm);" onmouseover="this.style.transform='translateY(-4px)'; this.style.borderColor='var(--primary)'; this.style.boxShadow='var(--shadow-md)'" onmouseout="this.style.transform='none'; this.style.borderColor='var(--border-color)'; this.style.boxShadow='var(--shadow-sm)'">
      <h3 th:text="${doc.spec?.title}" style="margin: 0 0 var(--space-sm) 0; font-size: 1.2rem; color: var(--text-primary);"></h3>
      <p th:if="${doc.spec?.description != null}" th:text="${doc.spec?.description}" style="margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"></p>
      <div style="margin-top: auto; padding-top: var(--space-md); color: var(--text-tertiary); font-size: 0.85rem;">
        查看详情 →
      </div>
    </a>
  </div>

  <div class="empty-state" th:unless="${docs != null and docs.items != null and !#lists.isEmpty(docs.items)}">
    <p>暂无文档</p>
  </div>

  <nav class="pagination" th:if="${docs != null and (docs.hasPrevious() or docs.hasNext())}">
    <a th:if="${docs.hasPrevious()}" th:href="@{${docs.prevUrl}}" class="page-btn">上一页</a>
    <a th:if="${docs.hasNext()}" th:href="@{${docs.nextUrl}}" class="page-btn">下一页</a>
  </nav>
</th:block>
</html>
