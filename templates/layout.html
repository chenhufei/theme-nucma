<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org" xmlns:halo="https://www.halo.run"
      th:fragment="html (head, content)"
      class="no-js"
      data-theme="light" data-color-scheme="auto" data-visual-style="portal"
      th:data-visual-style="${theme.config.appearance?.visual_style ?: 'portal'}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" th:content="${theme.config.appearance?.primary_color ?: '#D13E43'}">
  <title th:if="${head == null}" th:text="${site.title}"></title>
  <th:block th:if="${head != null}" th:replace="${head}"></th:block>
  <!-- favicon 由 Halo 的 DefaultFaviconHeadProcessor 注入，此处不再重复输出 -->
  <link rel="preload"
        th:href="@{/assets/css/KuaiKanShiJieTi.woff2(v=${theme.spec.version})}"
        href="/assets/css/KuaiKanShiJieTi.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" th:href="@{/assets/css/main.css(v=${theme.spec.version})}">
  <script th:inline="javascript">
    (function() {
      var html = document.documentElement;
      html.classList.remove('no-js');
      html.classList.add('js-enabled');
      var saved = localStorage.getItem('theme-mode') || localStorage.getItem('theme');
      var mode = /*[[${theme.config.appearance?.default_theme_mode ?: 'system'}]]*/ 'system';
      var isDark = saved === 'dark' || (!saved && mode === 'dark')
        || ((saved || mode) === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var effectiveMode = isDark ? 'dark' : 'light';
      html.setAttribute('data-theme', effectiveMode);
      html.setAttribute('data-color-scheme', effectiveMode);
      html.classList.remove('light', 'dark');
      html.classList.add(effectiveMode);
      var primaryColor = /*[[${theme.config.appearance?.primary_color ?: '#D13E43'}]]*/ '#D13E43';
      if (primaryColor && primaryColor !== '#D13E43') {
        html.style.setProperty('--primary', primaryColor);
        html.style.setProperty('--color-primary', primaryColor);
        html.style.setProperty('--color-error', primaryColor);
        var r = parseInt(primaryColor.slice(1, 3), 16);
        var g = parseInt(primaryColor.slice(3, 5), 16);
        var b = parseInt(primaryColor.slice(5, 7), 16);
        html.style.setProperty('--primary-rgb', r + ',' + g + ',' + b);
        html.style.setProperty('--primary-light', 'rgb(' + Math.min(255, r + 30) + ',' + Math.min(255, g + 30) + ',' + Math.min(255, b + 30) + ')');
        html.style.setProperty('--primary-dark', 'rgb(' + Math.max(0, r - 30) + ',' + Math.max(0, g - 30) + ',' + Math.max(0, b - 30) + ')');
      }
    })();
  </script>
  <th:block th:with="customCss=${theme.config.appearance?.custom_css}"
            th:if="${customCss != null and !#strings.isEmpty(customCss)}">
    <style th:utext="${customCss}"></style>
  </th:block>
</head>
<body class="page-body" th:data-theme-version="${theme.spec.version}">
  <a class="skip-link" href="#mainContent" th:text="#{a11y.skipToContent}">跳到主要内容</a>
  <th:block th:replace="~{modules/layout :: siteHeader}"></th:block>
  <th:block th:replace="~{modules/layout :: mobileMenu}"></th:block>
  <main id="mainContent" class="site-main" tabindex="-1">
    <div class="container">
      <th:block th:replace="${content}"></th:block>
    </div>
  </main>
  <th:block th:replace="~{modules/layout :: siteFooter}"></th:block>
  <halo:footer />
  <script th:inline="javascript">
    window.NUCMA_RUNTIME = {
      debug: /*[[${theme.config.appearance?.developer_mode == true}]]*/ false,
      version: /*[[${theme.spec.version}]]*/ "development"
    };
  </script>
  <script defer th:src="@{/assets/js/main.js(v=${theme.spec.version})}"></script>
  <th:block th:with="customJs=${theme.config.appearance?.custom_js}"
            th:if="${customJs != null and !#strings.isEmpty(customJs)}">
    <script th:utext="${customJs}"></script>
  </th:block>
</body>
</html>
