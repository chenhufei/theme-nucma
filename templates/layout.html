<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:fragment="html (title, content, description, canonical, image, pageType, robots)"
      th:with="siteBase=${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url},
               seoDescription=${description != null and !#strings.isEmpty(description) ? description : (site.seo?.description ?: (site.subtitle ?: site.title))},
               seoCanonical=${canonical != null ? (#strings.isEmpty(canonical) ? '' : ((#strings.startsWith(canonical, 'http://') or #strings.startsWith(canonical, 'https://')) ? canonical : siteBase + canonical)) : site.url},
               rawSeoImage=${image != null and !#strings.isEmpty(image) ? image : site.logo},
               seoImage=${rawSeoImage != null and !#strings.isEmpty(rawSeoImage) ? ((#strings.startsWith(rawSeoImage, 'http://') or #strings.startsWith(rawSeoImage, 'https://')) ? rawSeoImage : siteBase + (#strings.startsWith(rawSeoImage, '/') ? rawSeoImage : '/' + rawSeoImage)) : ''},
               seoPageType=${pageType ?: 'website'},
               seoRobots=${robots ?: (site.seo?.blockSpiders == true ? 'noindex, nofollow' : 'index, follow')}"
      class="no-js"
      data-theme="light" data-color-scheme="auto"
      data-visual-style="portal"
      th:data-visual-style="${theme.config.appearance?.visual_style ?: 'portal'}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" th:content="${theme.config.appearance?.primary_color ?: '#D13E43'}" />
  <title th:text="${title} ?: ${site.title}"></title>
  <meta name="description" th:content="${seoDescription}" />
  <meta name="keywords" th:if="${site.seo?.keywords != null and !#strings.isEmpty(site.seo.keywords)}" th:content="${site.seo.keywords}" />
  <meta name="robots" th:content="${seoRobots}" />
  <link rel="canonical" th:if="${seoCanonical != null and !#strings.isEmpty(seoCanonical)}" th:href="${seoCanonical}" />
  <meta property="og:site_name" th:content="${site.title}" />
  <meta property="og:title" th:content="${title} ?: ${site.title}" />
  <meta property="og:description" th:content="${seoDescription}" />
  <meta property="og:type" th:content="${seoPageType}" />
  <meta property="og:url" th:if="${seoCanonical != null and !#strings.isEmpty(seoCanonical)}" th:content="${seoCanonical}" />
  <meta property="og:image" th:if="${seoImage != null and !#strings.isEmpty(seoImage)}" th:content="${seoImage}" />
  <meta name="twitter:card" th:content="${seoImage != null and !#strings.isEmpty(seoImage) ? 'summary_large_image' : 'summary'}" />
  <meta name="twitter:title" th:content="${title} ?: ${site.title}" />
  <meta name="twitter:description" th:content="${seoDescription}" />
  <meta name="twitter:image" th:if="${seoImage != null and !#strings.isEmpty(seoImage)}" th:content="${seoImage}" />
  <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": /*[[${seoPageType == 'article' ? 'Article' : 'WebPage'}]]*/ "WebPage",
      "name": /*[[${title} ?: ${site.title}]]*/ "Page",
      "description": /*[[${seoDescription}]]*/ "",
      "url": /*[[${seoCanonical}]]*/ "",
      "image": /*[[${seoImage}]]*/ "",
      "isPartOf": {
        "@type": "WebSite",
        "name": /*[[${site.title}]]*/ "Site",
        "url": /*[[${site.url}]]*/ ""
      }
    }
  </script>
  <th:block th:if="${site.favicon != null and !#strings.isEmpty(site.favicon)}">
    <link rel="icon" th:href="${site.favicon}" type="image/x-icon" sizes="any" />
  </th:block>
  <link rel="preload"
        th:href="@{/assets/css/KuaiKanShiJieTi.woff2(v=${theme.spec.version})}"
        href="/assets/css/KuaiKanShiJieTi.woff2"
        as="font"
        type="font/woff2"
        crossorigin />
  <link rel="stylesheet" th:href="@{/assets/css/main.css(v=${theme.spec.version})}" />
  <script th:inline="javascript">
    (function() {
      var html = document.documentElement;
      html.classList.remove('no-js');
      html.classList.add('js-enabled');
      var saved = localStorage.getItem('theme-mode') || localStorage.getItem('theme');
      var mode = /*[[${theme.config.appearance?.default_theme_mode ?: 'system'}]]*/ 'system';
      var resolvedMode = saved || mode;
      var isDark = resolvedMode === 'dark'
        || (resolvedMode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var effectiveMode = isDark ? 'dark' : 'light';
      var html = document.documentElement;
      html.setAttribute('data-theme', effectiveMode);
      html.setAttribute('data-color-scheme', effectiveMode);
      html.classList.remove('light', 'dark');
      html.classList.add(effectiveMode);

      var primaryColor = /*[[${theme.config.appearance?.primary_color ?: '#D13E43'}]]*/ '#D13E43';
      if (primaryColor && primaryColor !== '#D13E43') {
        document.documentElement.style.setProperty('--primary', primaryColor);
        document.documentElement.style.setProperty('--color-primary', primaryColor);
        document.documentElement.style.setProperty('--color-error', primaryColor);
        var r = parseInt(primaryColor.slice(1,3), 16);
        var g = parseInt(primaryColor.slice(3,5), 16);
        var b = parseInt(primaryColor.slice(5,7), 16);
        document.documentElement.style.setProperty('--primary-rgb', r + ',' + g + ',' + b);
        document.documentElement.style.setProperty('--primary-light', 'rgb(' + Math.min(255, r+30) + ',' + Math.min(255, g+30) + ',' + Math.min(255, b+30) + ')');
        document.documentElement.style.setProperty('--primary-dark', 'rgb(' + Math.max(0, r-30) + ',' + Math.max(0, g-30) + ',' + Math.max(0, b-30) + ')');
      }
    })();
  </script>
  <th:block th:with="customCss=${theme.config.appearance?.custom_css != null ? theme.config.appearance.custom_css : theme.config.content?.custom_css}"
            th:if="${customCss != null and !#strings.isEmpty(customCss)}">
    <style th:utext="${customCss}"></style>
  </th:block>
</head>
<body th:data-template="${_templateId}"
      th:data-theme-version="${theme.spec.version}">
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <div th:if="${seoPageType == 'article'}"
       id="readingProgress"
       class="reading-progress"
       role="progressbar"
       aria-label="文章阅读进度"
       aria-valuemin="0"
       aria-valuemax="100"
       aria-valuenow="0">
    <span class="reading-progress__bar"></span>
  </div>

  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner"
           th:with="navAlign = ${theme.config.navigation?.nav_align ?: 'center'}"
           th:classappend="${'nav-align-' + navAlign}">
        <a th:href="@{/}" class="logo">
          <img th:if="${site.logo != null and !#strings.isEmpty(site.logo)}"
               th:src="${site.logo}" th:alt="${site.title}" width="32" height="32" decoding="async" />
          <span th:text="${site.title}"></span>
        </a>
        <nav class="main-nav"
             th:with="headerLinks=${theme.config.navigation?.custom_links != null ? theme.config.navigation.custom_links : theme.config.carousel?.custom_links},
                      headerLinkInterval=${theme.config.navigation?.carousel_interval != null ? theme.config.navigation.carousel_interval : (theme.config.carousel?.carousel_interval ?: 3500)}">
          <!-- 主菜单（header_menu 为空则不显示） -->
          <th:block th:if="${theme.config.navigation?.header_menu != null and !#strings.isEmpty(theme.config.navigation?.header_menu)}"
             th:with="menu = ${menuFinder.getByName(theme.config.navigation?.header_menu)}">
            <th:block th:if="${menu != null and menu.menuItems != null}">
              <a th:each="item : ${menu.menuItems}"
                 th:href="@{${item.status?.href}}"
                 th:text="${item.status?.displayName}"
                 th:target="${item.spec?.target?.value}"></a>
            </th:block>
          </th:block>
          <!-- 自定义链接跟在菜单右侧，超过1个时自动上下滚动轮播 -->
          <th:block th:if="${headerLinks != null and !#lists.isEmpty(headerLinks)}">
            <th:block th:with="carousel = ${#lists.size(headerLinks) > 1}">
              <div class="header-links-wrap" th:classappend="${carousel ? 'is-carousel' : ''}"
                   th:data-interval="${carousel} ? ${headerLinkInterval} : null">
                <div class="header-links-track" th:if="${carousel}">
                  <th:block th:each="link : ${headerLinks}">
                    <div class="header-links-slide">
                      <a th:if="${link.url != null and !#strings.isEmpty(link.url) and (link.text != null and !#strings.isEmpty(link.text) or link.image != null and !#strings.isEmpty(link.image))}"
                         th:href="${link.url}"
                         th:target="${link.target ?: '_blank'}"
                         class="header-link"
                         th:title="${link.text}"
                     th:aria-label="${link.text != null and !#strings.isEmpty(link.text) ? link.text : link.url}">
                        <img th:if="${link.image != null and !#strings.isEmpty(link.image)}"
                             th:src="${link.image}" th:alt="${link.text != null and !#strings.isEmpty(link.text) ? link.text : link.url}"
                             class="header-link-img" width="20" height="20" loading="lazy" decoding="async" />
                        <span th:if="${(link.image == null or #strings.isEmpty(link.image)) and link.text != null and !#strings.isEmpty(link.text)}"
                              th:text="${link.text}"></span>
                      </a>
                    </div>
                  </th:block>
                </div>
                <th:block th:unless="${carousel}">
                  <th:block th:each="link : ${headerLinks}">
                    <a th:if="${link.url != null and !#strings.isEmpty(link.url) and (link.text != null and !#strings.isEmpty(link.text) or link.image != null and !#strings.isEmpty(link.image))}"
                       th:href="${link.url}"
                     th:target="${link.target ?: '_blank'}"
                     class="header-link"
                     th:title="${link.text}"
                     th:aria-label="${link.text != null and !#strings.isEmpty(link.text) ? link.text : link.url}">
                      <img th:if="${link.image != null and !#strings.isEmpty(link.image)}"
                           th:src="${link.image}" th:alt="${link.text != null and !#strings.isEmpty(link.text) ? link.text : link.url}"
                           class="header-link-img" width="20" height="20" loading="lazy" decoding="async" />
                      <span th:if="${(link.image == null or #strings.isEmpty(link.image)) and link.text != null and !#strings.isEmpty(link.text)}"
                            th:text="${link.text}"></span>
                    </a>
                  </th:block>
                </th:block>
              </div>
            </th:block>
          </th:block>
        </nav>
        <div class="header-actions">
          <th:block th:if="${(theme.config.navigation?.search_enabled != null ? theme.config.navigation.search_enabled : theme.config.content?.search_enabled) != false}">
            <button th:if="${pluginFinder.available('PluginSearchWidget')}"
                    type="button"
                    data-widget-open="SearchWidget"
                    class="btn btn-ghost btn-circle btn-sm icon-btn" aria-label="搜索">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
            </button>
          </th:block>
          <button th:if="${(theme.config.navigation?.theme_toggle_enabled != null ? theme.config.navigation.theme_toggle_enabled : theme.config.content?.theme_toggle_enabled) != false}"
                  id="themeToggle" class="btn btn-ghost btn-circle btn-sm icon-btn theme-toggle-btn" aria-label="切换主题">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 5.64l1.42-1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 18.36l1.42 1.42"></path>
            </svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <!-- 登录入口（在明暗切换右侧） -->
          <th:block th:if="${theme.config.navigation?.show_login_btn != false}">
            <div class="login-entry-wrap" id="loginEntryWrap">
              <button id="loginEntry" class="btn btn-ghost btn-circle btn-sm icon-btn login-entry" type="button" title="登录" aria-label="登录" aria-expanded="false" aria-controls="loginDropdown">
                <img class="login-avatar" alt="" width="28" height="28" hidden />
                <span class="login-avatar-placeholder" hidden>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
                </span>
                <svg class="login-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                  <polyline points="10 17 15 12 10 7"></polyline>
                  <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
              </button>
              <div id="loginDropdown" class="menu menu-sm login-dropdown" role="menu" aria-label="用户菜单" aria-hidden="true">
                <a href="/uc" role="menuitem" class="login-menu-uc">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <span>个人中心</span>
                </a>
                <a href="/logout" role="menuitem" class="login-menu-logout">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  <span>退出登录</span>
                </a>
              </div>
            </div>
          </th:block>
          <button id="mobileMenuToggle" type="button" class="btn btn-ghost btn-circle btn-sm icon-btn mobile-only" aria-label="菜单" aria-controls="mobileMenu" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12h18M3 6h18M3 18h18"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 移动端菜单 -->
  <div id="mobileMenu" class="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-overlay"></div>
    <div class="mobile-menu-content">
      <div class="mobile-menu-header">
        <span th:text="${site.title}"></span>
        <button type="button" data-mobile-menu-close class="btn btn-ghost btn-circle btn-sm icon-btn" aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <nav class="mobile-nav" aria-label="移动端导航">
        <th:block th:if="${theme.config.navigation?.header_menu != null and !#strings.isEmpty(theme.config.navigation?.header_menu)}"
                  th:with="menu = ${menuFinder.getByName(theme.config.navigation?.header_menu)}">
          <th:block th:if="${menu != null and !#lists.isEmpty(menu.menuItems)}">
            <div class="mobile-nav-section mobile-nav-section--menu" role="group" aria-label="菜单导航">
              <div class="mobile-nav-label">菜单导航</div>
              <div class="mobile-menu-links">
                <a th:each="item : ${menu.menuItems}"
                   class="mobile-nav-link mobile-nav-link--menu"
                   th:href="@{${item.status?.href}}"
                   th:text="${item.status?.displayName}"
                   th:target="${item.spec?.target?.value}"></a>
              </div>
            </div>
          </th:block>
        </th:block>
        <th:block th:with="mobileHeaderLinks=${theme.config.navigation?.custom_links != null ? theme.config.navigation.custom_links : theme.config.carousel?.custom_links}">
          <th:block th:if="${mobileHeaderLinks != null and !#lists.isEmpty(mobileHeaderLinks)}">
            <div class="mobile-nav-section mobile-nav-section--custom" role="group" aria-label="自定义链接">
              <div class="mobile-custom-links">
                <a th:each="link : ${mobileHeaderLinks}"
                   th:if="${link.url != null and !#strings.isEmpty(link.url) and (link.text != null and !#strings.isEmpty(link.text) or link.image != null and !#strings.isEmpty(link.image))}"
                   class="mobile-nav-link mobile-nav-link--custom"
                   th:href="${link.url}"
                   th:target="${link.target ?: '_blank'}"
                   th:aria-label="${link.text != null and !#strings.isEmpty(link.text) ? link.text : link.url}">
                  <img th:if="${link.image != null and !#strings.isEmpty(link.image)}"
                       th:src="${link.image}"
                       th:alt="${link.text != null ? link.text : ''}"
                       width="42" height="42" />
                  <span th:if="${link.text != null and !#strings.isEmpty(link.text)}" th:text="${link.text}"></span>
                </a>
              </div>
            </div>
          </th:block>
        </th:block>
      </nav>
    </div>
  </div>

  <!-- 主内容 -->
  <main id="mainContent" class="site-main" tabindex="-1">
    <div class="container" th:classappend="${_templateId == 'index'} ? 'home-container' : ''">
      <th:block th:replace="${content}" />
    </div>
  </main>

  <th:block th:if="${seoPageType == 'article' and (theme.config.sidebar?.auto_toc != null ? theme.config.sidebar.auto_toc : theme.config.content?.auto_toc) != false}">
    <button id="mobileTocToggle"
            class="mobile-toc-toggle"
            type="button"
            aria-controls="mobileTocDrawer"
            aria-expanded="false"
            hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M8 6h13M8 12h13M8 18h13"></path>
        <path d="M3 6h.01M3 12h.01M3 18h.01"></path>
      </svg>
      <span>目录</span>
    </button>

    <dialog id="mobileTocDrawer" class="mobile-toc-drawer" aria-labelledby="mobileTocTitle" hidden>
      <div class="mobile-toc-drawer__panel">
        <header class="mobile-toc-drawer__header">
          <h2 id="mobileTocTitle">文章目录</h2>
          <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-toc-close aria-label="关闭目录">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </header>
        <nav id="mobileToc" class="toc mobile-toc" aria-label="文章目录"></nav>
      </div>
    </dialog>
  </th:block>

  <dialog th:if="${seoPageType == 'article'}"
          id="articleImageViewer"
          class="article-image-viewer"
          aria-labelledby="articleImageViewerTitle"
          hidden>
    <div class="article-image-viewer__shell">
      <header class="article-image-viewer__header">
        <div class="article-image-viewer__heading">
          <h2 id="articleImageViewerTitle">图片预览</h2>
          <span id="articleImageViewerCounter" aria-live="polite"></span>
        </div>
        <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-image-viewer-close aria-label="关闭图片预览">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </header>

      <div class="article-image-viewer__stage">
        <button type="button" class="btn btn-ghost btn-circle viewer-nav viewer-nav--prev" data-image-viewer-prev aria-label="上一张图片">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </button>
        <div id="articleImageViewerCanvas" class="article-image-viewer__canvas">
      <img id="articleImageViewerImage" alt="" width="1200" height="800" decoding="async" draggable="false" />
        </div>
        <button type="button" class="btn btn-ghost btn-circle viewer-nav viewer-nav--next" data-image-viewer-next aria-label="下一张图片">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </button>
      </div>

      <footer class="article-image-viewer__footer">
        <p id="articleImageViewerCaption"></p>
        <div class="article-image-viewer__toolbar" aria-label="图片缩放">
          <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-image-viewer-zoom-out aria-label="缩小图片">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35M8 11h6"></path>
            </svg>
          </button>
          <button type="button" class="btn btn-ghost btn-sm viewer-reset-btn" data-image-viewer-reset aria-label="重置图片缩放">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path>
            </svg>
            <span id="articleImageViewerZoom">100%</span>
          </button>
          <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-image-viewer-zoom-in aria-label="放大图片">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35M11 8v6M8 11h6"></path>
            </svg>
          </button>
        </div>
      </footer>
    </div>
  </dialog>

  <!-- 页脚 -->
  <footer class="site-footer">
    <!-- 返回顶部 -->
    <button th:if="${theme.config.appearance?.back_to_top_enabled != false}"
            id="backToTop" class="back-to-top-wrap" type="button" aria-label="返回顶部">
      <span class="back-to-top-mountain side side-5" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-4" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-3" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-2" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-1" aria-hidden="true"></span>
      <span class="back-to-top-mountain center" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 15l-6-6-6 6"></path>
        </svg>
      </span>
      <span class="back-to-top-mountain side side-1" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-2" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-3" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-4" aria-hidden="true"></span>
      <span class="back-to-top-mountain side side-5" aria-hidden="true"></span>
    </button>
    <div class="container">
      <div class="footer-inner">
        <!-- 站点信息 -->
        <div class="footer-col">
          <div class="footer-col-title" th:text="${site.title}">站点名称</div>
          <div class="footer-info">
            <p th:if="${site.subtitle != null and !#strings.isEmpty(site.subtitle)}"
               th:text="${site.subtitle}"></p>
            <p th:if="${theme.config.footer?.copyright != null and !#strings.isEmpty(theme.config.footer.copyright)}"
               th:text="${theme.config.footer.copyright}"></p>
          </div>
        </div>

        <!-- 页脚菜单栏目：新列表优先，旧配置仅作为无界面兼容回退。 -->
        <th:block th:with="footerMenus = ${theme.config.footer?.footer_menus}">
          <th:block th:if="${footerMenus != null and !#lists.isEmpty(footerMenus)}"
                    th:each="footerColumn : ${footerMenus}"
                    th:with="menu = ${footerColumn.menu != null and !#strings.isEmpty(footerColumn.menu) ? menuFinder.getByName(footerColumn.menu) : null}">
            <div class="footer-col" th:if="${menu != null and menu.menuItems != null}">
              <div class="footer-col-title" th:text="${footerColumn.title ?: '快捷导航'}">快捷导航</div>
              <nav class="footer-nav">
                <a th:each="item : ${menu.menuItems}"
                   th:href="@{${item.status?.href}}"
                   th:text="${item.status?.displayName}"
                   th:target="${item.spec?.target?.value}"></a>
              </nav>
            </div>
          </th:block>
          <th:block th:unless="${footerMenus != null and !#lists.isEmpty(footerMenus)}"
                    th:with="footerMenuName = ${theme.config.footer?.footer_menu != null ? theme.config.footer.footer_menu : (theme.config.navigation?.footer_menu ?: '')}">
            <div class="footer-col"
                 th:if="${!#strings.isEmpty(footerMenuName)}"
                 th:with="menu = ${menuFinder.getByName(footerMenuName)}">
              <div class="footer-col-title">快捷导航</div>
              <nav class="footer-nav" th:if="${menu != null and menu.menuItems != null}">
                <a th:each="item : ${menu.menuItems}"
                   th:href="@{${item.status?.href}}"
                   th:text="${item.status?.displayName}"
                   th:target="${item.spec?.target?.value}"></a>
              </nav>
            </div>
          </th:block>
        </th:block>

        <!-- 自定义内容 -->
        <div class="footer-col" th:if="${theme.config.footer?.custom_column_items != null and !#lists.isEmpty(theme.config.footer.custom_column_items)}">
          <div class="footer-col-title" th:text="${theme.config.footer?.custom_column_title ?: '关注我们'}">关注我们</div>
          <div class="footer-custom-items">
            <th:block th:each="item : ${theme.config.footer.custom_column_items}">
              <a th:if="${item.url != null and !#strings.isEmpty(item.url)}"
                 th:href="${item.url}"
                 th:target="${item.target ?: '_blank'}"
                 class="footer-custom-item">
                <img th:if="${item.image != null and !#strings.isEmpty(item.image)}"
                     th:src="${item.image}" th:alt="${item.title}" class="footer-custom-img" width="80" height="80" loading="lazy" decoding="async" />
                <span th:text="${item.title}" class="footer-custom-text"></span>
              </a>
              <div th:unless="${item.url != null and !#strings.isEmpty(item.url)}" class="footer-custom-item footer-custom-static">
                <img th:if="${item.image != null and !#strings.isEmpty(item.image)}"
                     th:src="${item.image}" th:alt="${item.title}" class="footer-custom-img" width="80" height="80" loading="lazy" decoding="async" />
                <span th:text="${item.title}" class="footer-custom-text"></span>
              </div>
            </th:block>
          </div>
        </div>
      </div>

      <!-- 底部版权 -->
      <div class="footer-bottom">
        <div class="footer-copyright">
          <span th:if="${theme.config.footer?.copyright == null or #strings.isEmpty(theme.config.footer?.copyright)}">
            &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span>
            <th:block th:text="${site.title}"></th:block>
          </span>
        </div>
        <div class="footer-links">
          <span th:if="${theme.config.footer?.icp_number != null and !#strings.isEmpty(theme.config.footer.icp_number)}">
            <a th:href="${theme.config.footer?.icp_link ?: 'https://beian.miit.gov.cn/'}"
               target="_blank" rel="noopener noreferrer"
               th:text="${theme.config.footer.icp_number}"></a>
          </span>
          <span th:if="${theme.config.footer?.police_number != null and !#strings.isEmpty(theme.config.footer.police_number)}">
            <a th:if="${theme.config.footer?.police_record_code != null and !#strings.isEmpty(theme.config.footer.police_record_code)}"
               th:href="'https://beian.mps.gov.cn/#/query/webSearch?code=' + ${theme.config.footer.police_record_code}"
               target="_blank" rel="noopener noreferrer"
               th:text="${theme.config.footer.police_number}"></a>
            <a th:unless="${theme.config.footer?.police_record_code != null and !#strings.isEmpty(theme.config.footer.police_record_code)}"
               href="https://beian.mps.gov.cn/"
               target="_blank" rel="noopener noreferrer"
               th:text="${theme.config.footer.police_number}"></a>
          </span>
        </div>
      </div>
    </div>
  </footer>

  <halo:footer />
  <script th:inline="javascript">
    window.NUCMA_RUNTIME = {
      debug: /*[[${theme.config.appearance?.developer_mode != null ? theme.config.appearance.developer_mode : theme.config.content?.developer_mode == true}]]*/ false,
      version: /*[[${theme.spec.version}]]*/ "development"
    };
  </script>
  <script th:src="@{/assets/js/main.js(v=${theme.spec.version})}"></script>
  <th:block th:with="customJs=${theme.config.appearance?.custom_js != null ? theme.config.appearance.custom_js : theme.config.content?.custom_js}"
            th:if="${customJs != null and !#strings.isEmpty(customJs)}">
    <script th:utext="${customJs}"></script>
  </th:block>
</body>
</html>
