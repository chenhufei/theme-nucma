<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=|${#messages.msg('error.500.title')}|, content=~{::content}, headExtra=~{modules/layout :: noHead}, description=|${#messages.msg('error.500.hint')}|, canonical='', image=${site.logo}, pageType='website', robots='noindex, nofollow')}">
<th:block th:fragment="content">
  <div class="error-page">
    <h1 class="error-code">500</h1>
    <p class="error-message" th:text="#{error.500.message}">服务器内部错误</p>
    <a th:href="@{/}" class="error-link" th:text="#{error.home}">返回首页</a>
  </div>
</th:block>
</html>
