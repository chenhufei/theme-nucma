<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(title='页面未找到', content=~{::content}, description='请求的页面不存在', canonical='', image=${site.logo}, pageType='website', robots='noindex, nofollow')}">
<th:block th:fragment="content">
  <div class="error-page">
    <h1 class="error-code">404</h1>
    <p class="error-message">页面未找到</p>
    <a th:href="@{/}" class="error-link" data-history-back>返回上一页</a>
  </div>
</th:block>
</html>
