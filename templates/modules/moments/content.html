<section class="plugin-page-shell">
  <header class="plugin-page-header reveal">
    <p class="theme-page-subtitle">记录校园互助、活动现场与组织动态。</p>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="theme-page-title">校园动态</h1>
        <p class="theme-text-soft text-sm" th:text="|共 ${moments.total ?: 0} 条公开内容|">共 0 条公开内容</p>
      </div>
      <div class="plugin-chip-list" th:if="${tags != null and !#lists.isEmpty(tags)}">
        <a href="/moments"
           class="plugin-chip"
           th:classappend="${#lists.isEmpty(param.tag) ? ' is-active' : ''}">全部</a>
        <a th:each="tag : ${tags}"
           th:href="@{|/moments?tag=${tag.name}|}"
           class="plugin-chip"
           th:classappend="${#lists.contains(param.tag, tag.name) ? ' is-active' : ''}">
          <span th:text="${tag.name}">标签</span>
          <span th:text="${tag.momentCount}">0</span>
        </a>
      </div>
    </div>
  </header>

  <div th:if="${moments.items != null and !#lists.isEmpty(moments.items)}" class="plugin-page-stack">
    <article th:each="moment : ${moments.items}"
             class="plugin-page-card p-5 sm:p-6">
      <div class="flex items-start gap-4">
        <img th:src="${moment.owner?.avatar != null and !#strings.isEmpty(moment.owner.avatar) ? #strings.replace(moment.owner.avatar, 'http://', 'https://') : '/themes/theme-nucma/assets/default-avatar.svg'}"
             th:alt="${moment.owner?.displayName ?: '匿名用户'}"
             class="w-12 h-12 rounded-full object-cover shrink-0"
             loading="lazy" />
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
            <span class="theme-text-strong text-sm font-semibold"
                  th:text="${moment.owner?.displayName ?: '匿名用户'}">匿名用户</span>
            <time class="theme-text-soft text-xs"
                  th:text="${#temporals.format(moment.spec.releaseTime ?: moment.metadata.creationTimestamp, 'yyyy-MM-dd HH:mm')}">2026-05-14 12:00</time>
          </div>
          <div th:with="content=${moment.spec?.content}" class="mt-4">
            <div th:if="${content != null and content.html != null and !#strings.isEmpty(content.html)}"
                 class="plugin-richtext"
                 th:utext="${content.html}"></div>

            <div th:if="${content != null and content.medium != null and !#lists.isEmpty(content.medium)}"
                 class="plugin-media-grid plugin-media-grid--compact mt-4">
              <th:block th:each="momentItem : ${content.medium}">
                <div th:if="${momentItem.type.name == 'PHOTO'}"
                     class="plugin-media-frame aspect-[4/3]">
                  <img th:src="${momentItem.url}" alt="" loading="lazy" />
                </div>
                <div th:if="${momentItem.type.name == 'VIDEO'}"
                     class="plugin-media-frame aspect-video">
                  <video th:src="${momentItem.url}" controls preload="metadata"></video>
                </div>
                <div th:if="${momentItem.type.name == 'AUDIO'}"
                     class="plugin-audio-shell">
                  <audio th:src="${momentItem.url}" controls preload="none"></audio>
                </div>
                <a th:if="${momentItem.type.name == 'POST'}"
                   th:href="${momentItem.url}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="plugin-page-card p-4">
                  <p class="theme-text-strong text-sm font-semibold">关联文章</p>
                  <p class="theme-text-soft text-xs mt-1 line-clamp-2" th:text="${momentItem.url}">文章链接</p>
                </a>
              </th:block>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3 mt-5 pt-4 border-t theme-border-soft">
            <div class="plugin-chip-list" th:if="${moment.spec?.tags != null and !#lists.isEmpty(moment.spec.tags)}">
              <span th:each="tag : ${moment.spec?.tags}"
                    class="plugin-chip">
                <span th:text="${tag}">标签</span>
              </span>
            </div>
            <div class="flex items-center gap-4 text-xs theme-text-soft">
              <span th:text="|点赞 ${moment.stats?.upvote ?: 0}|">点赞 0</span>
              <span th:text="|评论 ${moment.stats?.approvedComment ?: moment.stats?.totalComment ?: 0}|">评论 0</span>
              <a th:href="@{|/moments/${moment.metadata.name}|}"
                 class="theme-outline-button px-3 py-1.5 rounded-full">查看详情</a>
            </div>
          </div>
        </div>
      </div>
    </article>
  </div>

  <div th:if="${moments.items == null or #lists.isEmpty(moments.items)}"
       class="plugin-page-card plugin-empty-state">
    <p class="theme-empty-text text-sm">暂无校园动态</p>
    <p class="theme-empty-meta text-xs">发布新的动态后会显示在这里。</p>
  </div>

  <div th:if="${moments.hasPrevious() || moments.hasNext()}" class="plugin-pagination">
    <a th:if="${moments.hasPrevious()}"
       th:href="@{${moments.prevUrl}}"
       class="theme-outline-button px-5 py-2 rounded-full text-sm">上一页</a>
    <span class="theme-text-soft text-sm" th:text="|第 ${moments.page} / ${moments.totalPages ?: 1} 页|">第 1 / 1 页</span>
    <a th:if="${moments.hasNext()}"
       th:href="@{${moments.nextUrl}}"
       class="theme-outline-button px-5 py-2 rounded-full text-sm">下一页</a>
  </div>
</section>
