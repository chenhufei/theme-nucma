<!DOCTYPE html>
<html lang="zh-CN" th:lang="${#locale.toLanguageTag()}" xmlns:th="https://www.thymeleaf.org" xmlns:halo="https://www.halo.run"
      th:fragment="html (title, content, description, canonical, image, pageType, robots, headExtra)"
      th:with="siteBase=${#strings.endsWith(site.url, '/') ? #strings.substring(site.url, 0, #strings.length(site.url) - 1) : site.url},
               seoDescription=${description != null and !#strings.isEmpty(description) ? description : (site.seo?.description ?: (site.subtitle ?: site.title))},
               seoCanonical=${canonical != null ? (#strings.isEmpty(canonical) ? '' : ((#strings.startsWith(canonical, 'http://') or #strings.startsWith(canonical, 'https://')) ? canonical : siteBase + canonical)) : site.url},
               rawSeoImage=${image != null and !#strings.isEmpty(image) ? image : site.logo},
               seoImage=${rawSeoImage != null and !#strings.isEmpty(rawSeoImage) ? ((#strings.startsWith(rawSeoImage, 'http://') or #strings.startsWith(rawSeoImage, 'https://')) ? rawSeoImage : siteBase + (#strings.startsWith(rawSeoImage, '/') ? rawSeoImage : '/' + rawSeoImage)) : ''},
               seoPageType=${pageType ?: 'website'}"
      class="no-js"
      data-theme="light" data-color-scheme="auto"
      data-visual-style="portal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" th:content="${#strings.defaultString(theme.config.appearance?.primary_color, '#D13E43')}" />
  <!-- 百度移动适配：同一套 HTML 响应式，声明对 PC / 移动都适用 -->
  <meta name="applicable-device" content="pc,mobile" />
  <title th:text="${title ?: site.title}"></title>
  <meta name="keywords" th:if="${site.seo?.keywords != null and !#strings.isEmpty(site.seo.keywords)}" th:content="${site.seo.keywords}" />
  <!--
    description：Halo 在「内容页 / 分类 / 标签」会用模型变量 seoMetaDescription 自行注入，
    此时主题不再输出，避免同名标签重复；其余页面（插件页、归档等）Halo 不注入，由这里补一条兜底。
    favicon 与 noindex 一律交给 Halo（DefaultFaviconHeadProcessor / GlobalSeoProcessor）。
  -->
  <meta name="description"
        th:if="${(seoMetaDescription == null or #strings.isEmpty(seoMetaDescription)) and !#strings.isEmpty(seoDescription)}"
        th:content="${seoDescription}" />
  <meta name="robots" th:if="${robots != null}" th:content="${robots}" />
  <th:block th:if="${theme.config.seo?.enable_metadata != false}">
  <link rel="canonical" th:if="${seoCanonical != null and !#strings.isEmpty(seoCanonical)}" th:href="${seoCanonical}" />
  <link rel="alternate" type="application/rss+xml" th:href="@{/rss.xml}" th:title="|${site.title} RSS|" />
  <meta property="og:site_name" th:content="${site.title}" />
  <meta property="og:title" th:content="${title ?: site.title}" />
  <meta property="og:description" th:content="${seoDescription}" />
  <meta property="og:type" th:content="${seoPageType}" />
  <meta property="og:url" th:if="${seoCanonical != null and !#strings.isEmpty(seoCanonical)}" th:content="${seoCanonical}" />
  <meta property="og:image" th:if="${seoImage != null and !#strings.isEmpty(seoImage)}" th:content="${seoImage}" />
  <meta name="twitter:card" th:content="${seoImage != null and !#strings.isEmpty(seoImage) ? 'summary_large_image' : 'summary'}" />
  <meta name="twitter:title" th:content="${title ?: site.title}" />
  <meta name="twitter:description" th:content="${seoDescription}" />
  <meta name="twitter:image" th:if="${seoImage != null and !#strings.isEmpty(seoImage)}" th:content="${seoImage}" />
  </th:block>
  <!-- 文章页的 Article 结构化数据由 modules/seo.html 输出（它能拿到 post），这里不再重复输出 Article，
       否则同一页会出现两个 Article，搜索引擎只会取第一个。 -->
  <script th:if="${theme.config.seo?.enable_structured_data != false and seoPageType != 'article'}" type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": /*[[${title ?: site.title}]]*/ "Page",
      "description": /*[[${seoDescription}]]*/ "",
      "url": /*[[${seoCanonical}]]*/ "",
      "image": /*[[${seoImage}]]*/ "",
      "isPartOf": {
        "@type": "WebSite",
        "name": /*[[${site.title}]]*/ "Site",
        "url": /*[[${site.url}]]*/ ""
      }
    }
  </script>
  <!-- KuaiKanShiJieTi 单文件约 728KB，仅少数标题/画布用到：不做全站 preload。
       全站预载会在多数页面白耗带宽，并触发 Chrome「preloaded using link preload but not used」提示；
       字体已由 main.css 的 @font-face（font-display: swap）在真正用到时按需加载。 -->
  <link rel="stylesheet" th:href="@{/assets/css/main.css(v=${theme.spec.version})}" />
  <script th:inline="javascript">
    (function() {
      var html = document.documentElement;
      html.classList.remove('no-js');
      html.classList.add('js-enabled');
      var saved = localStorage.getItem('theme-mode') || localStorage.getItem('theme');
      var mode = /*[[${#strings.defaultString(theme.config.appearance?.default_theme_mode, 'system')}]]*/ 'system';
      var resolvedMode = saved || mode;
      var isDark = resolvedMode === 'dark'
        || (resolvedMode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var effectiveMode = isDark ? 'dark' : 'light';
      html.setAttribute('data-theme', effectiveMode);
      html.setAttribute('data-color-scheme', effectiveMode);
      html.classList.remove('light', 'dark');
      html.classList.add(effectiveMode);

      var primaryColor = /*[[${#strings.defaultString(theme.config.appearance?.primary_color, '#D13E43')}]]*/ '#D13E43';
      if (primaryColor && primaryColor !== '#D13E43') {
        document.documentElement.style.setProperty('--primary', primaryColor);
        document.documentElement.style.setProperty('--color-primary', primaryColor);
        document.documentElement.style.setProperty('--color-error', primaryColor);
        var r = parseInt(primaryColor.slice(1,3), 16);
        var g = parseInt(primaryColor.slice(3,5), 16);
        var b = parseInt(primaryColor.slice(5,7), 16);
        document.documentElement.style.setProperty('--primary-rgb', r + ',' + g + ',' + b);
        document.documentElement.style.setProperty('--primary-light', 'rgb(' + Math.min(255, r+30) + ',' + Math.min(255, g+30) + ',' + Math.min(255, b+30) + ')');
        document.documentElement.style.setProperty('--primary-dark', 'rgb(' + Math.max(0, r-30) + ',' + Math.max(0, g-30) + ',' + Math.max(0, b-30) + ')');
      }
    })();
  </script>
  <!-- th:with 的优先级高于 th:if：变量定义必须提到父级，否则 th:if 先求值拿到 null，自定义代码注入永远不生效 -->
  <th:block th:with="customCss=${theme.config.appearance?.custom_css}">
    <style th:if="${customCss != null and !#strings.isEmpty(customCss)}" th:utext="${customCss}"></style>
  </th:block>
  <!-- 页面级 head 追加：调用方传 headExtra=~{::片段名}，不传则整段不渲染。
       目前只有 404 页用（它的工牌样式只在该页加载，不进主包）。
       noHead 是给「不需要额外 head」的调用方用的空片段：
       Thymeleaf 的 fragment 参数是严格签名校验，声明了就必须传，
       所以不需要加东西的页面传 headExtra=~{modules/layout :: noHead} 即可。
       ⚠️ 本片段签名一旦增减参数，所有 templates/**/*.html 里的 layout 调用都要同步，
       否则错误页也会渲染失败 → 任何异常都会级联成整站 500。
       tools/verify-theme.mjs 有一致性校验，改签名后跑 npm run check 会把漏改点全列出来。 -->
  <th:block th:fragment="noHead"></th:block>
  <th:block th:if="${headExtra != null}" th:replace="${headExtra}"></th:block>
</head>
<body class="page-body"
      th:with="siteBgStyle=${#strings.defaultString(theme.config.appearance?.site_bg, 'auto')},
               heroLayout=${#strings.defaultString(theme.config.home_hero?.layout, 'p42r')},
               heroOn=${heroLayout != 'none' and !#strings.startsWith(heroLayout, 'legacy-')},
               bgLayout=${#strings.startsWith(heroLayout, 'legacy-') ? 'legacy' : heroLayout},
               heroKeepsTint=${bgLayout == 'cover' or bgLayout == 'aurora' or bgLayout == 'p41'},
               navCfg=${theme.config.navigation},
               hdrLogoMode=${#strings.defaultString(navCfg?.logo_mode, 'mark')},
               hdrLogoImage=${navCfg?.logo_image},
               hdrBrandName=${#strings.isEmpty(navCfg?.brand_name) ? site.title : navCfg.brand_name},
               hdrBrandEn=${navCfg?.brand_en},
               hdrCtaText=${navCfg?.header_cta_text},
               hdrCtaUrl=${#strings.defaultString(navCfg?.header_cta_url, '/members')},
               hdrLogoChar=${!#strings.isEmpty(navCfg?.brand_en) ? #strings.substring(navCfg.brand_en, 0, 1) : (!#strings.isEmpty(navCfg?.brand_name) ? #strings.substring(navCfg.brand_name, 0, 1) : 'N')}"
      th:classappend="${(seoPageType == 'article' ? ' page-article' : '') + (siteBgStyle == 'off' ? ' site-bg-off' : '') + (siteBgStyle == 'auto' and !heroKeepsTint ? ' site-bg-white' : '')}"
      th:data-template="${_templateId}"
      th:data-theme-version="${theme.spec.version}"
      th:style="${'--site-paper:' + (#strings.defaultString(theme.config.appearance?.site_bg_color, '#FFFFFF'))}">
  <div class="site-bg" aria-hidden="true"
       th:classappend="${' site-bg--' + siteBgStyle + (siteBgStyle == 'auto' ? ' site-bg--h-' + bgLayout : '')}"></div>
  <a class="skip-link" href="#mainContent" th:text="#{a11y.skipToContent}">跳到主要内容</a>
  <div th:if="${seoPageType == 'article'}"
       id="readingProgress"
       class="reading-progress"
       role="progressbar"
       aria-label="文章阅读进度" th:aria-label="#{post.readProgress}"
       aria-valuemin="0"
       aria-valuemax="100"
       aria-valuenow="0">
    <span class="reading-progress__bar"></span>
  </div>

  <!-- 顶部导航：与首屏共用同一份页头片段（modules/site-header），造型跟随当前首屏方案。
       首页首屏不内置页头，所以这里对所有页面都渲染。 -->
  <th:block th:fragment="siteHeader">
    <th:block th:replace="~{modules/site-header :: siteHeader(layout=${#strings.defaultString(theme.config.home_hero?.layout, 'p42r')}, mode='page')}"></th:block>
  </th:block>

  <!-- 划词工具条：选中正文文字后浮出，划线记录只存在读者本地，不需要登录 -->
  <div th:if="${seoPageType == 'article' and theme.config.sidebar?.highlight_enabled != false}"
       id="hlToolbar"
       class="hl-toolbar"
       role="toolbar"
       th:aria-label="#{hl.toolbar}"
       th:attr="data-tip-saved=#{hl.saved},data-tip-removed=#{hl.removed},data-tip-select=#{hl.selectFirst}">
    <button type="button" class="hl-toolbar__btn" data-hl-action="mark" th:text="#{hl.mark}">划线</button>
    <button type="button" class="hl-toolbar__btn" data-hl-action="unmark" hidden th:text="#{hl.unmark}">取消划线</button>
    <button type="button" class="hl-toolbar__btn hl-toolbar__btn--share" data-hl-action="share" th:text="#{hl.share}">分享</button>
  </div>

  <!-- 顶部导航：首页启用新版首屏时由首屏自带的页头接管，这里不再重复渲染 -->

  <!-- 移动端菜单 -->
  <div id="mobileMenu" class="mobile-menu" aria-hidden="true" th:fragment="mobileMenu">
    <div class="mobile-menu-overlay"></div>
    <div class="mobile-menu-content">
      <div class="mobile-menu-header">
        <span th:text="${site.title}"></span>
        <button type="button" data-mobile-menu-close class="btn btn-ghost btn-circle btn-sm icon-btn" aria-label="关闭" th:aria-label="#{common.close}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <nav class="mobile-nav" aria-label="移动端导航" th:aria-label="#{nav.mobileAria}">
        <th:block th:if="${theme.config.navigation?.header_menu != null and !#strings.isEmpty(theme.config.navigation?.header_menu)}"
                  th:with="menu = ${menuFinder.getByName(theme.config.navigation?.header_menu)}">
          <th:block th:if="${menu != null and !#lists.isEmpty(menu.menuItems)}">
            <div class="mobile-nav-section mobile-nav-section--menu" role="group" aria-label="菜单导航" th:aria-label="#{nav.menuAria}">
              <div class="mobile-nav-label" th:text="#{nav.menuAria}">菜单导航</div>
              <div class="mobile-menu-links">
                <a th:each="item : ${menu.menuItems}"
                   th:if="${!#strings.isEmpty(item.status?.href ?: item.spec?.href)}"
                   class="mobile-nav-link mobile-nav-link--menu"
                   th:href="@{${item.status?.href ?: item.spec?.href}}"
                   th:text="${item.status?.displayName ?: item.spec?.displayName}"
                   th:target="${item.spec?.target?.value}"></a>
              </div>
            </div>
          </th:block>
        </th:block>
        <th:block th:with="mobileHeaderLinks=${theme.config.navigation?.custom_links}">
          <th:block th:if="${mobileHeaderLinks != null and !#lists.isEmpty(mobileHeaderLinks)}">
            <div class="mobile-nav-section mobile-nav-section--custom" role="group" aria-label="自定义链接" th:aria-label="#{nav.customLinks}">
              <div class="mobile-custom-links">
                <a th:each="link : ${mobileHeaderLinks}"
                   th:if="${link.url != null and !#strings.isEmpty(link.url) and (link.text != null and !#strings.isEmpty(link.text) or link.image != null and !#strings.isEmpty(link.image))}"
                   class="mobile-nav-link mobile-nav-link--custom"
                   th:href="${link.url}"
                   th:target="${link.target ?: '_blank'}"
                   th:aria-label="${link.text != null and !#strings.isEmpty(link.text) ? link.text : link.url}">
                  <img th:if="${link.image != null and !#strings.isEmpty(link.image)}"
                       th:src="${link.image}"
                       th:alt="${link.text != null ? link.text : ''}"
                       width="42" height="42" />
                  <span th:if="${link.text != null and !#strings.isEmpty(link.text)}" th:text="${link.text}"></span>
                </a>
              </div>
            </div>
          </th:block>
        </th:block>
      </nav>
    </div>
  </div>

  <!-- 主内容 -->
  <main id="mainContent" class="site-main" tabindex="-1">
    <div class="container" th:classappend="${_templateId == 'index'} ? 'home-container' : ''">
      <th:block th:replace="${content}" />
    </div>
  </main>

  <th:block th:if="${seoPageType == 'article'}">
    <div id="articleMobileActions" class="article-mobile-actions" aria-label="文章工具" th:aria-label="#{post.tools}">
      <button th:if="${theme.config.sidebar?.auto_toc != false}"
              id="mobileTocToggle"
              class="mobile-toc-toggle article-mobile-action"
              type="button"
              aria-controls="mobileTocDrawer"
              aria-expanded="false"
              aria-label="打开文章目录" th:aria-label="#{toc.open}"
              title="文章目录" th:title="#{toc.title}"
              hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M8 6h13M8 12h13M8 18h13"></path>
          <path d="M3 6h.01M3 12h.01M3 18h.01"></path>
        </svg>
        <span th:text="#{common.toc}">目录</span>
      </button>
      <button type="button" class="article-mobile-action" data-article-share aria-label="分享文章" th:aria-label="#{post.share}" title="分享文章" th:title="#{post.share}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
          <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path>
        </svg>
        <span th:text="#{common.share}">分享</span>
      </button>
      <button type="button" class="article-mobile-action" data-article-copy aria-label="复制文章链接" th:aria-label="#{post.copyArticleLink}" title="复制文章链接" th:title="#{post.copyArticleLink}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span th:text="#{common.copy}">复制</span>
      </button>
      <button type="button" class="article-mobile-action" data-article-top aria-label="返回文章顶部" th:aria-label="#{post.backToTop}" title="返回顶部" th:title="#{common.backToTop}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m18 15-6-6-6 6"></path>
        </svg>
        <span th:text="#{post.top}">顶部</span>
      </button>
      <span id="articleActionStatus" class="sr-only" role="status" aria-live="polite"></span>
    </div>

    <th:block th:if="${theme.config.sidebar?.auto_toc != false}">
      <dialog id="mobileTocDrawer" class="mobile-toc-drawer" aria-labelledby="mobileTocTitle" hidden>
      <div class="mobile-toc-drawer__panel">
        <header class="mobile-toc-drawer__header">
          <h2 id="mobileTocTitle" th:text="#{toc.title}">文章目录</h2>
          <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-toc-close aria-label="关闭目录" th:aria-label="#{toc.close}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </header>
        <nav id="mobileToc" class="toc mobile-toc" aria-label="文章目录" th:aria-label="#{toc.title}"></nav>
      </div>
      </dialog>
    </th:block>
  </th:block>

  <dialog th:if="${seoPageType == 'article'}"
          id="articleImageViewer"
          class="article-image-viewer"
          aria-labelledby="articleImageViewerTitle"
          hidden>
    <h2 id="articleImageViewerTitle" class="visually-hidden" th:text="#{lightbox.title}">图片预览</h2>
    <div class="article-image-viewer__shell">
      <!-- 顶部：计数 + 关闭，浮在黑场上 -->
      <div class="article-image-viewer__top">
        <span id="articleImageViewerCounter" class="article-image-viewer__counter" aria-live="polite"></span>
        <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-image-viewer-close aria-label="关闭图片预览" th:aria-label="#{lightbox.close}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- 舞台：左箭头 · 图片与说明 · 右箭头 -->
      <div class="article-image-viewer__stage">
        <button type="button" class="viewer-nav viewer-nav--prev" data-image-viewer-prev aria-label="上一张图片" th:aria-label="#{lightbox.prev}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="m15 18-6-6 6-6"></path>
          </svg>
        </button>
        <div class="article-image-viewer__body">
          <div id="articleImageViewerCanvas" class="article-image-viewer__canvas">
            <img id="articleImageViewerImage" alt="" width="1600" height="1200" decoding="async" draggable="false" />
          </div>
          <p id="articleImageViewerCaption" class="article-image-viewer__caption"></p>
        </div>
        <button type="button" class="viewer-nav viewer-nav--next" data-image-viewer-next aria-label="下一张图片" th:aria-label="#{lightbox.next}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </button>
      </div>

      <!-- 缩放工具：右下角浮动 -->
      <div class="article-image-viewer__toolbar" aria-label="图片缩放" th:aria-label="#{lightbox.zoom}">
        <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-image-viewer-zoom-out aria-label="缩小图片" th:aria-label="#{lightbox.zoomOut}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35M8 11h6"></path>
          </svg>
        </button>
        <button type="button" class="btn btn-ghost btn-sm viewer-reset-btn" data-image-viewer-reset aria-label="重置图片缩放" th:aria-label="#{lightbox.zoomReset}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path>
          </svg>
          <span id="articleImageViewerZoom">100%</span>
        </button>
        <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-image-viewer-zoom-in aria-label="放大图片" th:aria-label="#{lightbox.zoomIn}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35M11 8v6M8 11h6"></path>
          </svg>
        </button>
      </div>
    </div>
  </dialog>

  <!-- 分享图：划词或划线后生成的图片卡片（含二维码），构图在 share-card.js 里 -->
  <dialog th:if="${seoPageType == 'article' and theme.config.sidebar?.highlight_enabled != false}"
          id="shareCardDialog"
          class="share-card-dialog"
          aria-labelledby="shareCardTitle"
          th:attr="data-qr-script=@{/assets/js/qr-encoder.js(v=${theme.spec.version})},
                   data-brand=#{shareCard.brand},
                   data-brand-short=#{shareCard.brandShort},
                   data-tip-qr=#{shareCard.qrHint},
                   data-tip-saved=#{shareCard.saved},
                   data-tip-failed=#{shareCard.failed}">
    <div class="share-card-dialog__panel">
      <header class="share-card-dialog__head">
        <h2 id="shareCardTitle" th:text="#{shareCard.title}">分享图片</h2>
        <button type="button" class="btn btn-ghost btn-circle btn-sm viewer-icon-btn" data-share-card-close
                aria-label="关闭分享图" th:aria-label="#{lightbox.close}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </header>
      <div class="share-card-dialog__stage">
        <p class="share-card-dialog__loading" data-share-card-loading th:text="#{shareCard.generating}">正在生成图片…</p>
        <img id="shareCardImage" alt="分享图片预览" th:alt="#{shareCard.title}" width="1080" height="1440" decoding="async" />
      </div>
      <p class="share-card-dialog__tip" th:text="#{shareCard.tip}">长按图片保存，或点下面的按钮下载</p>
      <div class="share-card-dialog__actions">
        <button type="button" class="btn btn-primary btn-sm" data-share-card-download th:text="#{shareCard.download}">下载图片</button>
        <button type="button" class="btn btn-outline btn-sm" data-share-card-native hidden th:text="#{shareCard.share}">直接分享</button>
        <span id="shareCardStatus" class="sr-only" role="status" aria-live="polite"></span>
      </div>
    </div>
  </dialog>


  <!-- 页脚 -->
  <footer class="site-footer" th:fragment="siteFooter"
          th:with="footerCopyright=${theme.config.footer?.copyright}">
    <div class="container">
      <div class="footer-inner">
        <!-- 站点信息 -->
        <div class="footer-col">
          <div class="footer-col-title" th:text="${site.title}">站点名称</div>
          <div class="footer-info">
            <p th:if="${site.subtitle != null and !#strings.isEmpty(site.subtitle)}"
               th:text="${site.subtitle}"></p>
            <p th:if="${footerCopyright != null and !#strings.isEmpty(footerCopyright)}"
               th:text="${footerCopyright}"></p>
          </div>
        </div>

        <!-- 页脚菜单栏目：按后台「页脚菜单栏目」的配置顺序逐栏渲染。
             菜单项的链接与显示名由 MenuItem.status 提供，但未调和的菜单项 status 为 null，
             必须回退到 spec——否则会渲染出空 href／空文字，前端会误判为「没有配置菜单」而补默认导航。 -->
        <th:block th:with="footerMenus = ${theme.config.footer?.footer_menus}">
          <th:block th:with="footerColumns = ${footerMenus == null ? null : footerMenus.?[menu != null and !#strings.isEmpty(menu)]}">
            <th:block th:if="${footerColumns != null and !#lists.isEmpty(footerColumns)}"
                      th:with="footerMenuNames = ${footerColumns.![menu]},
                               footerMenuVos = ${menuFinder.getByNames(footerMenuNames)}">
              <div class="footer-col"
                   th:each="menu : ${footerMenuVos}"
                   th:if="${menu.menuItems != null and !#lists.isEmpty(menu.menuItems)}"
                   th:with="footerColumnIndex = ${footerMenuNames.indexOf(menu.metadata.name)},
                            footerColumn = ${footerColumnIndex >= 0 ? footerColumns[footerColumnIndex] : null}">
                <div class="footer-col-title"
                     th:text="${footerColumn != null and footerColumn.title != null and !#strings.isEmpty(footerColumn.title) ? footerColumn.title : #messages.msg('footer.quickNav')}">快捷导航</div>
                <nav class="footer-nav">
                  <a th:each="item : ${menu.menuItems}"
                     th:if="${!#strings.isEmpty(item.status?.href ?: item.spec?.href)}"
                     th:href="@{${item.status?.href ?: item.spec?.href}}"
                     th:text="${item.status?.displayName ?: item.spec?.displayName}"
                     th:target="${item.spec?.target?.value}"></a>
                </nav>
              </div>
            </th:block>
            <!-- 兼容：未配置新列表时，回退到页头菜单。
                 页头菜单是站点自己的「站点」栏目，大多数站点只维护这一份菜单，
                 页脚直接复用它，比凭空渲染一组内置链接更符合预期。 -->
            <th:block th:unless="${footerColumns != null and !#lists.isEmpty(footerColumns)}"
                      th:with="footerMenuName = ${#strings.defaultString(theme.config.navigation?.header_menu, '')}">
              <div class="footer-col"
                   th:if="${!#strings.isEmpty(footerMenuName)}"
                   th:with="menu = ${menuFinder.getByName(footerMenuName)}">
                <div class="footer-col-title"
                     th:text="${menu?.spec?.displayName ?: #messages.msg('footer.quickNav')}">快捷导航</div>
                <nav class="footer-nav" th:if="${menu != null and menu.menuItems != null and !#lists.isEmpty(menu.menuItems)}">
                  <a th:each="item : ${menu.menuItems}"
                     th:if="${!#strings.isEmpty(item.status?.href ?: item.spec?.href)}"
                     th:href="@{${item.status?.href ?: item.spec?.href}}"
                     th:text="${item.status?.displayName ?: item.spec?.displayName}"
                     th:target="${item.spec?.target?.value}"></a>
                </nav>
              </div>
            </th:block>
          </th:block>
        </th:block>

        <!-- 自定义内容 -->
        <th:block th:with="customColumnItems=${theme.config.footer?.custom_column_items},
                         customColumnTitle=${theme.config.footer?.custom_column_title}">
          <div class="footer-col" th:if="${customColumnItems != null and !#lists.isEmpty(customColumnItems)}">
            <div class="footer-col-title" th:text="${customColumnTitle ?: #messages.msg('footer.followUs')}">关注我们</div>
            <div class="footer-custom-items">
              <th:block th:each="item : ${customColumnItems}">
                <a th:if="${item.url != null and !#strings.isEmpty(item.url)}"
                   th:href="${item.url}"
                   th:target="${item.target ?: '_blank'}"
                   class="footer-custom-item"
                   th:aria-label="${item.title != null and !#strings.isEmpty(item.title) ? item.title : item.url}">
                  <img th:if="${item.image != null and !#strings.isEmpty(item.image)}"
                       th:src="${item.image}" th:alt="${item.title}" class="footer-custom-img" width="80" height="80" loading="lazy" decoding="async" />
                  <span th:text="${item.title}" class="footer-custom-text"></span>
                </a>
                <div th:unless="${item.url != null and !#strings.isEmpty(item.url)}" class="footer-custom-item footer-custom-static">
                  <img th:if="${item.image != null and !#strings.isEmpty(item.image)}"
                       th:src="${item.image}" th:alt="${item.title}" class="footer-custom-img" width="80" height="80" loading="lazy" decoding="async" />
                  <span th:text="${item.title}" class="footer-custom-text"></span>
                </div>
              </th:block>
            </div>
          </div>
        </th:block>
      </div>

      <!-- 底部版权 -->
      <div class="footer-bottom">
        <div class="footer-copyright">
          <span th:if="${footerCopyright == null or #strings.isEmpty(footerCopyright)}">
            &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span>
            <th:block th:text="${site.title}"></th:block>
          </span>
        </div>
        <div class="footer-links">
          <th:block th:with="icpNumber=${theme.config.footer?.icp_number},
                           icpLink=${theme.config.footer?.icp_link},
                           policeNumber=${theme.config.footer?.police_number},
                           policeRecordCode=${theme.config.footer?.police_record_code}">
            <span th:if="${icpNumber != null and !#strings.isEmpty(icpNumber)}">
              <a th:href="${icpLink ?: 'https://beian.miit.gov.cn/'}"
                 target="_blank" rel="noopener noreferrer"
                 th:text="${icpNumber}"></a>
            </span>
            <span th:if="${policeNumber != null and !#strings.isEmpty(policeNumber)}">
              <a th:if="${policeRecordCode != null and !#strings.isEmpty(policeRecordCode)}"
                 th:href="|https://beian.mps.gov.cn/#/query/webSearch?code=${policeRecordCode}|"
                 target="_blank" rel="noopener noreferrer"
                 th:text="${policeNumber}"></a>
              <a th:unless="${policeRecordCode != null and !#strings.isEmpty(policeRecordCode)}"
                 href="https://beian.mps.gov.cn/"
                 target="_blank" rel="noopener noreferrer"
                 th:text="${policeNumber}"></a>
            </span>
          </th:block>
        </div>
      </div>
    </div>
    <!-- 页脚样式「样式一」：样式与行为已外置到 src/footer/，模板只留开关与站点数据注入 -->
    <th:block th:if="${theme.config.footer?.footer_style == 'style12'}">
      <link rel="stylesheet" th:href="@{/assets/footer/style12.css(v=${theme.spec.version})}" />
      <script th:inline="javascript">
        window.__NUCMA_FOOTER_12 = {
          archivesUri: /*[[${#strings.defaultString(site.routes?.archivesUri, '/archives')}]]*/ '/archives',
          categoriesUri: /*[[${#strings.defaultString(site.routes?.categoriesUri, '/categories')}]]*/ '/categories',
          siteLogo: /*[[${site.logo ?: '/upload/1783587678472.png'}]]*/ '/upload/1783587678472.png',
          siteTitle: /*[[${site.title ?: '全国高校自媒体联盟'}]]*/ '全国高校自媒体联盟',
          joinUrl: /*[[${#strings.defaultString(theme.config.footer?.footer_join_url, '')}]]*/ '',
          joinText: /*[[${#strings.defaultString(theme.config.footer?.footer_join_text, '加入我们')}]]*/ '加入我们',
          joinStyle: /*[[${#strings.defaultString(theme.config.footer?.footer_join_style, 'solid')}]]*/ 'solid',
          joinIcon: /*[[${#strings.defaultString(theme.config.footer?.footer_join_icon, 'arrow')}]]*/ 'arrow',
          joinImage: /*[[${#strings.defaultString(theme.config.footer?.footer_join_image, '')}]]*/ '',
          siteSubtitle: /*[[${site.subtitle ?: ''}]]*/ '',
          slogan: /*[[${theme.config.footer?.footer_slogan}]]*/ null,
          copyright: /*[[${#strings.defaultString(theme.config.footer?.copyright, '')}]]*/ ''
        };
      </script>
      <script defer th:src="@{/assets/footer/style12.js(v=${theme.spec.version})}"></script>
    </th:block>
    <!-- 页脚样式「样式三」：样式与行为已外置到 src/footer/，模板只留开关与站点数据注入 -->
    <th:block th:if="${theme.config.footer?.footer_style == 'style33'}">
      <link rel="stylesheet" th:href="@{/assets/footer/style33.css(v=${theme.spec.version})}" />
      <script th:inline="javascript">
        window.__NUCMA_FOOTER_33 = {
          archivesUri: /*[[${#strings.defaultString(site.routes?.archivesUri, '/archives')}]]*/ '/archives',
          categoriesUri: /*[[${#strings.defaultString(site.routes?.categoriesUri, '/categories')}]]*/ '/categories',
          siteLogo: /*[[${site.logo ?: '/upload/1783587678472.png'}]]*/ '/upload/1783587678472.png',
          siteTitle: /*[[${site.title ?: '全国高校自媒体联盟'}]]*/ '全国高校自媒体联盟',
          joinUrl: /*[[${#strings.defaultString(theme.config.footer?.footer_join_url, '')}]]*/ '',
          joinText: /*[[${#strings.defaultString(theme.config.footer?.footer_join_text, '加入我们')}]]*/ '加入我们',
          joinStyle: /*[[${#strings.defaultString(theme.config.footer?.footer_join_style, 'solid')}]]*/ 'solid',
          joinIcon: /*[[${#strings.defaultString(theme.config.footer?.footer_join_icon, 'arrow')}]]*/ 'arrow',
          joinImage: /*[[${#strings.defaultString(theme.config.footer?.footer_join_image, '')}]]*/ '',
          siteSubtitle: /*[[${site.subtitle ?: ''}]]*/ '',
          slogan: /*[[${theme.config.footer?.footer_slogan}]]*/ null,
          copyright: /*[[${#strings.defaultString(theme.config.footer?.copyright, '')}]]*/ ''
        };
      </script>
      <script defer th:src="@{/assets/footer/style33.js(v=${theme.spec.version})}"></script>
    </th:block>
  </footer>

  <halo:footer />
  <th:block th:replace="~{modules/search-overlay :: overlay}"></th:block>
  <th:block th:replace="~{modules/i18n-dict :: dict}"></th:block>
  <script th:inline="javascript">
    window.NUCMA_RUNTIME = {
      debug: /*[[${theme.config.appearance?.developer_mode == true}]]*/ false,
      version: /*[[${theme.spec.version}]]*/ "development"
    };
  </script>
  <script defer th:src="@{/assets/js/main.js(v=${theme.spec.version})}"></script>
  <th:block th:with="customJs=${theme.config.appearance?.custom_js}">
    <script th:if="${customJs != null and !#strings.isEmpty(customJs)}" th:utext="${customJs}"></script>
  </th:block>
</body>
</html>
