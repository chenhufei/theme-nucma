<section class="category-shell mx-auto px-5 sm:px-6 py-8 sm:py-16" style="max-width:var(--container-max-w);">

  <div class="theme-page-intro reveal">
    <h1 class="theme-page-title">内容分类</h1>
    <p class="theme-page-subtitle">按主题浏览联盟公告与组织资讯</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" th:if="${categories != null and categories.items != null}">
    <a th:each="category : ${categories.items}"
       th:href="@{${category.status.permalink}}"
       class="taxonomy-card theme-surface-panel group flex items-center gap-4 p-5 rounded-2xl accent-border-hover transition-colors duration-150 reveal">
      <div class="shrink-0 w-11 h-11 rounded-xl flex items-center justify-center text-xl accent-soft-bg">
        <svg class="w-5 h-5 accent-text" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="font-semibold theme-text-strong accent-text-hover transition-colors line-clamp-1"
            th:text="${category.spec.displayName}"></h3>
        <p class="text-xs theme-text-soft mt-0.5 line-clamp-1"
           th:text="${category.spec.description ?: '点击浏览文章'}"></p>
      </div>
      <svg class="theme-arrow-icon w-4 h-4 accent-text-hover shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  <div th:if="${categories == null or categories.items == null or #lists.isEmpty(categories.items)}"
       class="text-center py-16 reveal">
    <div class="theme-empty-icon-wrap w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center">
      <svg class="theme-empty-icon w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
      </svg>
    </div>
    <p class="theme-empty-text">暂无内容分类</p>
  </div>

</section>
