<style>
  .archive-shell,
  .category-shell,
  .tag-shell,
  .page-shell {
    position: relative;
  }

  .archive-headline,
  .page-headline {
    letter-spacing: 0;
  }

  .archive-year-row {
    margin-bottom: 1.5rem;
  }

  .archive-entry {
    transition: background-color 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
  }

  .archive-entry:hover {
    transform: none;
    background: rgba(var(--color-accent), 0.03);
    border-color: rgba(var(--color-accent), 0.14);
  }

</style>

<section class="archive-shell mx-auto px-5 sm:px-6 py-8 sm:py-16" style="max-width:var(--container-max-w);">

  <div class="theme-page-intro reveal">
    <h1 class="archive-headline theme-page-title">组织资讯</h1>
    <p class="theme-page-subtitle"
       th:if="${archives != null and archives.items != null}">
      共 <span th:text="${#lists.size(archives.items)}">0</span> 个年份的发布记录
    </p>
  </div>

  <div class="space-y-12" th:if="${archives != null and !#lists.isEmpty(archives.items)}">
    <th:block th:each="archive : ${archives.items}">
      <div>
        <div class="archive-year-row flex items-center gap-3 mb-6">
          <span class="text-2xl font-bold theme-text-strong" th:text="${archive.year}"></span>
          <div class="theme-divider-soft flex-1 h-px"></div>
        </div>

        <div class="space-y-8 pl-4 border-l-2 theme-border-soft ml-3">
          <th:block th:each="monthData : ${archive.months}">
            <div class="relative">
              <div class="absolute -left-[1.375rem] top-1.5 w-3 h-3 rounded-full border-2 border-white dark:border-slate-950"
                   style="background:rgb(var(--color-accent));"></div>

              <div class="mb-3 pl-4">
                <span class="archive-month-badge theme-surface-panel inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold theme-text-muted">
                  <span th:text="${monthData.month + ' 月'}"></span>
                  <span class="opacity-60" th:text="'(' + ${#lists.size(monthData.posts)} + ' 篇)'"></span>
                </span>
              </div>

              <div class="pl-4 space-y-2">
                <a th:each="post : ${monthData.posts}"
                   th:href="${post.status?.permalink}"
                   class="archive-entry group flex items-center gap-4 py-2.5 px-3 rounded-xl border border-transparent transition-colors duration-150">
                  <time class="shrink-0 w-12 text-xs theme-text-soft tabular-nums text-right"
                        th:text="${#temporals.format(post.spec?.publishTime, 'MM-dd')}"></time>
                  <h3 class="flex-1 min-w-0 text-sm font-medium theme-text-muted accent-text-hover transition-colors line-clamp-1"
                      th:text="${post.spec?.title}"></h3>
                  <svg class="theme-arrow-icon shrink-0 w-3.5 h-3.5 accent-text-hover transition-colors duration-150"
                       fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                  </svg>
                </a>
              </div>
            </div>
          </th:block>
        </div>
      </div>
    </th:block>
  </div>

  <div th:if="${archives == null or archives.items == null or #lists.isEmpty(archives.items)}"
       class="flex flex-col items-center justify-center py-24 text-center">
    <div class="theme-empty-icon-wrap w-16 h-16 rounded-2xl flex items-center justify-center mb-4">
      <svg class="theme-empty-icon w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
      </svg>
    </div>
    <p class="theme-empty-text text-sm">暂无发布记录</p>
  </div>

  <div class="flex justify-center gap-3 mt-12"
       th:if="${archives != null and (archives.hasPrevious() or archives.hasNext())}">
    <a th:if="${archives.hasPrevious()}" th:href="@{${archives.prevUrl}}"
       class="theme-outline-button px-5 py-2 text-sm rounded-full transition-colors">上一页</a>
    <a th:if="${archives.hasNext()}" th:href="@{${archives.nextUrl}}"
       class="theme-outline-button px-5 py-2 text-sm rounded-full transition-colors">下一页</a>
  </div>

</section>
