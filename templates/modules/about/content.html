<style>
  .about-shell,
  .links-shell,
  .members-shell,
  .auth-shell {
    position: relative;
  }

  .about-contact-link:hover {
    transform: translateY(-1px);
  }

</style>

<div class="about-shell">

  <!-- Hero 区 -->
  <section style="padding:5rem 1.25rem 3rem;text-align:center;">
  <div class="about-hero-card theme-page-intro theme-page-intro--center theme-page-shell mb-0 reveal">

      <!-- 头像 -->
      <div style="display:flex;justify-content:center;margin-bottom:1.5rem;">
        <div class="about-avatar-frame theme-avatar-frame-lg">
          <img th:if="${theme.config.about?.avatar != null and !#strings.isEmpty(theme.config.about.avatar) and (#strings.startsWith(theme.config.about.avatar,'http://') or #strings.startsWith(theme.config.about.avatar,'https://') or #strings.startsWith(theme.config.about.avatar,'/'))}"
               th:src="${#strings.replace(theme.config.about.avatar, 'http://', 'https://')}"
               th:alt="${theme.config.about.name ?: site.title}"
               loading="lazy"
               />
          <img th:if="${(theme.config.about?.avatar == null or #strings.isEmpty(theme.config.about?.avatar) or !(#strings.startsWith(theme.config.about.avatar,'http://') or #strings.startsWith(theme.config.about.avatar,'https://') or #strings.startsWith(theme.config.about.avatar,'/'))) and site.logo != null and !#strings.isEmpty(site.logo) and (#strings.startsWith(site.logo,'http://') or #strings.startsWith(site.logo,'https://') or #strings.startsWith(site.logo,'/'))}"
               th:src="${#strings.replace(site.logo, 'http://', 'https://')}" th:alt="${site.title ?: 'Nucma'}"
               loading="lazy"
               />
          <div th:if="${(theme.config.about?.avatar == null or #strings.isEmpty(theme.config.about?.avatar) or !(#strings.startsWith(theme.config.about.avatar,'http://') or #strings.startsWith(theme.config.about.avatar,'https://') or #strings.startsWith(theme.config.about.avatar,'/'))) and (site.logo == null or #strings.isEmpty(site.logo) or !(#strings.startsWith(site.logo,'http://') or #strings.startsWith(site.logo,'https://') or #strings.startsWith(site.logo,'/')))}"
               style="width:100%;height:100%;background-color: rgb(var(--color-primary));
                      display:flex;align-items:center;justify-content:center;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="white" opacity="0.9">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 姓名 -->
      <h1 class="theme-page-title text-3xl sm:text-4xl mb-2"
          th:text="${theme.config.about?.name != null and !#strings.isEmpty(theme.config.about.name) and theme.config.about.name != '张三' and theme.config.about.name != '博主' ? theme.config.about.name : '全国高校自媒体联盟'}">全国高校自媒体联盟</h1>

      <!-- 职位 -->
      <p class="text-sm font-medium mb-3"
         style="color:rgb(var(--color-accent))"
         th:text="${theme.config.about?.job_title != null and !#strings.isEmpty(theme.config.about.job_title) and !#strings.contains(theme.config.about.job_title, '工程师') and !#strings.contains(theme.config.about.job_title, '设计师') and !#strings.contains(theme.config.about.job_title, '开发者') and !#strings.contains(theme.config.about.job_title, '博主') ? theme.config.about.job_title : '第三方校园媒体协作组织'}"></p>

      <!-- 所在地 -->
      <p class="theme-text-soft text-sm mb-4 flex items-center justify-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span th:text="${theme.config.about?.location != null and !#strings.isEmpty(theme.config.about.location) and !#strings.contains(theme.config.about.location, '北京') ? theme.config.about.location : '重庆，中国'}"></span>
      </p>

      <!-- 简介 -->
      <p class="theme-text-muted text-base leading-relaxed max-w-xl mx-auto"
         th:text="${theme.config.about?.bio != null and !#strings.isEmpty(theme.config.about.bio) and !#strings.contains(theme.config.about.bio, '热爱技术') and !#strings.contains(theme.config.about.bio, '记录生活') and !#strings.contains(theme.config.about.bio, '个人') ? theme.config.about.bio : '全国高校自媒体联盟（NUCMA）由校园墙组织共同发起，致力于促进校园自媒体规范运营，为校园群体提供更便捷的沟通平台。'}"></p>

      <!-- 站点统计 -->
      <div th:if="${theme.config.about?.show_stats != false}"
           class="theme-border-softer flex items-center justify-center gap-8 mt-6 pt-6 border-t">
        <div class="text-center">
          <p class="theme-text-strong text-2xl font-bold" th:text="${posts?.total ?: 0}">0</p>
          <p class="theme-text-soft text-xs mt-0.5">文章</p>
        </div>
        <div class="theme-divider-soft w-px h-8"></div>
        <div class="text-center">
          <p class="theme-text-strong text-2xl font-bold" th:text="${categories?.total ?: 0}">0</p>
          <p class="theme-text-soft text-xs mt-0.5">分类</p>
        </div>
        <div class="theme-divider-soft w-px h-8"></div>
        <div class="text-center">
          <p class="theme-text-strong text-2xl font-bold" th:text="${tags?.total ?: 0}">0</p>
          <p class="theme-text-soft text-xs mt-0.5">标签</p>
        </div>
      </div>
    </div>
  </section>

  <div class="theme-page-shell theme-page-shell--padded pb-20 space-y-6">

    <!-- 方向标签 -->
    <div th:if="${theme.config.about?.show_skills != false and theme.config.about?.skills != null and !#lists.isEmpty(theme.config.about.skills)}"
         th:with="skills=${theme.config.about.skills},
                  hasLegacySkills=${skills != null and !#lists.isEmpty(skills) and skills[0].name != null and (#strings.contains(skills[0].name, '前端') or #strings.contains(skills[0].name, '设计') or #strings.contains(skills[0].name, '产品') or #strings.contains(skills[0].name, '开发'))}"
         class="about-panel theme-section-card reveal">
      <h2 class="theme-text-strong text-base font-semibold mb-4 flex items-center gap-2">
        <svg class="w-4 h-4" style="color:rgb(var(--color-accent))" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        服务方向
      </h2>
      <div th:if="${!hasLegacySkills}" class="flex flex-wrap gap-2">
        <span th:each="skill : ${theme.config.about.skills}"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium"
              th:style="${'background:' + (skill.color != null and !#strings.isEmpty(skill.color) ? skill.color : 'rgb(var(--color-accent))') + '18;color:' + (skill.color != null and !#strings.isEmpty(skill.color) ? skill.color : 'rgb(var(--color-accent))')}">
          <span class="w-1.5 h-1.5 rounded-full"
                th:style="${'background:' + (skill.color != null and !#strings.isEmpty(skill.color) ? skill.color : 'rgb(var(--color-accent))')}"></span>
          <span th:text="${skill.name}"></span>
        </span>
      </div>
      <div th:if="${hasLegacySkills}" class="flex flex-wrap gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium" style="background:#d3373f18;color:#d3373f"><span class="w-1.5 h-1.5 rounded-full" style="background:#d3373f"></span>校园墙运营</span>
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium" style="background:#b4232b18;color:#b4232b"><span class="w-1.5 h-1.5 rounded-full" style="background:#b4232b"></span>成员公示</span>
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium" style="background:#2563eb18;color:#2563eb"><span class="w-1.5 h-1.5 rounded-full" style="background:#2563eb"></span>校园互助</span>
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium" style="background:#0f766e18;color:#0f766e"><span class="w-1.5 h-1.5 rounded-full" style="background:#0f766e"></span>组织咨询</span>
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium" style="background:#7c3aed18;color:#7c3aed"><span class="w-1.5 h-1.5 rounded-full" style="background:#7c3aed"></span>青年表达</span>
      </div>
    </div>

    <!-- 正文内容（Halo 编辑器内容） -->
    <div th:if="${page.content.content != null and !#strings.isEmpty(page.content.content)}"
         class="about-panel theme-section-card reveal">
      <div class="prose prose-slate dark:prose-invert max-w-none
                  prose-headings:font-bold prose-headings:text-[rgb(var(--color-text))]
                  prose-a:no-underline hover:prose-a:underline"
           style="--tw-prose-links:rgb(var(--color-accent));--tw-prose-invert-links:rgb(var(--color-accent-dark));--tw-prose-quotes:rgb(15 23 42);--tw-prose-invert-quotes:rgb(226 232 240);--tw-prose-quote-borders:rgb(var(--color-accent));--tw-prose-invert-quote-borders:rgb(var(--color-accent-dark));--tw-prose-code:rgb(var(--color-accent));--tw-prose-invert-code:rgb(var(--color-accent-dark));"
           th:utext="${page.content.content}"></div>
    </div>

    <!-- 发展脉络 -->
    <div th:if="${theme.config.about?.show_timeline != false and theme.config.about?.timeline != null and !#lists.isEmpty(theme.config.about.timeline)}"
         th:with="timeline=${theme.config.about.timeline},
                  hasLegacyTimeline=${timeline != null and !#lists.isEmpty(timeline) and timeline[0].title != null and (#strings.contains(timeline[0].title, '博客') or #strings.contains(timeline[0].title, '项目') or #strings.contains(timeline[0].title, '工作'))}"
         class="about-panel theme-section-card reveal">
      <h2 class="theme-text-strong text-base font-semibold mb-6 flex items-center gap-2">
        <svg class="w-4 h-4" style="color:rgb(var(--color-accent))" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        发展脉络
      </h2>
      <div class="relative">
        <!-- 竖线 -->
        <div class="theme-divider-soft absolute left-[5.5rem] top-0 bottom-0 w-px"></div>
        <div th:if="${!hasLegacyTimeline}" class="space-y-6">
          <div th:each="item : ${theme.config.about.timeline}"
               class="flex gap-4 items-start">
            <div class="w-20 shrink-0 text-right">
              <span class="theme-text-soft text-xs font-semibold tabular-nums"
                    th:text="${item.year}"></span>
            </div>
            <!-- 节点圆点 -->
            <div class="shrink-0 w-3 h-3 rounded-full border-2 mt-0.5 z-10"
                 style="border-color:rgb(var(--color-accent));background:white;"></div>
            <div class="flex-1 pb-1">
              <p class="theme-text-strong text-sm font-semibold"
                 th:text="${item.title}"></p>
              <p th:if="${item.desc != null and !#strings.isEmpty(item.desc)}"
                 class="theme-text-muted text-sm mt-0.5 leading-relaxed"
                 th:text="${item.desc}"></p>
            </div>
          </div>
        </div>
        <div th:if="${hasLegacyTimeline}" class="space-y-6">
          <div class="flex gap-4 items-start">
            <div class="w-20 shrink-0 text-right">
              <span class="theme-text-soft text-xs font-semibold tabular-nums">2024</span>
            </div>
            <div class="shrink-0 w-3 h-3 rounded-full border-2 mt-0.5 z-10" style="border-color:rgb(var(--color-accent));background:white;"></div>
            <div class="flex-1 pb-1">
              <p class="theme-text-strong text-sm font-semibold">第四期成员公示</p>
              <p class="theme-text-muted text-sm mt-0.5 leading-relaxed">持续推动成员扶持、公示与校园自媒体规范运营。</p>
            </div>
          </div>
          <div class="flex gap-4 items-start">
            <div class="w-20 shrink-0 text-right">
              <span class="theme-text-soft text-xs font-semibold tabular-nums">2023</span>
            </div>
            <div class="shrink-0 w-3 h-3 rounded-full border-2 mt-0.5 z-10" style="border-color:rgb(var(--color-accent));background:white;"></div>
            <div class="flex-1 pb-1">
              <p class="theme-text-strong text-sm font-semibold">推进成员建设</p>
              <p class="theme-text-muted text-sm mt-0.5 leading-relaxed">围绕校园墙运营、活动图文和组织咨询完善协作机制。</p>
            </div>
          </div>
          <div class="flex gap-4 items-start">
            <div class="w-20 shrink-0 text-right">
              <span class="theme-text-soft text-xs font-semibold tabular-nums">2021</span>
            </div>
            <div class="shrink-0 w-3 h-3 rounded-full border-2 mt-0.5 z-10" style="border-color:rgb(var(--color-accent));background:white;"></div>
            <div class="flex-1 pb-1">
              <p class="theme-text-strong text-sm font-semibold">重庆校墙联成立</p>
              <p class="theme-text-muted text-sm mt-0.5 leading-relaxed">重庆校墙联作为全国校墙联发源地，开启校园墙组织协作。</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 联系方式 -->
    <div th:if="${theme.config.about?.show_contact != false and theme.config.about?.contacts != null and !#lists.isEmpty(theme.config.about.contacts)}"
         class="about-panel theme-layout-group reveal">
      <h2 class="theme-text-strong text-base font-semibold mb-4 flex items-center gap-2">
        <svg class="w-4 h-4" style="color:rgb(var(--color-accent))" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        联系联盟
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"
           th:with="contacts=${theme.config.about.contacts},
                    hasLegacyContacts=${contacts != null and !#lists.isEmpty(contacts) and ((contacts[0].value != null and #strings.contains(contacts[0].value, 'hello@example')) or (contacts[0].url != null and #strings.contains(contacts[0].url, 'github.com/yourname')))}">
        <a th:each="contact : ${theme.config.about.contacts}"
           th:if="${!hasLegacyContacts and contact.url != null and !#strings.contains(contact.url, 'github.com/yourname') and !#strings.contains(contact.url, 'hello@example')}"
           th:href="${contact.url ?: '#'}"
           th:target="${contact.url != null and #strings.startsWith(contact.url, 'http') ? '_blank' : '_self'}"
           rel="noopener noreferrer"
           class="about-contact-link theme-surface-panel flex items-center gap-3 p-3 rounded-xl transition-colors group">
          <!-- 图标 -->
          <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
               style="background:rgb(var(--color-accent)/0.1)">
            <!-- 图片链接类型 -->
            <th:block th:if="${contact.icon_type == 'image' and contact.icon_image != null and !#strings.isEmpty(contact.icon_image) and (#strings.startsWith(contact.icon_image,'http://') or #strings.startsWith(contact.icon_image,'https://') or #strings.startsWith(contact.icon_image,'/'))}">
              <img th:src="${#strings.replace(contact.icon_image, 'http://', 'https://')}" th:alt="${contact.label}" loading="lazy" class="w-4 h-4 object-contain" />
            </th:block>
            <!-- 内联 SVG 类型 -->
            <th:block th:if="${contact.icon_type == 'svg' and contact.icon_svg != null and !#strings.isEmpty(contact.icon_svg)}">
              <span class="w-4 h-4 flex items-center justify-center [&>svg]:w-4 [&>svg]:h-4" th:utext="${contact.icon_svg != null and #strings.contains(contact.icon_svg, '<svg') ? contact.icon_svg : ''}"></span>
            </th:block>
            <!-- 预设图标（兼容旧数据） -->
            <th:block th:if="${contact.icon_type == null or contact.icon_type == '' or contact.icon_type == 'preset'}">
              <svg th:if="${contact.icon == 'email'}" class="w-4 h-4" style="color:rgb(var(--color-accent))" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              <svg th:if="${contact.icon == 'github'}" class="w-4 h-4" style="color:rgb(var(--color-accent))" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
              <svg th:if="${contact.icon == 'bilibili'}" class="w-4 h-4" style="color:rgb(var(--color-accent))" fill="currentColor" viewBox="0 0 24 24"><path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373z"/></svg>
              <svg th:if="${contact.icon == 'weibo'}" class="w-4 h-4" style="color:rgb(var(--color-accent))" fill="currentColor" viewBox="0 0 24 24"><path d="M10.098 20.323c-3.977.391-7.414-1.406-7.672-4.02-.259-2.609 2.759-5.047 6.74-5.441 3.979-.394 7.413 1.404 7.671 4.018.259 2.6-2.759 5.049-6.739 5.443zM21.5 8.5c0-2.485-2.015-4.5-4.5-4.5-1.83 0-3.411 1.094-4.112 2.672A5.97 5.97 0 0114 8.5c0 3.314-2.686 6-6 6-.359 0-.71-.033-1.052-.096C7.687 16.619 9.76 18 12.2 18c3.314 0 6-2.686 6-6 0-.359-.033-.71-.096-1.052A4.5 4.5 0 0021.5 8.5z"/></svg>
