<section class="plugin-page-shell">
  <div class="plugin-page-stack">
    <div class="theme-page-toolbar">
      <a th:href="@{${backUrl}}"
         class="theme-outline-button inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
        </svg>
        返回校园影像
      </a>
      <span class="theme-text-soft text-sm" th:text="|第 ${position} / ${total} 张|">第 1 / 1 张</span>
    </div>

    <div class="plugin-page-grid plugin-photo-detail">
      <div class="plugin-page-card p-4 sm:p-5">
        <div class="plugin-media-frame aspect-[4/3] sm:aspect-auto rounded-[calc(var(--radius-card)+2px)]">
          <img th:src="${photo.spec.url}"
               th:alt="${photo.spec.displayName ?: '图片详情'}"
               class="w-full h-full object-contain bg-[rgba(var(--color-text),0.03)]"
               data-no-dim />
        </div>
      </div>

      <aside class="plugin-page-stack">
        <article class="plugin-page-card p-5 sm:p-6">
          <div class="flex items-start justify-between gap-4">
            <div class="min-w-0">
              <p class="theme-page-subtitle mb-2" th:text="${photo.spec.groupName ?: '未分组'}">未分组</p>
              <h1 class="theme-page-title text-2xl sm:text-3xl mb-0"
                  th:text="${photo.spec.displayName ?: '未命名图片'}">未命名图片</h1>
            </div>
          </div>

          <p th:if="${photo.spec.description != null and !#strings.isEmpty(photo.spec.description)}"
             class="theme-text-muted text-sm leading-relaxed mt-4"
             th:text="${photo.spec.description}">图片描述</p>

          <div class="plugin-chip-list mt-4" th:if="${photo.spec.tags != null and !#lists.isEmpty(photo.spec.tags)}">
            <span th:each="tag : ${photo.spec.tags}" class="plugin-chip">
              <span th:text="${tag}">标签</span>
            </span>
          </div>

          <div class="plugin-meta-list mt-5">
            <div class="plugin-meta-item">
              <span class="plugin-meta-label">创建时间</span>
              <span class="plugin-meta-value"
                    th:text="${#temporals.format(photo.metadata.creationTimestamp, 'yyyy-MM-dd HH:mm')}">2026-05-14 12:00</span>
            </div>
            <div class="plugin-meta-item" th:if="${photo.exif != null and photo.exif.imageWidth != null and photo.exif.imageHeight != null}">
              <span class="plugin-meta-label">分辨率</span>
              <span class="plugin-meta-value"
                    th:text="|${photo.exif.imageWidth} x ${photo.exif.imageHeight}|">0 x 0</span>
            </div>
            <div class="plugin-meta-item" th:if="${photo.exif != null and photo.exif.make != null and !#strings.isEmpty(photo.exif.make)}">
              <span class="plugin-meta-label">设备</span>
              <span class="plugin-meta-value"
                    th:text="${photo.exif.make + (photo.exif.model != null ? ' ' + photo.exif.model : '')}">设备信息</span>
            </div>
            <div class="plugin-meta-item" th:if="${photo.exif != null and photo.exif.lensModel != null and !#strings.isEmpty(photo.exif.lensModel)}">
              <span class="plugin-meta-label">镜头</span>
              <span class="plugin-meta-value" th:text="${photo.exif.lensModel}">镜头信息</span>
            </div>
            <div class="plugin-meta-item" th:if="${photo.exif != null and photo.exif.fNumber != null}">
              <span class="plugin-meta-label">光圈</span>
              <span class="plugin-meta-value" th:text="|f/${photo.exif.fNumber}|">f/1.8</span>
            </div>
            <div class="plugin-meta-item" th:if="${photo.exif != null and photo.exif.exposureTime != null and !#strings.isEmpty(photo.exif.exposureTime)}">
              <span class="plugin-meta-label">快门</span>
              <span class="plugin-meta-value" th:text="${photo.exif.exposureTime}">1/200</span>
            </div>
            <div class="plugin-meta-item" th:if="${photo.exif != null and photo.exif.iso != null}">
              <span class="plugin-meta-label">ISO</span>
              <span class="plugin-meta-value" th:text="${photo.exif.iso}">100</span>
            </div>
            <div class="plugin-meta-item" th:if="${photo.exif != null and photo.exif.focalLength != null}">
              <span class="plugin-meta-label">焦距</span>
              <span class="plugin-meta-value" th:text="|${photo.exif.focalLength} mm|">50 mm</span>
            </div>
          </div>
        </article>

        <article class="plugin-page-card p-5">
          <div class="flex items-center justify-between gap-3 mb-4">
            <h2 class="theme-text-strong text-sm font-semibold">邻近图片</h2>
            <div class="flex items-center gap-2 text-xs">
              <a th:if="${prev != null}"
                 th:href="@{${photoUrl.detail(prev)}}"
                 class="theme-outline-button px-3 py-1.5 rounded-full">上一张</a>
              <a th:if="${next != null}"
                 th:href="@{${photoUrl.detail(next)}}"
                 class="theme-outline-button px-3 py-1.5 rounded-full">下一张</a>
            </div>
          </div>

          <div th:if="${neighbors != null and !#lists.isEmpty(neighbors)}"
               class="grid grid-cols-5 gap-2">
            <a th:each="neighbor : ${neighbors}"
               th:href="@{${photoUrl.detail(neighbor)}}"
               class="plugin-media-frame aspect-square"
               th:style="${neighbor.metadata.name == photo.metadata.name ? 'border-color:rgb(var(--color-accent));background:rgba(var(--color-accent),0.05);' : ''}">
              <img th:src="${neighbor.spec.cover ?: neighbor.spec.url}"
                   th:alt="${neighbor.spec.displayName ?: '邻近图片'}"
                   loading="lazy" />
            </a>
          </div>
        </article>
      </aside>
    </div>

    <section th:if="${haloCommentEnabled}" class="photo-comments-shell theme-border-softer pt-8 border-t">
      <halo:comment group="core.halo.run"
                    kind="Photo"
                    th:attr="name=${photo.metadata.name}" />
    </section>
  </div>
</section>
