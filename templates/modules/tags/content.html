<section class="tag-shell mx-auto px-5 sm:px-6 py-8 sm:py-16" style="max-width:var(--container-max-w);">

  <div class="theme-page-intro reveal">
    <h1 class="theme-page-title">内容标签</h1>
    <p class="theme-page-subtitle">按标签检索公告、公示与校园资讯</p>
  </div>

  <div class="flex flex-wrap gap-3" th:if="${tags != null and tags.items != null}">
    <a th:each="tag : ${tags.items}"
       th:href="@{${tag.status?.permalink}}"
       class="taxonomy-chip theme-surface-panel group inline-flex items-center gap-2 px-4 py-2 rounded-full accent-border-hover transition-colors duration-150 reveal">
      <svg class="w-3.5 h-3.5 accent-text" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/>
      </svg>
      <span class="font-medium theme-text-muted accent-text-hover transition-colors"
            th:text="${tag.spec?.displayName}"></span>
      <span class="theme-count-chip text-xs px-1.5 py-0.5 rounded-full"
            th:text="${tag.postCount != null ? tag.postCount : 0}"></span>
    </a>
  </div>

  <div th:if="${tags == null or #lists.isEmpty(tags.items)}" class="text-center py-16 reveal">
    <div class="theme-empty-icon-wrap w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center">
      <svg class="theme-empty-icon w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/>
      </svg>
    </div>
    <p class="theme-empty-text">暂无内容标签</p>
  </div>

</section>
