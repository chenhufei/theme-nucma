<section class="plugin-page-shell">
  <div class="plugin-page-stack">
    <div class="theme-page-toolbar">
      <a href="/moments" class="theme-outline-button inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
        </svg>
        返回校园动态
      </a>
    </div>

    <article class="plugin-page-card p-5 sm:p-7">
      <div class="flex items-start gap-4">
        <img th:src="${moment.owner?.avatar != null and !#strings.isEmpty(moment.owner.avatar) ? #strings.replace(moment.owner.avatar, 'http://', 'https://') : '/themes/theme-nucma/assets/default-avatar.svg'}"
             th:alt="${moment.owner?.displayName ?: '匿名用户'}"
             class="w-14 h-14 rounded-full object-cover shrink-0"
             loading="lazy" />
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
            <h1 class="theme-page-title text-2xl sm:text-3xl mb-0"
                th:text="${moment.owner?.displayName != null ? moment.owner.displayName + ' 的动态' : '动态详情'}">动态详情</h1>
            <time class="theme-text-soft text-sm"
                  th:text="${#temporals.format(moment.spec.releaseTime ?: moment.metadata.creationTimestamp, 'yyyy-MM-dd HH:mm')}">2026-05-14 12:00</time>
          </div>

          <div th:if="${moment.owner?.bio != null and !#strings.isEmpty(moment.owner.bio)}"
               class="theme-text-muted text-sm mt-2"
               th:text="${moment.owner.bio}">作者简介</div>

          <div th:with="content=${moment.spec?.content}" class="mt-5">
            <div th:if="${content != null and content.html != null and !#strings.isEmpty(content.html)}"
                 class="plugin-richtext"
                 th:utext="${content.html}"></div>

            <div th:if="${content != null and content.medium != null and !#lists.isEmpty(content.medium)}"
                 class="plugin-media-grid plugin-media-grid--compact mt-5">
              <th:block th:each="momentItem : ${content.medium}">
                <div th:if="${momentItem.type.name == 'PHOTO'}"
                     class="plugin-media-frame aspect-[4/3]">
                  <img th:src="${momentItem.url}" alt="" loading="lazy" />
                </div>
                <div th:if="${momentItem.type.name == 'VIDEO'}"
                     class="plugin-media-frame aspect-video">
                  <video th:src="${momentItem.url}" controls preload="metadata"></video>
                </div>
                <div th:if="${momentItem.type.name == 'AUDIO'}"
                     class="plugin-audio-shell">
                  <audio th:src="${momentItem.url}" controls preload="none"></audio>
                </div>
                <a th:if="${momentItem.type.name == 'POST'}"
                   th:href="${momentItem.url}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="plugin-page-card p-4">
                  <p class="theme-text-strong text-sm font-semibold">关联文章</p>
                  <p class="theme-text-soft text-xs mt-1 line-clamp-2" th:text="${momentItem.url}">文章链接</p>
                </a>
              </th:block>
            </div>
          </div>

          <div class="plugin-chip-list mt-5" th:if="${moment.spec?.tags != null and !#lists.isEmpty(moment.spec.tags)}">
            <span th:each="tag : ${moment.spec?.tags}" class="plugin-chip">
              <span th:text="${tag}">标签</span>
            </span>
          </div>

          <div class="plugin-meta-list mt-5">
            <div class="plugin-meta-item">
              <span class="plugin-meta-label">点赞</span>
              <span class="plugin-meta-value" th:text="${moment.stats?.upvote ?: 0}">0</span>
            </div>
            <div class="plugin-meta-item">
              <span class="plugin-meta-label">评论</span>
              <span class="plugin-meta-value" th:text="${moment.stats?.approvedComment ?: moment.stats?.totalComment ?: 0}">0</span>
            </div>
            <div class="plugin-meta-item">
              <span class="plugin-meta-label">可见性</span>
              <span class="plugin-meta-value" th:text="${moment.spec?.visible ?: 'PUBLIC'}">PUBLIC</span>
            </div>
          </div>
        </div>
      </div>
    </article>
  </div>
</section>
