<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org" th:fragment="html (content)" data-theme="light" th:classappend="|theme-bg-${theme.config.appearance?.background_mode ?: 'mesh'} theme-glass-${theme.config.appearance?.glass_strength ?: 'standard'}|">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="|${post.spec?.title} - ${site.title}|"></title>
  <meta name="description" th:content="${post.status?.excerpt ?: site.subtitle}" />
  <meta property="og:title" th:content="${post.spec?.title}" />
  <meta property="og:description" th:content="${post.status?.excerpt ?: site.subtitle}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" th:content="${post.status?.permalink}" />
  <meta th:if="${post.spec?.cover != null and !#strings.isEmpty(post.spec?.cover)}"
        property="og:image" th:content="${post.spec?.cover}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" th:href="@{/assets/css/main.css(v={VERSION})}">
  <th:block th:replace="~{modules/common/components :: headMeta}"></th:block>
</head>
<body class="theme-page theme-page-post"
      data-post-code-copy-managed="true"
      th:attrappend="data-mobile-toc-behavior=${theme.config.advanced?.mobile_toc_behavior ?: 'global'},
                   data-mobile-toc-min-headings=${theme.config.advanced?.mobile_toc_min_headings ?: '5'}">
  <th:block th:replace="~{modules/common/components :: header}"></th:block>
  <th:block th:replace="~{modules/common/components :: mobileMenu}"></th:block>

  <main>
    <th:block th:replace="${content}" />
  </main>

  <th:block th:replace="~{modules/common/components :: footer}"></th:block>

  <button id="backToTop" aria-label="返回顶部"
          th:if="${theme.config.appearance?.enable_back_to_top == null or theme.config.appearance.enable_back_to_top != false}"
          class="fixed right-5 bottom-5 z-[90] inline-flex items-center justify-center rounded-full text-white transition-all duration-300 opacity-0 pointer-events-none translate-y-2"
          style="display:none;width:3rem;height:3rem;background:rgba(var(--color-accent),0.9);border:1px solid rgba(var(--color-accent),0.88);box-shadow:0 14px 34px rgba(var(--color-accent),0.22),inset 0 1px 0 rgba(255,255,255,0.28);backdrop-filter:blur(12px) saturate(1.12);-webkit-backdrop-filter:blur(12px) saturate(1.12);">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
    </svg>
  </button>
  <style>
    #backToTop:hover {
      background: rgb(var(--color-accent-dark));
      box-shadow: 0 16px 38px rgba(var(--color-accent), 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    #backToTop.visible {
      display: inline-flex;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
  </style>

  <th:block th:replace="~{modules/common/components :: baseScripts}"></th:block>
  <script th:src="@{/assets/js/post-page.js(v={VERSION})}"></script>
</body>
</html>
