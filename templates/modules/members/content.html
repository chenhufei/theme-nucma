<section class="members-shell theme-page-shell theme-page-shell--padded py-8 sm:py-12">

  <div class="theme-page-intro theme-page-intro--center reveal">
    <h1 class="theme-page-title text-3xl sm:text-4xl mb-2">成员公示</h1>
    <p class="theme-page-subtitle">共同维护校园沟通秩序</p>
    <div class="theme-page-actions theme-page-actions--center">
      <button id="apply-btn-top" class="nucma-action-chip primary">
        <svg style="width:14px;height:14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
        申请加入
      </button>
    </div>
  </div>

  <!-- 有数据：按分组展示 -->
  <div th:if="${groups != null and !#lists.isEmpty(groups)}" class="space-y-10">
    <div th:each="group : ${groups}" class="theme-layout-group theme-section-stack reveal member-group">
      <div class="flex items-center gap-3 mb-5" th:if="${group.spec.displayName != null}">
        <div class="nucma-section-badge">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <h2 class="theme-text-muted text-base font-semibold"
            th:text="${group.spec.displayName}"></h2>
        <span class="theme-count-chip text-xs px-2 py-0.5 rounded-full"
              th:text="${#lists.size(group.members)}"></span>
      </div>

      <!-- 成员卡片：与链接卡片统一样式 -->
      <div class="theme-card-grid">
        <th:block th:each="member : ${group.members}">

        <!-- 有链接：可点击 -->
        <a th:if="${member.spec.qqFriendLink != null and !member.spec.qqFriendLink.isEmpty()}"
           th:href="${member.spec.qqFriendLink}" target="_blank" rel="noopener noreferrer"
           class="link-card group member-card"
           th:attr="data-qq-link=${member.spec.qqFriendLink}">
          <div class="link-card-logo">
            <img th:if="${member.spec.avatar != null and !member.spec.avatar.isEmpty()}"
                 th:src="${#strings.replace(member.spec.avatar, 'http://', 'https://')}" th:alt="${member.spec.displayName}"
                  class="theme-media-48" loading="lazy" />
            <svg th:style="${member.spec.avatar != null and !member.spec.avatar.isEmpty() ? 'display:none' : 'display:block'}"
                 class="theme-placeholder-icon" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
          <div class="link-card-body">
            <div class="link-card-name" th:text="${member.spec.displayName}"></div>
            <div class="link-card-desc" th:text="${member.spec.school ?: '成员单位'}"></div>
          </div>
          <svg class="link-card-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </a>

        <!-- 无链接：不可点击 -->
        <div th:unless="${member.spec.qqFriendLink != null and !member.spec.qqFriendLink.isEmpty()}"
             class="link-card member-card">
          <div class="link-card-logo">
            <img th:if="${member.spec.avatar != null and !member.spec.avatar.isEmpty()}"
                 th:src="${#strings.replace(member.spec.avatar, 'http://', 'https://')}" th:alt="${member.spec.displayName}"
                  class="theme-media-48" loading="lazy" />
            <svg th:style="${member.spec.avatar != null and !member.spec.avatar.isEmpty() ? 'display:none' : 'display:block'}"
                 class="theme-placeholder-icon" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
          </div>
          <div class="link-card-body">
            <div class="link-card-name" th:text="${member.spec.displayName}"></div>
            <div class="link-card-desc" th:text="${member.spec.school ?: '成员单位'}"></div>
          </div>
        </div>

        </th:block>
      </div>
    </div>
  </div>

  <!-- 空状态 -->
  <div th:if="${groups == null or #lists.isEmpty(groups)}"
       class="flex flex-col items-center justify-center py-24 text-center">
    <div class="theme-empty-icon-wrap w-16 h-16 rounded-2xl flex items-center justify-center mb-4">
      <svg class="theme-empty-icon w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </div>
    <p class="theme-empty-text text-sm">暂无成员信息</p>
    <p class="theme-empty-meta text-xs mt-1">成员信息整理中，公示后将在这里展示。</p>
  </div>

  <!-- 申请加入区域 -->
  <div class="theme-submit-callout reveal">
    <div class="apply-panel theme-section-card">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 flex-1 min-w-0">
          <div class="theme-icon-box-accent">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
          </div>
          <div class="min-w-0">
            <h3 class="theme-text-strong text-base font-bold">加入我们</h3>
            <p class="theme-text-muted text-xs truncate">提交成员单位信息，进入审核流程</p>
          </div>
        </div>
        <button id="apply-btn"
           class="nucma-action-chip primary shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          立即申请
        </button>
      </div>
    </div>
  </div>
</section>

<!-- 申请表单模态框 - 移到 main 外部以避免层叠上下文限制 -->
<div id="member-submit-modal" class="nucma-modal-overlay hidden fixed inset-0 flex items-center justify-center p-4">
  <div class="nucma-modal-panel max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="theme-border-soft flex items-center justify-between p-4 sm:p-6 border-b">
        <h3 class="theme-text-strong text-lg font-bold">提交成员申请</h3>
        <button id="modal-close-btn" type="button" class="theme-icon-button w-8 h-8 rounded-full flex items-center justify-center transition-colors" aria-label="关闭">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="member-form" class="p-4 sm:p-6 space-y-3 sm:space-y-4">
        <!-- QQ号 -->
        <div>
          <label class="theme-text-muted block text-sm font-medium mb-2">
            QQ号 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="qq-input" name="qq" required pattern="[0-9]+"
            class="nucma-form-control"
            placeholder="用来获取头像和昵称" />
        </div>

        <!-- 账号名称 -->
        <div>
          <label class="theme-text-muted block text-sm font-medium mb-2">
            账号名称 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="displayName-input" name="displayName" required
            class="nucma-form-control"
            placeholder="例如：某某大学校园墙" />
        </div>

        <!-- 所属学校 -->
        <div>
          <label class="theme-text-muted block text-sm font-medium mb-2">
            所属学校 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="school-input" name="school" required
            class="nucma-form-control"
            placeholder="例如：清华大学" />
        </div>

        <!-- QQ链接 -->
        <div>
          <label class="theme-text-muted block text-sm font-medium mb-2">
            QQ加好友链接 <span class="text-red-500">*</span>
          </label>
          <div class="nucma-form-inline">
            <input type="text" id="qqFriendLink-input" name="qqFriendLink" required
              class="nucma-form-control"
              placeholder="输入QQ加好友链接" />
            <input type="file" accept="image/*" style="display: none" id="qr-file-input">
            <button type="button" id="qr-upload-btn"
              class="theme-soft-button nucma-form-side-action px-3 py-2 rounded-lg text-xs font-medium transition-colors duration-200 flex items-center justify-center gap-1.5">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
              </svg>
              <span id="qr-btn-text">上传二维码</span>
            </button>
          </div>
        </div>

        <!-- 邮箱 -->
        <div>
          <label class="theme-text-muted block text-sm font-medium mb-2">
            邮箱 <span class="text-red-500">*</span>
          </label>
          <div class="nucma-form-inline">
            <input type="email" id="email-input" name="email" required
              class="nucma-form-control"
              placeholder="用于接收审核通知" />
            <button type="button" id="fill-qq-email-btn"
              class="theme-soft-button nucma-form-side-action px-3 py-2 rounded-lg text-xs font-medium transition-colors duration-200 flex items-center justify-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
            </svg>
            <span>填入QQ邮箱</span>
          </button>
          </div>
        </div>

        <!-- 申请分组 -->
        <div>
          <label class="theme-text-muted block text-sm font-medium mb-2">
            申请分组
          </label>
          <select id="groupName-input" name="groupName"
            class="nucma-form-control">
            <option value="">请选择分组（可选）</option>
          </select>
        </div>

        <!-- 结果提示 -->
        <div id="result-alert" style="display:none;" class="theme-status-alert">
          <p id="result-message" class="theme-status-message"></p>
        </div>

        <button type="submit" id="submit-btn" class="nucma-submit-btn">
          <span id="submit-text">提交申请</span>
        </button>
      </form>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // ========== 申请表单模态框处理 ==========
  const applyBtn = document.getElementById('apply-btn');
  const applyBtnTop = document.getElementById('apply-btn-top');
  const modal = document.getElementById('member-submit-modal');
  const modalCloseBtn = document.getElementById('modal-close-btn');
  const memberForm = document.getElementById('member-form');
  const submitBtn = document.getElementById('submit-btn');
  const submitText = document.getElementById('submit-text');
  const resultAlert = document.getElementById('result-alert');
  const resultMessage = document.getElementById('result-message');
  const qqInput = document.getElementById('qq-input');
  const displayNameInput = document.getElementById('displayName-input');
  const qrUploadBtn = document.getElementById('qr-upload-btn');
  const qrFileInput = document.getElementById('qr-file-input');
  const fillQQEmailBtn = document.getElementById('fill-qq-email-btn');
  const emailInput = document.getElementById('email-input');

  let qqNickname = '';
  let lastAutoFilledNickname = '';
  let isQRProcessing = false;
  let savedScrollY = 0;
  let previousMemberBodyOverflow = '';
  let previousMemberBodyPaddingRight = '';

  if (modal && modal.parentElement !== document.body) {
    document.body.appendChild(modal);
  }

  function lockMemberPageScroll() {
    savedScrollY = window.scrollY;
    previousMemberBodyOverflow = document.body.style.overflow;
    previousMemberBodyPaddingRight = document.body.style.paddingRight;

    const scrollbarWidth = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
    document.documentElement.classList.add('theme-modal-open');
    document.body.classList.add('theme-modal-open');
    document.body.style.overflow = 'hidden';
    if (scrollbarWidth > 0) {
      document.body.style.paddingRight = `${scrollbarWidth}px`;
    }
  }

  function unlockMemberPageScroll() {
    document.documentElement.classList.remove('theme-modal-open');
    document.body.classList.remove('theme-modal-open');
    document.body.style.overflow = previousMemberBodyOverflow;
    document.body.style.paddingRight = previousMemberBodyPaddingRight;
    requestAnimationFrame(() => {
      window.scrollTo({ top: savedScrollY, left: 0, behavior: 'auto' });
    });
  }

  // 动态加载分组选项
  async function loadMemberGroups() {
    // 尝试多个可能的 API 端点
    const apiEndpoints = [
      '/apis/api.plugin.halo.run/v1alpha1/plugins/PluginMembers/membergroups',
      '/apis/anonymous.member.plugin.halo.run/v1alpha1/membergroups',
      '/apis/member.plugin.halo.run/v1alpha1/membergroups'
    ];
    
    for (const endpoint of apiEndpoints) {
      try {
        const response = await fetch(endpoint);
        if (response.ok) {
          const contentType = response.headers.get('content-type');
          if (contentType && contentType.includes('application/json')) {
            const groups = await response.json();
            const select = document.getElementById('groupName-input');
            if (select && groups && groups.length > 0) {
              groups.forEach(group => {
                const option = document.createElement('option');
                option.value = group.metadata.name;
                option.textContent = group.spec.displayName || group.metadata.name;
                select.appendChild(option);
              });
              return; // 成功后退出
            }
          }
        }
      } catch (error) {
        continue;
      }
    }
  }

  // 页面加载时获取分组
  loadMemberGroups();

  // 打开模态框
  function openModal() {
    if (modal) {
      lockMemberPageScroll();
      modal.classList.remove('hidden');
    }
  }

  if (applyBtn) {
    applyBtn.addEventListener('click', openModal);
  }
  
  if (applyBtnTop) {
    applyBtnTop.addEventListener('click', openModal);
  }

  // 关闭模态框
  function closeModal() {
    if (modal) {
      modal.classList.add('hidden');
      unlockMemberPageScroll();
      memberForm?.reset();
      resultAlert.style.display = 'none';
      qqNickname = '';
      lastAutoFilledNickname = '';
    }
  }

  if (modalCloseBtn) {
    modalCloseBtn.addEventListener('click', closeModal);
  }

  // 点击背景关闭
  if (modal) {
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
  }

  // ESC 键关闭
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal && !modal.classList.contains('hidden')) {
      closeModal();
    }
  });

  // QQ 号输入处理
  if (qqInput) {
    qqInput.addEventListener('input', (e) => {
      const qq = e.target.value.trim();
      if (!/^\d{5,}$/.test(qq)) {
        qqNickname = '';
        if (displayNameInput && (displayNameInput.value === lastAutoFilledNickname || displayNameInput.value.startsWith('QQ用户'))) {
          displayNameInput.value = '';
        }
      }
    });

    qqInput.addEventListener('blur', async (e) => {
      const qq = e.target.value.trim();
      if (/^\d{5,}$/.test(qq)) {
        const currentDisplayName = displayNameInput ? displayNameInput.value.trim() : '';
        if (!currentDisplayName || currentDisplayName === lastAutoFilledNickname || currentDisplayName.startsWith('QQ用户')) {
          await fetchQQNickname(qq);
        }
      }
    });

    qqInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Tab' || e.key === 'Enter') {
        const qq = e.target.value.trim();
        if (/^\d{5,}$/.test(qq)) {
          const currentDisplayName = displayNameInput ? displayNameInput.value.trim() : '';
          if (!currentDisplayName || currentDisplayName === lastAutoFilledNickname || currentDisplayName.startsWith('QQ用户')) {
            await fetchQQNickname(qq);
          }
        }
      }
    });
  }

  // 填入 QQ 邮箱
  if (fillQQEmailBtn) {
    fillQQEmailBtn.addEventListener('click', () => {
      const qq = qqInput?.value.trim();
      if (!qq || !/^\d+$/.test(qq)) {
        showToast('请先输入有效的QQ号', 'warning');
        return;
      }
      const qqEmail = qq + '@qq.com';
      if (emailInput) {
        emailInput.value = qqEmail;
        showToast(`已填入QQ邮箱：${qqEmail}`, 'success');
      }
    });
  }

  // 上传二维码
  if (qrUploadBtn && qrFileInput) {
    qrUploadBtn.addEventListener('click', () => {
      qrFileInput.click();
    });

    qrFileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      isQRProcessing = true;
      const qrBtnText = document.getElementById('qr-btn-text');
      if (qrBtnText) qrBtnText.textContent = '解析中...';
      qrUploadBtn.disabled = true;

      try {
        await processQRCode(file);
      } catch (error) {
        console.error('二维码处理失败:', error);
        showToast('二维码解析失败', 'error');
      } finally {
        isQRProcessing = false;
        if (qrBtnText) qrBtnText.textContent = '上传二维码';
        qrUploadBtn.disabled = false;
        e.target.value = '';
      }
    });
  }

  // 处理二维码
  async function processQRCode(file) {
    const imageUrl = URL.createObjectURL(file);
    const img = new Image();

    await new Promise((resolve, reject) => {
      img.addEventListener('load', resolve, { once: true });
      img.addEventListener('error', reject, { once: true });
      img.src = imageUrl;
    });

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    
    let targetWidth = img.width;
    let targetHeight = img.height;
    const maxSize = 1000;
    
    if (img.width > maxSize || img.height > maxSize) {
      const scale = Math.min(maxSize / img.width, maxSize / img.height);
      targetWidth = Math.floor(img.width * scale);
      targetHeight = Math.floor(img.height * scale);
    }
    
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
    
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(imageUrl);

    // 加载 jsQR 库
    if (!window.jsQR) {
      await loadJsQR();
    }

    // 尝试多种策略识别二维码
    let code = window.jsQR(imageData.data, imageData.width, imageData.height);
    
    if (!code) {
      // 反色处理
      const invertedData = new Uint8ClampedArray(imageData.data);
      for (let i = 0; i < invertedData.length; i += 4) {
        invertedData[i] = 255 - invertedData[i];
        invertedData[i + 1] = 255 - invertedData[i + 1];
        invertedData[i + 2] = 255 - invertedData[i + 2];
      }
      code = window.jsQR(invertedData, imageData.width, imageData.height);
    }

    if (code && code.data) {
      if (code.data.includes('qm.qq.com') || code.data.includes('qq.com') || code.data.includes('tencent://')) {
        const qqFriendLinkInput = document.getElementById('qqFriendLink-input');
        if (qqFriendLinkInput) {
          qqFriendLinkInput.value = code.data;
          showToast('二维码解析成功！', 'success');
        }
      } else {
        showToast('识别到二维码，但不是QQ加好友链接', 'warning');
      }
    } else {
      showToast('无法识别二维码，请确保图片清晰', 'error');
    }
  }

  // 加载 jsQR 库
  function loadJsQR() {
    return new Promise((resolve, reject) => {
      if (window.jsQR) {
        resolve();
        return;
      }

      const cdnUrls = [
        'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js',
        'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'
      ];

      let currentIndex = 0;

      function tryLoad() {
        if (currentIndex >= cdnUrls.length) {
          reject(new Error('无法加载二维码解析库'));
          return;
        }

        const script = document.createElement('script');
        script.src = cdnUrls[currentIndex];
        
        script.addEventListener('load', () => {
          if (window.jsQR) {
            resolve();
          } else {
            currentIndex++;
            tryLoad();
          }
        }, { once: true });
        
        script.addEventListener('error', () => {
          currentIndex++;
          tryLoad();
        }, { once: true });
        
        document.head.appendChild(script);
      }

      tryLoad();
    });
  }

  // 获取 QQ 昵称
  async function fetchQQNickname(qq) {
    const apiEndpoints = [
      `https://wiki.kikiw.cn/qq.php?qq=${qq}`,
      `https://api.oioweb.cn/api/qq/info?qq=${qq}`,
      `https://qq.kiwi1.cn/api.php?qq=${qq}`
    ];
    
    for (const url of apiEndpoints) {
      try {
        const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (!response.ok) continue;
        
        const data = await response.json();
        
        let nickname = '';
        if (data.code === 200 && data.data && data.data.nick) {
          nickname = data.data.nick;
        } else if (data.nick) {
          nickname = data.nick;
        } else if (data.nickname) {
          nickname = data.nickname;
        } else if (data.data && data.data.nickname) {
          nickname = data.data.nickname;
        } else if (data.name) {
          nickname = data.name;
        }
        
        if (nickname && nickname.trim()) {
          qqNickname = nickname.trim();
          lastAutoFilledNickname = qqNickname;
          if (displayNameInput) {
            displayNameInput.value = qqNickname;
          }
          showToast(`已获取QQ昵称：${qqNickname}`, 'success');
          return;
        }
      } catch (error) {
        continue;
      }
    }
    
    // 所有 API 都失败
    showToast('无法获取QQ昵称，请手动填写', 'warning');
  }

  // Toast 提示
  function showToast(message, type = 'info') {
    if (typeof window.showThemeToast === 'function') {
      window.showThemeToast(message, type);
      return;
    }

    const toast = document.createElement('div');
    toast.className = 'fixed top-20 right-4 px-4 py-3 rounded-xl border transition-opacity duration-200';
    toast.style.zIndex = 'var(--z-toast)';
    toast.style.background = 'linear-gradient(135deg,rgba(var(--color-card),0.86),rgba(var(--color-card),0.64))';
    toast.style.color = 'rgb(var(--color-text))';
    toast.style.borderColor =
      type === 'success' ? 'rgba(34, 197, 94, 0.22)' :
      type === 'error' ? 'rgba(239, 68, 68, 0.22)' :
      type === 'warning' ? 'rgba(245, 158, 11, 0.22)' :
      'rgba(var(--color-text), 0.08)';
    toast.style.boxShadow = '0 18px 48px rgba(var(--color-text),0.12),inset 0 1px 0 rgba(255,255,255,0.28)';
    toast.style.backdropFilter = 'blur(14px) saturate(1.12)';
    toast.style.webkitBackdropFilter = 'blur(14px) saturate(1.12)';
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  // 表单提交
  if (memberForm) {
    memberForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitText.textContent = '提交中...';
      resultAlert.style.display = 'none';

      const formData = {
        qq: document.getElementById('qq-input').value,
        displayName: document.getElementById('displayName-input').value,
        school: document.getElementById('school-input').value,
        qqFriendLink: document.getElementById('qqFriendLink-input').value,
        email: document.getElementById('email-input').value,
        groupName: document.getElementById('groupName-input')?.value || ''
      };

      try {
        const response = await fetch('/apis/anonymous.member.plugin.halo.run/v1alpha1/membersubmits/-/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          resultAlert.style.display = 'block';
          resultAlert.className = 'theme-status-alert is-success';
          resultMessage.className = 'theme-status-message';
          resultMessage.textContent = '✓ 申请提交成功！我们会尽快审核您的申请。';
          window.showThemeToast?.('\u6210\u5458\u7533\u8bf7\u5df2\u63d0\u4ea4', 'success');
          memberForm.reset();
          setTimeout(() => {
            closeModal();
          }, 2000);
        } else {
          const error = await response.json();
          throw new Error(error.message || '提交失败');
        }
      } catch (error) {
        resultAlert.style.display = 'block';
        resultAlert.className = 'theme-status-alert is-error';
        resultMessage.className = 'theme-status-message';
        window.showThemeToast?.('\u6210\u5458\u7533\u8bf7\u5931\u8d25', 'error');
        resultMessage.textContent = '✗ ' + (error.message || '提交失败，请稍后重试');
      } finally {
        submitBtn.disabled = false;
        submitText.textContent = '提交申请';
      }
    });
  }

  function onMemberPageReady(callback) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', callback, { once: true });
      return;
    }
    callback();
  }

  // QR lazy loading
  let _qrReady = false, _qrLoading = false;
  const _qrCbs = [];
  function _loadQRLib(cb) {
    if (_qrReady || window.qrcode) {
      _qrReady = true;
      if (typeof cb === 'function') cb();
      return;
    }
    if (typeof cb === 'function') _qrCbs.push(cb);
    if (_qrLoading) return;
    const existingScript = document.querySelector('script[data-nucma-qrcode]');
    if (existingScript) {
      _qrLoading = true;
      existingScript.addEventListener('load', () => {
        _qrReady = true;
        _qrCbs.splice(0).forEach(fn => fn());
      }, { once: true });
      existingScript.addEventListener('error', () => console.warn('QR库加载失败'), { once: true });
      return;
    }
    _qrLoading = true;
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
    s.async = true;
    s.dataset.nucmaQrcode = '1';
    s.onload = () => { _qrReady = true; _qrCbs.splice(0).forEach(fn => fn()); };
    s.addEventListener('error', () => console.warn('QR库加载失败'), { once: true });
    document.head.appendChild(s);
  }

  // ── 生成 QR canvas ────────────────────────────────────────
  const _qrCache = new Map();
  function _makeQRCanvas(url, size) {
    if (_qrCache.has(url)) {
      const cached = _qrCache.get(url);
      const copy = document.createElement('canvas');
      copy.width = cached.width;
      copy.height = cached.height;
      copy.getContext('2d').drawImage(cached, 0, 0);
      return copy;
    }
    var qr = window.qrcode(0, 'M');
    qr.addData(url); qr.make();
    var mc = qr.getModuleCount(), cs = Math.floor(size / mc), qs = cs * mc;
    var c = document.createElement('canvas');
    c.width = qs; c.height = qs;
    var ctx = c.getContext('2d');
    var rootStyle = getComputedStyle(document.documentElement);
    var cardRgb = rootStyle.getPropertyValue('--color-card').trim() || '255 255 255';
    var textRgb = rootStyle.getPropertyValue('--color-text').trim() || '18 18 18';
    ctx.fillStyle = 'rgba(' + cardRgb.replace(/\s+/g, ',') + ',0.78)';
    ctx.fillRect(0, 0, qs, qs);
    ctx.fillStyle = 'rgb(' + textRgb.replace(/\s+/g, ',') + ')';
    for (var r = 0; r < mc; r++) {
      for (var col = 0; col < mc; col++) {
        if (qr.isDark(r, col)) {
          ctx.fillRect(col * cs, r * cs, cs, cs);
        }
      }
    }
    _qrCache.set(url, c);
    var copy = document.createElement('canvas');
    copy.width = qs; copy.height = qs;
    copy.getContext('2d').drawImage(c, 0, 0);
    return copy;
  }

  // 成员卡片二维码浮层
  let memberTooltip = null, memberTooltipCanvas = null, memberTooltipLabel = null;
  let memberTooltipRenderedUrl = '';
  let memberHideTimer = null;
  let memberActiveCard = null, memberActiveUrl = '', memberActiveLabel = '';
  let memberLastPointerX = null, memberLastPointerY = null;
  let memberSyncRaf = 0;
  const memberHoverQrQuery = window.matchMedia('(hover: hover) and (pointer: fine)');

  function canUseMemberHoverQR() {
    return memberHoverQrQuery.matches;
  }

  function getMemberTooltip() {
    if (memberTooltip) return memberTooltip;
    memberTooltip = document.createElement('div');
    memberTooltip.id = 'member-qr-tooltip';
    memberTooltipCanvas = document.createElement('div');
    memberTooltipCanvas.id = 'member-qr-canvas-wrap';
    memberTooltipLabel = document.createElement('div');
    memberTooltipLabel.className = 'qr-label';
    memberTooltip.appendChild(memberTooltipCanvas);
    memberTooltip.appendChild(memberTooltipLabel);
    document.body.appendChild(memberTooltip);
    return memberTooltip;
  }

  function positionMemberTooltip(rect) {
    const tooltip = getMemberTooltip();
    const tooltipWidth = 120;
    const tooltipHeight = 130;
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    let left = rect.right + 10;
    if (left + tooltipWidth > viewportWidth - 8) left = rect.left - tooltipWidth - 10;
    let top = rect.top + (rect.height - tooltipHeight) / 2;
    top = Math.max(8, Math.min(top, viewportHeight - tooltipHeight - 8));
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  }

  function isPointerInsideMemberCard(card) {
    if (!card || memberLastPointerX === null || memberLastPointerY === null) return false;
    const rect = card.getBoundingClientRect();
    return memberLastPointerX >= rect.left &&
      memberLastPointerX <= rect.right &&
      memberLastPointerY >= rect.top &&
      memberLastPointerY <= rect.bottom;
  }

  function syncMemberTooltip() {
    if (!canUseMemberHoverQR()) {
      hideMemberTooltip(true);
      return;
    }
    if (!memberActiveCard || !memberTooltip || !memberTooltip.classList.contains('visible')) return;
    if (!document.body.contains(memberActiveCard) || !isPointerInsideMemberCard(memberActiveCard)) {
      hideMemberTooltip(true);
      return;
    }
    positionMemberTooltip(memberActiveCard.getBoundingClientRect());
  }

  function scheduleMemberTooltipSync() {
    if (memberSyncRaf) return;
    memberSyncRaf = window.requestAnimationFrame(function() {
      memberSyncRaf = 0;
      syncMemberTooltip();
    });
  }

  function showMemberTooltip(card, url, label, pointerEvent) {
    if (!canUseMemberHoverQR()) return;
    clearTimeout(memberHideTimer);
    memberActiveCard = card;
    memberActiveUrl = url;
    memberActiveLabel = label || 'Open QQ QR';
    if (pointerEvent) {
      memberLastPointerX = pointerEvent.clientX;
      memberLastPointerY = pointerEvent.clientY;
    }

    const tooltip = getMemberTooltip();
    memberTooltipLabel.textContent = memberActiveLabel;
    positionMemberTooltip(card.getBoundingClientRect());

    if (memberTooltipRenderedUrl !== url) {
      memberTooltipRenderedUrl = '';
      memberTooltipCanvas.innerHTML = '';
      _loadQRLib(function() {
        try {
          if (memberActiveCard !== card || memberActiveUrl !== url) return;
          const canvas = _makeQRCanvas(url, 96);
          memberTooltipCanvas.innerHTML = '';
          if (canvas) {
            memberTooltipCanvas.appendChild(canvas);
            memberTooltipRenderedUrl = url;
          }
          syncMemberTooltip();
        } catch (e) {
          console.warn('member QR render failed', e);
        }
      });
    } else if (memberTooltipCanvas.children.length === 0 && _qrReady) {
      try {
        const canvas = _makeQRCanvas(url, 96);
        if (canvas) memberTooltipCanvas.appendChild(canvas);
      } catch (e) {}
    }

    tooltip.classList.add('visible');
  }

  function hideMemberTooltip(immediate) {
    clearTimeout(memberHideTimer);
    const doHide = function() {
      memberActiveCard = null;
      memberActiveUrl = '';
      memberActiveLabel = '';
      if (memberTooltip) memberTooltip.classList.remove('visible');
    };
    if (immediate) {
      doHide();
      return;
    }
    memberHideTimer = setTimeout(doHide, 120);
  }

  function initMemberCardQRV2() {
    if (!canUseMemberHoverQR()) return;
    document.querySelectorAll('a.member-card[data-qq-link]').forEach(function(card) {
      if (card.dataset.memberQrBound === '1') return;
      card.dataset.memberQrBound = '1';
      const url = card.getAttribute('data-qq-link');
      if (!url) return;
      card.addEventListener('pointerenter', function(event) {
        if (event.pointerType && event.pointerType !== 'mouse') return;
        showMemberTooltip(card, url, 'Open QQ QR', event);
      });
      card.addEventListener('mouseenter', function(event) {
        showMemberTooltip(card, url, 'Open QQ QR', event);
      });
      card.addEventListener('pointermove', function(event) {
        if (event.pointerType && event.pointerType !== 'mouse') return;
        memberLastPointerX = event.clientX;
        memberLastPointerY = event.clientY;
        if (memberActiveCard !== card) {
          showMemberTooltip(card, url, 'Open QQ QR', event);
          return;
        }
        syncMemberTooltip();
      });
      card.addEventListener('pointerleave', hideMemberTooltip);
      card.addEventListener('mouseleave', hideMemberTooltip);
    });
  }

  onMemberPageReady(initMemberCardQRV2);
  window.addEventListener('scroll', function() { hideMemberTooltip(true); }, { passive: true });
  window.addEventListener('resize', function() { hideMemberTooltip(true); }, { passive: true });
  memberHoverQrQuery.addEventListener('change', function() {
    hideMemberTooltip(true);
    if (canUseMemberHoverQR()) initMemberCardQRV2();
  });

})();
</script>
