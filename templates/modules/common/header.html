<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<header th:fragment="header"
        th:with="headerConfig=${theme.config.header},
                 showThemeToggle=${headerConfig?.show_theme_toggle == null or headerConfig.show_theme_toggle != false},
                 showUserAvatar=${headerConfig?.show_user_avatar == null or headerConfig.show_user_avatar != false},
                 showSearch=${headerConfig?.show_search == null or headerConfig.show_search != false},
                 headerTitle=${headerConfig?.site_title != null and !#strings.isEmpty(headerConfig.site_title) ? headerConfig.site_title : site.title},
                 headerLogo=${headerConfig?.logo_image != null and !#strings.isEmpty(headerConfig.logo_image) ? headerConfig.logo_image : site.logo},
                 menuAlign=${headerConfig?.menu_align == 'left' or headerConfig?.menu_align == 'right' ? headerConfig.menu_align : 'center'},
                 searchMode=${headerConfig?.search_expand_mode == 'click' ? 'click' : 'hover'},
                 promoLinks=${headerConfig?.promo_links}"
        th:classappend="| site-header--nav-${menuAlign}|"
        id="mainHeader"
        class="site-header">
  <svg class="theme-liquid-glass-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <filter id="nucma-liquid-glass-refraction" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="12" result="liquidNoise"/>
        <feGaussianBlur in="liquidNoise" stdDeviation="1.25" result="softMap"/>
        <feDisplacementMap in="SourceGraphic" in2="softMap" scale="14" xChannelSelector="R" yChannelSelector="G" result="refracted"/>
        <feComponentTransfer in="refracted" result="compressed">
          <feFuncR type="gamma" amplitude="1.02" exponent="0.92" offset="0"/>
          <feFuncG type="gamma" amplitude="1.02" exponent="0.92" offset="0"/>
          <feFuncB type="gamma" amplitude="1.02" exponent="0.92" offset="0"/>
          <feFuncA type="identity"/>
        </feComponentTransfer>
        <feColorMatrix in="compressed" type="saturate" values="1.16"/>
      </filter>
      <filter id="nucma-liquid-glass-edge" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="edgeBlur"/>
        <feSpecularLighting in="edgeBlur" surfaceScale="7" specularConstant="0.58" specularExponent="24" lighting-color="#ffffff" result="edgeLight">
          <fePointLight x="-80" y="-120" z="180"/>
        </feSpecularLighting>
        <feComposite in="edgeLight" in2="SourceAlpha" operator="in" result="edgeOnly"/>
        <feMerge>
          <feMergeNode in="SourceGraphic"/>
          <feMergeNode in="edgeOnly"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div class="site-header__pill">
    <div class="site-header__brand">
      <a th:href="@{/}" class="site-header__logo" aria-label="返回首页">
        <img th:if="${headerLogo != null and !#strings.isEmpty(headerLogo)}"
             th:src="@{${headerLogo}}"
             th:alt="${headerTitle}"
             class="site-header__logo-icon" />
        <svg data-logo-fallback
             th:style="${headerLogo != null and !#strings.isEmpty(headerLogo) ? 'display:none' : 'display:block'}"
             class="site-header__logo-icon"
             viewBox="0 0 32 32"
             xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hdrLogoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#d3373f"/>
              <stop offset="1" stop-color="#a5232a"/>
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="24" height="24" rx="6" fill="url(#hdrLogoGrad)"/>
          <line x1="10" y1="12" x2="10" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="22" y1="12" x2="22" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="10" y1="12" x2="22" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </a>
      <a th:href="@{/}" class="site-header__site-title" th:attr="aria-label=${headerTitle}">
        <strong th:text="${headerTitle}">NUCMA</strong>
      </a>
    </div>

    <nav id="desktopNav"
         class="site-header__nav"
         th:with="primaryMenu=${menuFinder.getByName('primary')}">
      <th:block th:if="${primaryMenu != null}" th:each="menuItem : ${primaryMenu.menuItems}">
        <div th:if="${menuItem.children != null and !menuItem.children.isEmpty()}" class="site-header__group">
          <a th:href="@{${menuItem.status.href}}" class="site-header__nav-link site-header__toggle">
            <span th:text="${menuItem.status.displayName}">菜单</span>
            <svg class="site-header__toggle-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </a>
          <div class="site-header__menu">
            <a th:each="child : ${menuItem.children}"
               th:href="@{${child.status.href}}"
               th:target="${child.spec.target?.value}"
               th:text="${child.status.displayName}"
               class="site-header__menu-link">子菜单</a>
          </div>
        </div>

        <a th:unless="${menuItem.children != null and !menuItem.children.isEmpty()}"
           th:href="@{${menuItem.status.href}}"
           th:target="${menuItem.spec.target?.value}"
           th:text="${menuItem.status.displayName}"
           class="site-header__nav-link">菜单</a>
      </th:block>
      <th:block th:if="${promoLinks != null and !#lists.isEmpty(promoLinks)}">
        <a th:each="link : ${promoLinks}"
           th:if="${link.enabled == null or link.enabled != false}"
           th:href="@{${link.url ?: '#'}}"
           th:target="${link.open_in_new == null or link.open_in_new != false ? '_blank' : '_self'}"
           class="site-header__nav-link site-header__promo-link"
           th:attr="aria-label=${link.label ?: '活动入口'}">
          <img th:if="${link.image != null and !#strings.isEmpty(link.image)}"
               th:src="@{${link.image}}"
               th:alt="${link.label ?: '活动入口'}"
               loading="lazy" />
          <span th:unless="${link.image != null and !#strings.isEmpty(link.image)}"
                th:text="${link.text ?: link.label ?: '活动'}">活动</span>
        </a>
      </th:block>
    </nav>

    <div class="site-header__actions">
      <form th:if="${showSearch}"
            class="site-header__search"
            th:classappend="| site-header__search--${searchMode}|"
            action="/search"
            method="get"
            role="search"
            data-header-search
            th:attr="data-search-mode=${searchMode}">
        <button type="submit"
                class="site-header__search-submit"
                aria-label="搜索"
                title="搜索"
                data-header-search-toggle>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35m1.85-5.15a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
          </svg>
        </button>
        <input type="search" name="keyword" autocomplete="off" placeholder="搜索公告、页面" aria-label="搜索关键词" />
      </form>

      <button th:if="${showThemeToggle}"
              id="themeToggle"
              type="button"
              class="site-header__icon-btn"
              aria-label="切换主题">
        <svg class="dark:hidden" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
        </svg>
        <svg class="hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.536l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM3 11a1 1 0 100-2H2a1 1 0 100 2h1z" clip-rule="evenodd"></path>
        </svg>
      </button>

      <th:block th:if="${showUserAvatar}">
        <th:block th:if="${user != null}"
                  th:with="userAvatar=${(user.spec != null and user.spec.avatar != null and !#strings.isEmpty(user.spec.avatar)) ? user.spec.avatar : null},
                           userDisplayName=${(user.spec != null and user.spec.displayName != null and !#strings.isEmpty(user.spec.displayName)) ? user.spec.displayName : user.metadata.name}">
          <a th:href="@{/uc}"
             class="site-header__icon-btn site-header__user-btn"
             aria-label="用户中心"
             th:title="${userDisplayName}">
            <img th:if="${userAvatar != null and !#strings.isEmpty(userAvatar)}"
                 th:src="@{${userAvatar}}"
                 th:alt="${userDisplayName}"
                 class="site-header__avatar" />
            <span th:unless="${userAvatar != null and !#strings.isEmpty(userAvatar)}"
                  class="site-header__avatar-fallback"
                  th:text="${#strings.substring(userDisplayName,0,1)}">U</span>
          </a>
        </th:block>
        <th:block th:unless="${user != null}">
          <a th:href="@{/login}"
             class="site-header__login"
             aria-label="登录"
             title="登录">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </a>
        </th:block>
      </th:block>

      <button id="mobileMenuBtn"
              type="button"
              class="site-header__icon-btn site-header__mobile-btn"
              aria-label="打开菜单"
              data-theme-action="open-menu">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- 社交分享卡片 meta 标签（插件注入点） -->
<th:block th:if="${post != null}">
  <th:block th:replace="~{modules/common/components :: share-meta}"></th:block>
</th:block>

</html>
