<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!--
  components.html — 聚合入口，保持各 layout 的引用路径不变。
  实际内容已拆分到：
    header.html   → fragment: header
    footer.html   → fragment: footer
    scripts.html  → fragment: headMeta, baseScripts
-->

<!-- header fragment：代理到 header.html -->
<th:block th:fragment="header">
  <th:block th:replace="~{modules/common/header :: header}"></th:block>
</th:block>

<!-- footer fragment：代理到 footer.html -->
<th:block th:fragment="footer">
  <th:block th:replace="~{modules/common/footer :: footer}"></th:block>
</th:block>

<!-- mobileMenu fragment：移动端侧边栏和遮罩层 -->
<th:block th:fragment="mobileMenu">
  <!-- 移动端遮罩层 -->
  <div id="mobileOverlay" class="fixed inset-0 bg-black/50 md:hidden"
       style="display:none; opacity:0; transition:opacity 0.3s ease; z-index:var(--z-mobile-overlay);"
       data-mobile-menu-close></div>

  <!-- 移动端侧边栏菜单 -->
  <div id="mobileSidebar"
       class="theme-surface-panel-strong fixed top-0 left-0 h-full w-64 md:hidden overflow-y-auto"
       style="display:none; transform:translateX(-100%); transition:transform 0.3s cubic-bezier(0.4,0,0.2,1); z-index:var(--z-mobile-sidebar);
               backdrop-filter:blur(16px) saturate(1.14); -webkit-backdrop-filter:blur(16px) saturate(1.14);
               border-right: 1px solid rgba(var(--color-text),0.1);"
       th:with="primaryMenu = ${menuFinder.getByName('primary')}">
    <div class="flex flex-col h-full">
      <!-- 菜单头部 -->
      <div class="flex items-center justify-between px-4 h-14 border-b theme-border-soft shrink-0">
        <span class="font-bold text-lg theme-text-strong" th:text="${site.title}">菜单</span>
        <button class="theme-icon-button p-2 rounded-full transition-colors"
                aria-label="关闭菜单" data-mobile-menu-close>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <!-- 菜单内容 -->
      <div class="flex-1 overflow-y-auto px-4 py-4">
        <th:block th:if="${primaryMenu != null}" th:each="menuItem : ${primaryMenu.menuItems}">
          <a th:href="@{${menuItem.status.href}}"
             th:target="${menuItem.spec.target?.value}"
             th:text="${menuItem.status.displayName}"
             data-mobile-menu-close
             class="block py-3 text-sm font-medium theme-text-muted accent-text-hover border-b theme-border-softer transition-colors"></a>
          <th:block th:if="${menuItem.children != null and !menuItem.children.isEmpty()}">
            <a th:each="child : ${menuItem.children}"
               th:href="@{${child.status.href}}"
               th:target="${child.spec.target?.value}"
               th:text="${child.status.displayName}"
               data-mobile-menu-close
               class="block py-2.5 pl-4 text-sm theme-text-soft accent-text-hover transition-colors"></a>
          </th:block>
        </th:block>
      </div>
    </div>
  </div>
</th:block>

<!-- backgroundEffect fragment：保留占位，主题已禁用全局背景特效 -->
<th:block th:fragment="backgroundEffect"></th:block>

<!-- headMeta fragment：代理到 scripts.html -->
<th:block th:fragment="headMeta">
  <th:block th:replace="~{modules/common/scripts :: headMeta}"></th:block>
</th:block>

<!-- baseScripts fragment：代理到 scripts.html -->
<th:block th:fragment="baseScripts">
  <th:block th:replace="~{modules/common/scripts :: baseScripts}"></th:block>
</th:block>

<!-- 社交分享卡片 meta -->
<th:block th:fragment="share-meta">
  <meta th:property="og:title" th:content="${post?.spec?.title}" />
  <meta th:property="og:description" th:content="${post?.status?.excerpt ?: #strings.abbreviate(post?.spec?.description, 200)}" />
  <meta th:property="og:image" th:content="${#strings.isEmpty(#themes?.get('nucma')?.share_card_cover) ? (#strings.isEmpty(post?.spec?.cover) ? #themes.get('nucma').site_logo : post?.spec?.cover) : #themes.get('nucma').share_card_cover}" />
  <meta th:property="og:type" content="article" />
  <meta name="twitter:card" content="summary_large_image" />
</th:block>

<!-- 加密文章提示 -->
<th:block th:fragment="encryption-notice">
  <div th:if="${post?.spec?.published == false}" class="nucma-encryption-notice">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    <div class="encryption-msg">
      <strong>本文已加密</strong><br/>
      请输入密码后查看完整内容。
    </div>
  </div>
</th:block>

</html>
