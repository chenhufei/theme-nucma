<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<footer th:fragment="footer"
        class="site-footer"
        th:classappend="${(theme.config.footer?.show_brand == false ? ' footer-no-brand' : '') + ' footer-layout-' + (theme.config.footer?.footer_layout ?: 'balanced')}">
  <div class="footer-inner mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-16">
    <div class="footer-top">
      <div th:if="${theme.config.footer?.show_brand == null or theme.config.footer.show_brand != false}" class="footer-brand">
        <div class="mb-6 text-center md:text-left">
          <a th:href="@{/}" class="inline-flex items-center gap-2 mb-3">
            <img th:if="${site.logo != null and !#strings.isEmpty(site.logo) and (#strings.startsWith(site.logo,'http://') or #strings.startsWith(site.logo,'https://') or #strings.startsWith(site.logo,'/'))}"
                 th:src="${#strings.replace(site.logo, 'http://', 'https://')}" th:alt="${site.title}" class="w-8 h-8 object-contain" />
            <th:block th:unless="${site.logo != null and !#strings.isEmpty(site.logo) and (#strings.startsWith(site.logo,'http://') or #strings.startsWith(site.logo,'https://') or #strings.startsWith(site.logo,'/'))}">
              <svg class="w-8 h-8 shrink-0" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 20 L80 50 L50 80 L20 50 Z" fill="rgb(var(--color-primary))" opacity="0.85"/>
                <path d="M50 35 L65 50 L50 65 L35 50 Z" fill="white" opacity="0.9"/>
              </svg>
            </th:block>
            <span class="font-bold text-lg logo-title" th:text="${site.title}">Nucma</span>
          </a>

          <th:block th:with="rawDesc = ${theme.config.footer?.site_desc},
                             desc = ${(rawDesc != null and !#strings.isEmpty(rawDesc) and !#strings.contains(rawDesc, '传播校园文化')) ? rawDesc : '全国高校自媒体联盟 - 互动宣教，多元交流'}">
            <p th:text="${desc}" class="mx-auto md:mx-0 text-sm footer-copyright leading-relaxed mb-4 max-w-sm"></p>
          </th:block>
        </div>

        <div th:unless="${theme.config.footer?.show_social == false}" class="footer-socials flex items-center gap-3 flex-wrap mt-2">
          <th:block th:if="${theme.config.footer?.social_links != null}" th:each="item : ${theme.config.footer.social_links}">
            <a th:if="${item.url != null and !#strings.isEmpty(item.url) and !#strings.contains(item.url, 'github.com/yourname') and !#strings.contains(item.url, 'hello@example.com')}"
               th:href="${item.url}" target="_blank" rel="noopener noreferrer"
               th:attr="aria-label=${item.name ?: item.url}"
               class="p-2 rounded-lg footer-link transition-colors footer-social-link">
              <th:block th:if="${item.icon_type == 'image' and item.icon_image != null and !#strings.isEmpty(item.icon_image) and (#strings.startsWith(item.icon_image,'http://') or #strings.startsWith(item.icon_image,'https://') or #strings.startsWith(item.icon_image,'/'))}">
                <img th:src="${#strings.replace(item.icon_image, 'http://', 'https://')}" th:alt="${item.name}" class="w-4 h-4 object-contain" />
              </th:block>
              <th:block th:if="${item.icon_type == 'svg' and item.icon_svg != null and !#strings.isEmpty(item.icon_svg)}">
                <span class="w-4 h-4 flex items-center justify-center [&>svg]:w-4 [&>svg]:h-4" th:utext="${item.icon_svg}"></span>
              </th:block>
              <th:block th:if="${item.icon_type == null or item.icon_type == '' or item.icon_type == 'preset'}">
                <th:block th:if="${item.icon == 'github'}"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg></th:block>
                <th:block th:if="${item.icon == 'email'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></th:block>
                <th:block th:if="${item.icon == 'rss'}"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6.18 15.64a2.18 2.18 0 012.18 2.18C8.36 19.01 7.38 20 6.18 20C4.98 20 4 19.01 4 17.82a2.18 2.18 0 012.18-2.18M4 4.44A15.56 15.56 0 0119.56 20h-2.83A12.73 12.73 0 004 7.27V4.44m0 5.66a9.9 9.9 0 019.9 9.9h-2.83A7.07 7.07 0 004 12.93V10.1z"/></svg></th:block>
                <th:block th:if="${item.icon == 'bilibili'}"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373Z"/></svg></th:block>
                <th:block th:if="${item.icon == 'wechat'}"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg></th:block>
                <th:block th:if="${item.icon == 'link'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-2.829 2.828a4 4 0 105.657 5.657l1.414-1.414M10.172 13.828a4 4 0 005.656 0l2.829-2.828A4 4 0 1013 5.343L11.586 6.757"/></svg></th:block>
                <th:block th:if="${item.icon == 'weibo' or item.icon == 'qq' or item.icon == 'zhihu' or item.icon == 'douyin' or item.icon == 'xiaohongshu' or item.icon == 'juejin' or item.icon == 'csdn' or item.icon == 'douban' or item.icon == 'steam' or item.icon == 'youtube' or item.icon == 'instagram' or item.icon == 'twitter'}">
                  <span class="footer-social-fallback" th:text="${item.name != null and !#strings.isEmpty(item.name) ? #strings.substring(item.name, 0, 1) : '·'}"></span>
                </th:block>
              </th:block>
            </a>
          </th:block>
        </div>
      </div>

      <div class="footer-menu-grid"
           th:with="footerColumns=${theme.config.footer?.footer_columns}, hasFooterColumns=${footerColumns != null and !#lists.isEmpty(footerColumns)}">
        <th:block th:if="${hasFooterColumns}">
          <div th:each="column : ${footerColumns}"
               th:if="${column.enabled == null or column.enabled != false}"
               class="footer-column text-left">
            <h3 class="footer-title text-sm mb-4" th:text="${column.title ?: column.column_key ?: '导航'}">导航</h3>

            <ul class="space-y-2.5"
                th:if="${column.column_type == 'menu'}"
                th:with="primaryMenu = ${menuFinder.getByName('primary')}">
              <th:block th:if="${primaryMenu != null}">
                <li th:each="menuItem : ${primaryMenu.menuItems}">
                  <a th:href="@{${menuItem.status.href}}" th:target="${menuItem.spec.target?.value}"
                     th:text="${menuItem.status.displayName}"
                     class="footer-link text-sm block footer-nav-link"></a>
                  <ul th:if="${menuItem.children != null and !menuItem.children.isEmpty()}" class="footer-nav-children">
                    <li th:each="child : ${menuItem.children}">
                      <a th:href="@{${child.status.href}}"
                         th:target="${child.spec.target?.value}"
                         th:text="${child.status.displayName}"
                         class="footer-link text-xs block footer-nav-link footer-nav-link--child"></a>
                    </li>
                  </ul>
                </li>
              </th:block>
            </ul>

            <ul class="space-y-2.5"
                th:if="${(column.column_type == null or column.column_type != 'menu') and column.links != null and !#lists.isEmpty(column.links)}">
              <li th:each="link : ${column.links}">
                <a th:if="${link.text != null and !#strings.isEmpty(link.text)}"
                   th:href="${link.url ?: '#'}"
                   th:with="hasQr=${(link.qr_image != null and !#strings.isEmpty(link.qr_image)) or (link.qr_svg != null and !#strings.isEmpty(link.qr_svg)) or (link.qr_text != null and !#strings.isEmpty(link.qr_text))}"
                   th:classappend="${hasQr ? ' footer-link--qr' : ''}"
                   class="footer-link text-sm block">
                  <span th:text="${link.text}"></span>
                  <span th:if="${hasQr}" class="footer-qr-popover" aria-hidden="true">
                    <span th:if="${link.qr_image != null and !#strings.isEmpty(link.qr_image)}" class="footer-qr-frame">
                      <img th:src="${#strings.replace(link.qr_image, 'http://', 'https://')}" th:alt="${link.text}" loading="lazy" />
                    </span>
                    <span th:if="${(link.qr_image == null or #strings.isEmpty(link.qr_image)) and link.qr_svg != null and !#strings.isEmpty(link.qr_svg)}" class="footer-qr-frame footer-qr-frame--svg" th:utext="${link.qr_svg}"></span>
                    <span th:if="${(link.qr_image == null or #strings.isEmpty(link.qr_image)) and (link.qr_svg == null or #strings.isEmpty(link.qr_svg)) and link.qr_text != null and !#strings.isEmpty(link.qr_text)}" class="footer-qr-text" th:text="${link.qr_text}"></span>
                  </span>
                </a>
              </li>
            </ul>
          </div>
        </th:block>

        <th:block th:unless="${hasFooterColumns}">
          <div th:with="primaryMenu = ${menuFinder.getByName('primary')}" class="footer-column text-left">
            <h3 class="footer-title text-sm mb-4">导航</h3>
            <ul class="space-y-2.5" th:if="${primaryMenu != null}">
              <li th:each="menuItem : ${primaryMenu.menuItems}">
                <a th:href="@{${menuItem.status.href}}" th:target="${menuItem.spec.target?.value}"
                   th:text="${menuItem.status.displayName}"
                   class="footer-link text-sm block footer-nav-link"></a>
              </li>
            </ul>
          </div>
          <div class="footer-column text-left">
            <h3 class="footer-title text-sm mb-4">关于</h3>
            <ul class="space-y-2.5">
              <li><a th:href="@{/about}" class="footer-link text-sm block">关于联盟</a></li>
              <li><a th:href="@{/members}" class="footer-link text-sm block">成员列表</a></li>
              <li><a th:href="@{/links}" class="footer-link text-sm block">友情链接</a></li>
              <li><a th:href="@{/archives}" class="footer-link text-sm block">组织资讯</a></li>
            </ul>
          </div>
          <div class="footer-column text-left">
            <h3 class="footer-title text-sm mb-4">发现</h3>
            <ul class="space-y-2.5">
              <li><a th:href="@{/categories}" class="footer-link text-sm block">分类</a></li>
              <li><a th:href="@{/tags}" class="footer-link text-sm block">标签</a></li>
              <li><a th:href="@{/rss.xml}" class="footer-link text-sm block" target="_blank" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline-block mr-1.5 align-text-bottom" fill="currentColor" viewBox="0 0 24 24"><circle cx="6.5" cy="17.5" r="1.5"/><path d="M16 16a4 4 0 01-4-4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16A8 8 0 008 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>RSS</a></li>
            </ul>
          </div>
        </th:block>
      </div>
    </div>

    <!-- 在线显示插件集成 -->
    <div th:if="${theme.config.pluginOnlineDisplay?.enableOnlineCount == true}" class="footer-online-count">
      <span class="footer-online-dot"></span>
      <span class="footer-online-label" th:text="${theme.config.pluginOnlineDisplay?.onlineCountLabel ?: '当前在线'}">当前在线</span>: 
      <span class="footer-online-number" id="onlineCount">--</span>
    </div>

    <div class="footer-meta">
      <div class="footer-records text-xs footer-copyright text-center">
        <a th:if="${theme.config.footer?.icp_number != null and !#strings.isEmpty(theme.config.footer.icp_number)}"
           th:href="${theme.config.footer?.icp_link ?: 'https://beian.miit.gov.cn/'}"
           target="_blank" rel="noopener noreferrer"
           th:text="${theme.config.footer.icp_number}"
           class="footer-link">ICP备案号</a>

        <a th:if="${theme.config.footer?.police_number != null and !#strings.isEmpty(theme.config.footer.police_number)}"
           th:href="${theme.config.footer?.police_record_code != null and !#strings.isEmpty(theme.config.footer.police_record_code) ? 'https://beian.mps.gov.cn/#/query/webSearch?code=' + theme.config.footer.police_record_code : 'https://beian.mps.gov.cn/'}"
           target="_blank" rel="noopener noreferrer"
           th:text="${theme.config.footer.police_number}"
           class="footer-link">公安备案号</a>
      </div>

      <div class="footer-divider">
        <p class="footer-copyright text-xs text-center px-4"
           th:if="${theme.config.footer?.copyright != null and !#strings.isEmpty(theme.config.footer.copyright)}"
           th:utext="${theme.config.footer.copyright}">
          自定义版权
        </p>
        <p class="footer-copyright text-xs text-center px-4"
           th:unless="${theme.config.footer?.copyright != null and !#strings.isEmpty(theme.config.footer.copyright)}">
          &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span>
          <th:block th:text="${site.title}">Site</th:block>.
          保留所有权利。
        </p>
      </div>

      <p class="footer-copyright text-xs text-center"
         th:if="${theme.config.footer?.theme_credit == true}">
        Powered by Halo · NUCMA
      </p>
    </div>

  </div>
</footer>

</html>
