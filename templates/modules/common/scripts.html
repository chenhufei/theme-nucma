<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- 注入 <head> 的主题初始化脚本，防止 FOUC -->
<th:block th:fragment="headMeta">
  <!-- Favicon：优先用站点 favicon，否则用站点 logo，最后用 SVG 占位 -->
  <th:block th:if="${site != null and site.favicon != null and !#strings.isEmpty(site.favicon)}">
    <link rel="icon" th:href="${site.favicon}" type="image/x-icon" sizes="any" />
  </th:block>
  <th:block th:if="${site == null or site.favicon == null or #strings.isEmpty(site.favicon)}">
    <th:block th:if="${site != null and site.logo != null and !#strings.isEmpty(site.logo) and (#strings.startsWith(site.logo, 'http://') or #strings.startsWith(site.logo, 'https://') or #strings.startsWith(site.logo, '/'))}">
      <link rel="icon" th:href="${site.logo}" type="image/svg+xml" sizes="any" />
    </th:block>
    <th:block th:unless="${site != null and site.logo != null and !#strings.isEmpty(site.logo) and (#strings.startsWith(site.logo, 'http://') or #strings.startsWith(site.logo, 'https://') or #strings.startsWith(site.logo, '/'))}">
      <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 20 L80 50 L50 80 L20 50 Z' fill='%23111111' opacity='0.8'/><path d='M50 35 L65 50 L50 65 L35 50 Z' fill='white' opacity='0.9'/></svg>" type="image/svg+xml" sizes="any" />
    </th:block>
  </th:block>

  <!-- DNS 预解析 -->
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://registry.npmmirror.com">
  
  <!-- 霞鹜文楷字体已禁用（避免加载大量字体文件影响性能） -->
  <!-- 如需启用，请在后台设置中开启 "加载霞鹜文楷字体" -->

  <!-- 正文字体 -->
  <th:block th:with="bodyFont = ${theme.config.appearance?.body_font ?: 'system'}">
    <th:block th:if="${bodyFont == 'system'}">
      <style>body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; --font-heading: var(--font-body); }</style>
    </th:block>

    <th:block th:if="${bodyFont == 'misans'}">
      <link rel="stylesheet" href="https://registry.npmmirror.com/misans/4.1.0/files/lib/Normal/MiSans-Regular.min.css">
      <link rel="stylesheet" href="https://registry.npmmirror.com/misans/4.1.0/files/lib/Normal/MiSans-Medium.min.css">
      <link rel="stylesheet" href="https://registry.npmmirror.com/misans/4.1.0/files/lib/Normal/MiSans-Bold.min.css">
      <style th:inline="css">
        :root {
          --font-body: 'MiSans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
          --font-heading: var(--font-body);
          --theme-body-font-weight: [[${theme.config.appearance?.misans_weight == 'bold' ? '500' : theme.config.appearance?.misans_weight == 'medium' ? '400' : '400'}]];
          --theme-heading-font-weight: [[${theme.config.appearance?.misans_weight == 'regular' ? '650' : '700'}]];
        }
      </style>
    </th:block>

    <th:block th:if="${bodyFont == 'lxgw-wenkai'}">
      <style>body { font-family: 'LXGW WenKai Screen', 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-body: 'LXGW WenKai Screen', 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-heading: var(--font-body); }</style>
    </th:block>

    <th:block th:if="${bodyFont == 'custom'}">
      <th:block th:with="customUrl = ${theme.config.appearance?.custom_font_url}">
        <style th:if="${customUrl != null and !#strings.isEmpty(customUrl)}"
               th:utext="'@import url(\'' + ${customUrl} + '\');'"></style>
      </th:block>
      <th:block th:with="customFamily = ${theme.config.appearance?.custom_font_family}">
        <style th:if="${customFamily != null and !#strings.isEmpty(customFamily)}"
               th:utext="'body { font-family: ' + ${customFamily} + '; --font-body: ' + ${customFamily} + '; --font-heading: var(--font-body); }'"></style>
      </th:block>
    </th:block>
  </th:block>

  <style>
    .hero-subtitle,
    .hero-motto {
      font-family: inherit;
    }
  </style>

  <!-- 动效控制：关闭时所有 reveal 元素直接可见 -->
  <style th:if="${theme.config.appearance?.enable_animations == false}">
    .reveal, .reveal-d1, .reveal-d2, .reveal-d3, .reveal-d4, .reveal-d5, .reveal-d6,
    .reveal-up, .reveal-down, .reveal-left, .reveal-right, .reveal-fade,
    .reveal-scale, .reveal-flip, .reveal-rotate, .reveal-zoom, .reveal-blur,
    .reveal-swing, .reveal-bounce {
      opacity: 1 ;
      transform: none ;
      transition: none ;
      animation: none ;
    }
  </style>

  <!-- 返回顶部按钮控制 -->
  <style th:if="${theme.config.appearance?.enable_back_to_top == false}">
    #backToTop { display: none ; }
  </style>

  <!-- 固定主题变量初始化 -->
  <script th:inline="javascript">
    /*<![CDATA[*/
    (function() {
      var cardRadius = /*[[${theme.config.appearance?.card_radius ?: 'xl'}]]*/ 'xl';
      var proseSize = /*[[${theme.config.post?.prose_size ?: 'base'}]]*/ 'base';
      var proseFont = /*[[${theme.config.post?.content_font ?: 'body'}]]*/ 'body';
      var proseCustomFamily = /*[[${theme.config.post?.content_font_family ?: ''}]]*/ '';
      var backgroundMode = /*[[${theme.config.appearance?.background_mode ?: 'mesh'}]]*/ 'mesh';
      var backgroundImageValue = /*[[${theme.config.appearance?.background_image ?: ''}]]*/ '';
      var backgroundPosition = /*[[${theme.config.appearance?.background_position ?: 'center center'}]]*/ 'center center';
      var backgroundImageOpacity = /*[[${theme.config.appearance?.background_image_opacity ?: '0.28'}]]*/ '0.28';
      var backgroundPatternOpacity = /*[[${theme.config.appearance?.background_pattern_opacity ?: '0.52'}]]*/ '0.52';
      var glassStrength = /*[[${theme.config.appearance?.glass_strength ?: 'standard'}]]*/ 'standard';
      var glassRefraction = /*[[${theme.config.appearance?.glass_refraction ?: 'adaptive'}]]*/ 'adaptive';
      var glassDensity = /*[[${theme.config.appearance?.glass_density ?: 'balanced'}]]*/ 'balanced';
      var radiusMap = { sm: '10px', md: '14px', xl: '18px', '2xl': '22px' };
      var sizeMap = { sm: '0.875rem', base: '1rem', lg: '1.125rem' };
      var proseFontMap = {
        body: 'var(--font-body)',
        system: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
        serif: '"Noto Serif SC", "Songti SC", "SimSun", serif',
        kai: '"LXGW WenKai Screen", "LXGW WenKai", "Kaiti SC", "KaiTi", serif',
        custom: proseCustomFamily || 'var(--font-body)'
      };
      var html = document.documentElement;
      var allowedBackgroundModes = ['mesh', 'aurora', 'campus-grid', 'paper', 'prism', 'night', 'plain', 'image', 'none'];
      var allowedGlassStrengths = ['soft', 'standard', 'strong'];
      var allowedGlassRefractions = ['adaptive', 'on', 'off'];
      var allowedGlassDensities = ['airy', 'balanced', 'solid'];
      function resolveAttachmentUrl(value) {
        if (!value) return '';
        if (typeof value === 'string') return value.trim();
        if (Array.isArray(value)) return resolveAttachmentUrl(value[0]);
        if (typeof value === 'object') {
          return String(
            value.permalink
            || value.url
            || value.href
            || (value.status && value.status.permalink)
            || (value.spec && value.spec.url)
            || ''
          ).trim();
        }
        return String(value).trim();
      }
      var backgroundImage = resolveAttachmentUrl(backgroundImageValue);
      function clampNumber(value, fallback, min, max) {
        var number = parseFloat(value);
        if (!isFinite(number)) return fallback;
        return Math.min(max, Math.max(min, number));
      }
      var safeBackgroundMode = allowedBackgroundModes.indexOf(backgroundMode) >= 0 ? backgroundMode : 'mesh';
      var safeGlassStrength = allowedGlassStrengths.indexOf(glassStrength) >= 0 ? glassStrength : 'standard';
      var safeGlassRefraction = allowedGlassRefractions.indexOf(glassRefraction) >= 0 ? glassRefraction : 'adaptive';
      var safeGlassDensity = allowedGlassDensities.indexOf(glassDensity) >= 0 ? glassDensity : 'balanced';
      var safeImageOpacity = clampNumber(backgroundImageOpacity, 0.28, 0, 1);
      var safePatternOpacity = clampNumber(backgroundPatternOpacity, 0.52, 0, 1);
      var imageOverlayOpacity = Math.min(0.76, Math.max(0.2, 0.78 - safeImageOpacity));
      var imageOverlayDarkOpacity = Math.min(0.82, Math.max(0.28, 0.88 - safeImageOpacity));
      var imageOverlaySoftOpacity = Math.min(0.7, Math.max(0.14, imageOverlayOpacity * 0.72));
      var imageOverlayDarkSoftOpacity = Math.min(0.78, Math.max(0.22, imageOverlayDarkOpacity * 0.78));

      html.style.setProperty('--radius-card', radiusMap[cardRadius] || '16px');
      html.style.setProperty('--theme-prose-font-size', sizeMap[proseSize] || '1rem');
      html.style.setProperty('--font-prose', proseFontMap[proseFont] || proseFontMap.body);
      html.style.setProperty('--theme-custom-bg-position', backgroundPosition || 'center center');
      html.style.setProperty('--theme-bg-image-opacity', safeImageOpacity.toFixed(3));
      html.style.setProperty('--theme-bg-pattern-opacity', safePatternOpacity.toFixed(3));
      html.style.setProperty('--theme-bg-image-overlay-opacity', imageOverlayOpacity.toFixed(3));
      html.style.setProperty('--theme-bg-image-dark-overlay-opacity', imageOverlayDarkOpacity.toFixed(3));
      html.style.setProperty('--theme-bg-image-overlay-soft-opacity', imageOverlaySoftOpacity.toFixed(3));
      html.style.setProperty('--theme-bg-image-dark-overlay-soft-opacity', imageOverlayDarkSoftOpacity.toFixed(3));
      if (backgroundImage) {
        html.style.setProperty('--theme-custom-bg-image', 'url("' + String(backgroundImage).replace(/"/g, '\\"') + '")');
      } else {
        html.style.setProperty('--theme-custom-bg-image', 'none');
      }
      allowedBackgroundModes.forEach(function(mode) {
        html.classList.remove('theme-bg-' + mode);
      });
      allowedGlassStrengths.forEach(function(strength) {
        html.classList.remove('theme-glass-' + strength);
      });
      allowedGlassRefractions.forEach(function(mode) {
        html.classList.remove('theme-glass-refraction-' + mode);
      });
      allowedGlassDensities.forEach(function(density) {
        html.classList.remove('theme-glass-density-' + density);
      });
      html.classList.toggle('theme-bg-has-image', !!backgroundImage);
      html.classList.add('theme-bg-' + safeBackgroundMode);
      html.classList.add('theme-glass-' + safeGlassStrength);
      html.classList.add('theme-glass-refraction-' + safeGlassRefraction);
      html.classList.add('theme-glass-density-' + safeGlassDensity);
    })();
  </script>

  <!-- 主题配置传递给前端 -->
  <script th:inline="javascript">
    /*<![CDATA[*/
    window.themeConfig = Object.assign({}, window.themeConfig || {}, {
      appearance: Object.assign({}, (window.themeConfig && window.themeConfig.appearance) || {}, {
        default_theme_mode: /*[[${theme.config.appearance?.default_theme_mode ?: 'system'}]]*/ 'system',
        card_radius: /*[[${theme.config.appearance?.card_radius ?: 'xl'}]]*/ 'xl',
        body_font: /*[[${theme.config.appearance?.body_font ?: 'system'}]]*/ 'system',
        background_mode: /*[[${theme.config.appearance?.background_mode ?: 'mesh'}]]*/ 'mesh',
        background_image: /*[[${theme.config.appearance?.background_image ?: ''}]]*/ '',
        background_position: /*[[${theme.config.appearance?.background_position ?: 'center center'}]]*/ 'center center',
        background_image_opacity: /*[[${theme.config.appearance?.background_image_opacity ?: '0.28'}]]*/ '0.28',
        background_pattern_opacity: /*[[${theme.config.appearance?.background_pattern_opacity ?: '0.52'}]]*/ '0.52',
        glass_strength: /*[[${theme.config.appearance?.glass_strength ?: 'standard'}]]*/ 'standard',
        glass_refraction: /*[[${theme.config.appearance?.glass_refraction ?: 'adaptive'}]]*/ 'adaptive',
        glass_density: /*[[${theme.config.appearance?.glass_density ?: 'balanced'}]]*/ 'balanced',
        enable_back_to_top: /*[[${theme.config.appearance?.enable_back_to_top == null or theme.config.appearance.enable_back_to_top != false}]]*/ true,
        enable_profile_style: /*[[${theme.config.appearance?.enable_profile_style == null or theme.config.appearance.enable_profile_style != false}]]*/ true,
        enable_console_style: /*[[${theme.config.appearance?.enable_console_style == null or theme.config.appearance.enable_console_style != false}]]*/ true
      }),
      header: Object.assign({}, (window.themeConfig && window.themeConfig.header) || {}, {
        search_expand_mode: /*[[${theme.config.header?.search_expand_mode ?: 'hover'}]]*/ 'hover'
      }),
      home: Object.assign({}, (window.themeConfig && window.themeConfig.home) || {}, {
        posts_per_page: /*[[${theme.config.home?.posts_per_page ?: 8}]]*/ 8,
        section_order_items: /*[[${theme.config.home?.section_order_items ?: null}]]*/ null,
        section_order: /*[[${theme.config.home?.section_order ?: 'hero,about-alliance,service-directions,site-portal,posts,links,members,reviews,faq'}]]*/ 'hero,about-alliance,service-directions,site-portal,posts,links,members,reviews,faq'
      }),
      post: Object.assign({}, (window.themeConfig && window.themeConfig.post) || {}, {
        content_font: /*[[${theme.config.post?.content_font ?: 'body'}]]*/ 'body',
        content_font_family: /*[[${theme.config.post?.content_font_family ?: ''}]]*/ ''
      }),
      interaction: Object.assign({}, (window.themeConfig && window.themeConfig.interaction) || {}, {
        site_popups: /*[[${theme.config.interaction?.site_popups ?: null}]]*/ null
      }),
      advanced: Object.assign({}, (window.themeConfig && window.themeConfig.advanced) || {}, {
        enable_code_copy: /*[[${theme.config.advanced?.enable_code_copy == null or theme.config.advanced.enable_code_copy != false}]]*/ true,
        enable_image_lightbox: /*[[${theme.config.advanced?.enable_image_lightbox == null or theme.config.advanced.enable_image_lightbox != false}]]*/ true,
        enable_reading_progress: /*[[${theme.config.advanced?.enable_reading_progress == null or theme.config.advanced.enable_reading_progress != false}]]*/ true,
        enable_external_link_icon: /*[[${theme.config.advanced?.enable_external_link_icon == null or theme.config.advanced.enable_external_link_icon != false}]]*/ true,
        mobile_toc_behavior: /*[[${theme.config.advanced?.mobile_toc_behavior ?: 'global'}]]*/ 'global',
        mobile_toc_min_headings: /*[[${theme.config.advanced?.mobile_toc_min_headings ?: '5'}]]*/ '5'
      }),
      performance: Object.assign({}, (window.themeConfig && window.themeConfig.performance) || {}, {
        disable_large_animations: /*[[${theme.config.performance?.disable_large_animations == true}]]*/ false,
        disable_image_lazy: /*[[${theme.config.performance?.disable_image_lazy == true}]]*/ false
      })
    });
    /*]]>*/
  </script>

  <!-- ALTCHA 脚本改由登录/注册页按需注入，避免普通页面探测 webjars 路径产生 404 -->

  <script th:inline="javascript">
    /*<![CDATA[*/
    (function() {
      var saved = localStorage.getItem('theme-mode') || localStorage.getItem('theme');
      var mode = /*[[${theme.config.appearance?.default_theme_mode ?: 'system'}]]*/ 'system';
      var resolvedMode = saved || mode;
      var isDark = resolvedMode === 'dark'
        || (resolvedMode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      var effectiveMode = isDark ? 'dark' : 'light';
      var html = document.documentElement;
      html.setAttribute('data-theme', effectiveMode);
      html.classList.remove('light', 'dark');
      html.classList.add(effectiveMode);
    })();

    // 滚动恢复策略：交给浏览器恢复，不再刷新强制回到顶部。
    (function() {
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'auto';
      }
    })();
  </script>
  <!-- 首行缩进：后台开启时在 html 上加 prose-indent 类（需在 CSS 加载前执行，防止 FOUC） -->
  <script th:if="${theme.config.post?.paragraph_indent}">
    document.documentElement.classList.add('prose-indent');
  </script>
</th:block>

<!-- 页面底部公共脚本：主题切换 + header 滚动 + 移动端菜单 -->
<th:block th:fragment="baseScripts">
  <!-- 工具函数 -->
  <script th:src="@{/assets/js/utils.js(v={VERSION})}"></script>

  <!-- 默认禁用桌面端惯性平滑滚动，避免滚轮输入延迟 -->

  <!-- 滚动动画系统 -->
  <script th:src="@{/assets/js/scroll-animations.js(v={VERSION})}"></script>

  <!-- 打字机效果 -->
  <script th:src="@{/assets/js/typewriter.js(v={VERSION})}"></script>

  <!-- 主题配置初始化 -->
  <script th:src="@{/assets/js/theme-config.js(v={VERSION})}"></script>

  <!-- Shortcodes 功能 -->
  <script th:src="@{/assets/js/shortcodes.js(v={VERSION})}"></script>

  <!-- 主题增强模块 -->
  <script th:src="@{/assets/js/theme-enhancements.js(v={VERSION})}"></script>

  <!-- 主题初始化 -->
  <script th:src="@{/assets/js/theme-init.js(v={VERSION})}"></script>

  <!-- 插件适配器 -->
  <script th:src="@{/assets/js/plugin-adapter.js(v={VERSION})}"></script>

  <!-- 移动端优化 -->
  <script th:src="@{/assets/js/mobile.js(v={VERSION})}"></script>

  <!-- 全局壳层运行时 -->
  <script th:src="@{/assets/js/theme-shell.js(v={VERSION})}"></script>
</th:block>

</html>
