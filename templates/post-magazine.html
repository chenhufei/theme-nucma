<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(title=${post?.spec?.title} + ' - ' + ${site.title}, content=~{::content}, description=${post?.spec?.excerpt?.raw}, canonical=${post?.status?.permalink}, image=${post?.spec?.cover}, pageType='article', robots=null)}">
<th:block th:fragment="content">
  <div class="template-post-magazine">
    <th:block th:replace="~{post :: content}"></th:block>
  </div>
</th:block>
</html>
