<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<th:block th:fragment="special(style, eyebrow, kicker)">
  <section th:class="'special-category special-category--' + ${style}">
    <header class="special-category__header">
      <div class="special-category__motif" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="special-category__heading">
        <span class="special-category__eyebrow" th:text="${eyebrow}"></span>
        <h1 th:text="${category?.spec?.displayName}">专题分类</h1>
        <p th:text="${category?.spec?.description != null and !#strings.isEmpty(category.spec.description) ? category.spec.description : kicker}"></p>
      </div>
      <div class="special-category__count">
        <strong th:text="${category?.status?.postCount ?: 0}">0</strong>
        <span th:text="#{special.postCountUnit}">篇专题内容</span>
      </div>
      <div th:if="${style == 'sanxiaxiang'}" class="special-category__signals" aria-label="三下乡专题方向" th:aria-label="#{special.sanxiaxiang.title}">
        <span th:text="#{special.sanxiaxiang.a1}">青春实践</span><span th:text="#{special.sanxiaxiang.a2}">服务基层</span><span th:text="#{special.sanxiaxiang.a3}">成果纪实</span>
      </div>
      <div th:if="${style == 'festival'}" class="special-category__signals" aria-label="校园节庆专题方向" th:aria-label="#{special.youth.title}">
        <span th:text="#{special.youth.a1}">社团风采</span><span th:text="#{special.youth.a2}">舞台现场</span><span th:text="#{special.youth.a3}">青春记忆</span>
      </div>
      <div th:if="${style == 'future'}" class="special-category__signals" aria-label="科技未来专题方向" th:aria-label="#{special.digital.title}">
        <span th:text="#{special.digital.a1}">创新实验</span><span th:text="#{special.digital.a2}">青年创客</span><span th:text="#{special.digital.a3}">数字校园</span>
      </div>
      <div th:if="${style == 'volunteer'}" class="special-category__signals" aria-label="公益志愿专题方向" th:aria-label="#{special.volunteer.title}">
        <span th:text="#{special.volunteer.a1}">志愿行动</span><span th:text="#{special.volunteer.a2}">公益项目</span><span th:text="#{special.volunteer.a3}">温暖故事</span>
      </div>
      <div th:if="${style == 'heritage'}" class="special-category__signals" aria-label="传统文化专题方向" th:aria-label="#{special.heritage.title}">
        <span th:text="#{special.heritage.a1}">非遗新生</span><span th:text="#{special.heritage.a2}">文化寻访</span><span th:text="#{template.category.heritage.title}">青年传承</span>
      </div>
      <div th:if="${style == 'sports'}" class="special-category__signals" aria-label="体育赛事专题方向" th:aria-label="#{special.sports.title}">
        <span th:text="#{special.sports.a1}">赛事速递</span><span th:text="#{special.sports.a2}">人物瞬间</span><span th:text="#{special.sports.a3}">团队荣誉</span>
      </div>
    </header>

    <div th:if="${posts != null and posts.items != null and !posts.items.isEmpty()}" class="special-category__content">
      <article class="special-category__lead" th:each="post, iter : ${posts.items}" th:if="${iter.index == 0}">
        <a th:href="@{${post.status?.permalink}}" class="special-category__lead-link">
          <div class="special-category__lead-media" th:if="${post.spec?.cover != null and !#strings.isEmpty(post.spec.cover)}">
            <img th:src="${post.spec.cover}" th:alt="${post.spec?.title}" width="1200" height="675"
                 loading="eager" fetchpriority="high" decoding="async"
                 sizes="(max-width: 900px) 96vw, 1200px" />
          </div>
          <div class="special-category__lead-copy">
            <span class="special-category__label" th:switch="${style}">
              <th:block th:case="'future'" th:text="#{special.feature.a1}">前沿观察</th:block>
              <th:block th:case="'volunteer'" th:text="#{special.feature.a2}">行动现场</th:block>
              <th:block th:case="'heritage'" th:text="#{special.heritage.a3}">文化档案</th:block>
              <th:block th:case="'sports'" th:text="#{special.sports.a4}">赛场焦点</th:block>
              <th:block th:case="'festival'" th:text="#{template.category.youth.title}">青春现场</th:block>
              <th:block th:case="*" th:text="#{special.campaign.a1}">重点报道</th:block>
            </span>
            <time th:text="${#temporals.format(post.spec?.publishTime, 'yyyy-MM-dd')}"></time>
            <h2 th:text="${post.spec?.title}"></h2>
            <p th:if="${post.spec?.excerpt?.raw != null}" th:text="${post.spec.excerpt.raw}"></p>
            <span class="special-category__read" th:text="#{friends.readMore}">阅读全文</span>
          </div>
        </a>
      </article>

      <div class="special-category__grid">
        <article class="special-category__item" th:each="post, iter : ${posts.items}" th:if="${iter.index > 0}">
          <a th:href="@{${post.status?.permalink}}">
            <div class="special-category__item-media" th:if="${post.spec?.cover != null and !#strings.isEmpty(post.spec.cover)}">
              <img th:src="${post.spec.cover}" th:alt="${post.spec?.title}" width="640" height="360"
                   loading="lazy" decoding="async"
                   sizes="(max-width: 900px) 96vw, 320px" />
            </div>
            <div class="special-category__item-copy">
              <div class="special-category__meta">
                <span th:text="${iter.count < 10 ? '0' + iter.count : iter.count}"></span>
                <time th:text="${#temporals.format(post.spec?.publishTime, 'MM-dd')}"></time>
              </div>
              <h2 th:text="${post.spec?.title}"></h2>
              <p th:if="${post.spec?.excerpt?.raw != null}" th:text="${post.spec.excerpt.raw}"></p>
            </div>
          </a>
        </article>
      </div>
    </div>

    <div th:if="${posts == null or posts.items == null or posts.items.isEmpty()}" class="alert alert-soft alert-vertical empty-state">
      <p class="empty-text" th:text="#{special.empty}">该专题暂时没有文章</p>
      <p class="empty-sub" th:text="#{special.emptyHint}">内容发布后将在这里集中展示</p>
    </div>

    <nav class="join pagination" th:if="${posts != null and (posts.hasPrevious() or posts.hasNext())}">
      <a th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}" class="btn btn-outline btn-sm join-item page-btn" th:text="#{common.previousPage}">上一页</a>
      <span class="badge badge-outline join-item page-info" th:text="|${posts.page} / ${posts.totalPages}|"></span>
      <a th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}" class="btn btn-outline btn-sm join-item page-btn" th:text="#{common.nextPage}">下一页</a>
    </nav>
  </section>
</th:block>
</html>
