<!-- Plugin Container -->
<div th:fragment="plugin-container(pluginName, apiUrl = '')"
     th:with="pluginName=${pluginName}, apiUrl=${apiUrl}">
  <div th:switch="${pluginName}">
    <div th:case="'bilibili-bangumi'"
         th:replace="~{components/plugins :: bilibili-bangumi(apiUrl=${apiUrl})}"></div>
    <div th:case="'steam-games'"
         th:replace="~{components/plugins :: steam-games(apiUrl=${apiUrl})}"></div>
    <div th:case="'gallery'"
         th:replace="~{components/plugins :: gallery(apiUrl=${apiUrl})}"></div>
    <div th:case="'photos'"
         th:replace="~{components/plugins :: photos(apiUrl=${apiUrl})}"></div>
    <div th:case="'photo'"
         th:replace="~{components/plugins :: photo(apiUrl=${apiUrl})}"></div>
    <div th:case="'moments'"
         th:replace="~{components/plugins :: moments(apiUrl=${apiUrl})}"></div>
    <div th:case="'moment'"
         th:replace="~{components/plugins :: moment(apiUrl=${apiUrl})}"></div>
    <div th:case="'links'"
         th:replace="~{components/plugins :: links(apiUrl=${apiUrl})}"></div>
    <div th:case="'friends'"
         th:replace="~{components/plugins :: friends(apiUrl=${apiUrl})}"></div>
    <div th:case="'members'"
         th:replace="~{components/plugins :: members(apiUrl=${apiUrl})}"></div>
  </div>
</div>
