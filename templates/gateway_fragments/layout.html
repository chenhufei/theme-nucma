<!doctype html>
<html th:classappend="|theme-bg-${theme.config.appearance?.background_mode ?: 'mesh'} theme-glass-${theme.config.appearance?.glass_strength ?: 'standard'} ${(theme.config.appearance?.enable_profile_style == null or theme.config.appearance.enable_profile_style != false) ? 'theme-profile-enhanced' : ''} ${(theme.config.appearance?.enable_console_style == null or theme.config.appearance.enable_console_style != false) ? 'theme-console-enhanced' : ''}|"
      th:lang="${#locale.toLanguageTag}"
      th:fragment="layout (title,head,body)">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2" />
    <title th:text="${title}">Auth</title>

    <link rel="stylesheet" th:href="@{/webjars/normalize.css/8.0.1/normalize.css}" />
    <link rel="stylesheet" th:href="|/styles/main.css?v=${site.version}|" />
    <th:block th:replace="~{gateway_fragments/common::basicStaticResources}"></th:block>

    <th:block th:if="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}">
        <link rel="stylesheet" th:href="@{/assets/css/main.css(v={VERSION})}" />
        <link rel="stylesheet" th:href="@{/assets/css/auth-split.css(v={VERSION})}" />
        <th:block th:replace="~{modules/common/components :: headMeta}"></th:block>
    </th:block>

    <th:block th:if="${head != null}">
        <th:block th:replace="${head}" />
    </th:block>
</head>
<body th:class="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false} ? 'theme-page theme-auth-page font-sans text-base-content antialiased selection:bg-primary selection:text-primary-content' : null">
    <th:block th:if="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}"
              th:replace="~{modules/common/components :: header}"></th:block>
    <th:block th:if="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}"
              th:replace="~{modules/common/components :: mobileMenu}"></th:block>

    <div class="auth-page-split" th:if="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}">
        <div class="auth-brand">
            <div class="grid-overlay"></div>
            <div class="auth-watchers" aria-hidden="true">
                <div class="auth-orb" data-depth="1">
                    <span class="auth-orb-ring"></span>
                    <span class="auth-orb-glow"></span>
                    <img th:if="${site.logo != null and !#strings.isEmpty(site.logo)}"
                         th:src="${site.logo}"
                         th:alt="${site.title ?: 'Nucma'}" />
                    <span th:unless="${site.logo != null and !#strings.isEmpty(site.logo)}"
                          th:text="${#strings.substring(site.title ?: 'N', 0, 1)}">N</span>
                </div>
            </div>
            <div class="brand-text">
                <h1 th:text="${site.title ?: 'Nucma'}">Site</h1>
                <p>探索、记录、分享</p>
            </div>
        </div>

        <main class="auth-form-section-split">
            <div class="auth-form-container auth-shell">
                <th:block th:replace="${body}" />
            </div>
            <div class="auth-copyright">
                <span>&copy;</span>
                <a href="/" class="ml-1" th:text="${site.title ?: 'Nucma'}">Site</a>
            </div>
        </main>
    </div>

    <th:block th:unless="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}"
              th:replace="${body}" />
    <th:block th:if="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}"
              th:replace="~{modules/common/components :: footer}"></th:block>
    <th:block th:if="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}"
              th:replace="~{modules/common/components :: baseScripts}"></th:block>
    <script th:if="${theme.config.appearance?.enable_login_style == null or theme.config.appearance.enable_login_style != false}"
            th:src="@{/assets/js/auth-characters.js(v={VERSION})}" defer></script>
</body>
</html>
