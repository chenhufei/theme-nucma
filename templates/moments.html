<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(title='瞬间 - ' + ${site.title}, content=~{::content}, description='浏览本站发布的瞬间动态', canonical='/moments', image=${site.logo}, pageType='website', robots=null)}">
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title">瞬间</h1>
    <p class="page-desc">记录校园生活点滴</p>
  </div>

  <!-- 标签筛选 -->
  <div class="moment-tags" th:if="${tags != null and !tags.isEmpty()}">
    <a th:href="@{/moments}" class="moment-tag" th:classappend="${param.tag == null ? 'active' : ''}">全部</a>
    <a th:each="tag : ${tags}" th:href="@{|/moments?tag=${tag.name}|}" class="moment-tag"
       th:classappend="${param.tag == tag.name ? 'active' : ''}"
       th:text="${tag.name}"></a>
  </div>

  <!-- 瞬间列表 -->
  <div class="moment-list" th:if="${moments != null and moments.items != null and !moments.items.isEmpty()}">
    <div class="moment-item" th:each="moment : ${moments.items}" th:with="content=${moment.spec.content}">
      <div class="moment-header">
        <img th:if="${moment.owner?.avatar != null}" th:src="${moment.owner?.avatar}"
             th:alt="${moment.owner?.displayName ?: '瞬间作者'}" class="moment-avatar"
             width="44" height="44" loading="lazy" decoding="async" />
        <div>
          <span class="moment-author" th:text="${moment.owner?.displayName}"></span>
          <time class="moment-time" th:text="${#temporals.format(moment.spec?.releaseTime, 'yyyy-MM-dd HH:mm')}"></time>
        </div>
      </div>
      <div class="moment-body" th:if="${content != null and not #strings.isEmpty(content.html)}" th:utext="${content.html}"></div>
      <div class="moment-media" th:if="${content != null and not #lists.isEmpty(content.medium)}">
        <th:block th:each="item : ${content.medium}">
          <img th:if="${item.type.name == 'PHOTO'}" th:src="${item.url}"
               alt="瞬间图片" class="moment-image" loading="lazy" decoding="async" width="300" height="225" />
          <video th:if="${item.type.name == 'VIDEO'}" th:src="${item.url}" controls class="moment-video"></video>
          <audio th:if="${item.type.name == 'AUDIO'}" th:src="${item.url}" controls class="moment-audio"></audio>
        </th:block>
      </div>
      <div class="moment-footer">
        <span th:if="${moment.stats?.upvote != null and moment.stats.upvote > 0}"
              th:text="'👍 ' + ${moment.stats.upvote}"></span>
      </div>
    </div>
  </div>

  <div class="empty-state" th:unless="${moments != null and moments.items != null and !moments.items.isEmpty()}">
    <p>暂无瞬间</p>
  </div>

  <nav class="pagination" th:if="${moments != null and (moments.hasPrevious() or moments.hasNext())}">
    <a th:if="${moments.hasPrevious()}" th:href="@{${moments.prevUrl}}" class="page-btn">上一页</a>
    <span class="page-info" th:text="${moments.page} + ' / ' + ${moments.totalPages}"></span>
    <a th:if="${moments.hasNext()}" th:href="@{${moments.nextUrl}}" class="page-btn">下一页</a>
  </nav>
</th:block>
</html>
