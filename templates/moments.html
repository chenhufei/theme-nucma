<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=|${#messages.msg('moments.heading')} - ${site.title}|, content=~{::content}, headExtra=~{modules/layout :: noHead}, description=|${#messages.msg('moments.description')}|, canonical='/moments', image=${site.logo}, pageType='website', robots=null)}">
<th:block th:fragment="content">
  <div class="page-header">
    <h1 class="page-title" th:text="#{moments.heading}">瞬间</h1>
    <p class="page-desc" th:text="#{moments.subtitle}">记录校园生活点滴</p>
  </div>

  <!--
    标签筛选：URL 上的参数是字符串数组，必须先取首个值再比较，
    直接拿整个数组和标签名比较永远不相等，高亮会一直失效。
  -->
  <div class="moment-tags" th:if="${tags != null and !tags.isEmpty()}"
       th:with="activeTag = ${param.tag != null and !#arrays.isEmpty(param.tag) ? param.tag[0] : null}">
    <a th:href="@{/moments}" class="btn btn-sm btn-soft moment-tag"
       th:classappend="${activeTag == null} ? 'active btn-active' : ''" th:text="#{moments.all}">全部</a>
    <a th:each="tag : ${tags}" th:href="@{/moments(tag=${tag.name})}" class="btn btn-sm btn-soft moment-tag"
       th:classappend="${activeTag != null and activeTag == tag.name} ? 'active btn-active' : ''"
       th:text="${tag.name}"></a>
  </div>

  <!-- 瞬间列表 -->
  <div class="moment-list" th:if="${moments != null and moments.items != null and !moments.items.isEmpty()}">
    <div class="moment-item" th:each="moment : ${moments.items}" th:with="content=${moment.spec.content}">
      <div class="moment-header">
        <img th:if="${moment.owner?.avatar != null}" th:src="${moment.owner?.avatar}"
             th:alt="${moment.owner?.displayName ?: #messages.msg('moments.authorFallback')}" class="moment-avatar"
             width="44" height="44" loading="lazy" decoding="async" />
        <div>
          <span class="moment-author" th:text="${moment.owner?.displayName}"></span>
          <time class="moment-time" th:text="${#temporals.format(moment.spec?.releaseTime, 'yyyy-MM-dd HH:mm')}"></time>
        </div>
      </div>
      <div class="moment-body" th:if="${content != null and not #strings.isEmpty(content.html)}" th:utext="${content.html}"></div>
      <div class="moment-media" th:if="${content != null and not #lists.isEmpty(content.medium)}">
        <th:block th:each="item : ${content.medium}">
          <img th:if="${item.type.name == 'PHOTO'}" th:src="${item.url}"
               alt="瞬间图片" th:alt="#{moments.imageAlt}" class="moment-image" loading="lazy" decoding="async"
               sizes="(max-width: 640px) 88vw, 300px" width="300" height="225" />
          <video th:if="${item.type.name == 'VIDEO'}" th:src="${item.url}" controls class="moment-video"></video>
          <audio th:if="${item.type.name == 'AUDIO'}" th:src="${item.url}" controls class="moment-audio"></audio>
        </th:block>
      </div>
      <div class="moment-footer">
        <span th:if="${moment.stats?.upvote != null and moment.stats.upvote > 0}"
              th:text="'👍 ' + ${moment.stats.upvote}"></span>
      </div>
    </div>
  </div>

  <div class="alert alert-soft alert-vertical empty-state" th:unless="${moments != null and moments.items != null and !moments.items.isEmpty()}">
    <p th:text="#{moments.emptyList}">暂无瞬间</p>
  </div>

  <nav class="join pagination" th:if="${moments != null and (moments.hasPrevious() or moments.hasNext())}">
    <a th:if="${moments.hasPrevious()}" th:href="@{${moments.prevUrl}}" class="btn btn-outline btn-sm join-item page-btn" th:text="#{common.previousPage}">上一页</a>
    <span class="badge badge-outline join-item page-info" th:text="|${moments.page} / ${moments.totalPages}|"></span>
    <a th:if="${moments.hasNext()}" th:href="@{${moments.nextUrl}}" class="btn btn-outline btn-sm join-item page-btn" th:text="#{common.nextPage}">下一页</a>
  </nav>
</th:block>
</html>
