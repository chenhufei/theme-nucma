<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=|${post?.spec?.title} - ${site.title}|, content=~{::content}, headExtra=~{modules/seo :: article(post=${post})}, description=${post?.spec?.excerpt?.raw != null and !#strings.isEmpty(post.spec.excerpt.raw) ? post.spec.excerpt.raw : post?.status?.excerpt}, canonical=${post?.status?.permalink}, image=${post?.spec?.cover}, pageType='article', robots=null)}">
<th:block th:fragment="content"
          th:with="globalDateFmt=${theme.config.appearance?.date_format == null or #strings.isEmpty(theme.config.appearance?.date_format) ? #messages.msg('format.date') : #strings.replace(#strings.replace(theme.config.appearance.date_format, 'YYYY', 'yyyy'), 'DD', 'dd')},
                   postDateStyle=${theme.config.sidebar?.date_style ?: 'day'},
                   postDatePattern=${postDateStyle == 'month' ? #messages.msg('format.month') : (postDateStyle == 'year' ? #messages.msg('format.year') : globalDateFmt)},
                   creditName=${post.metadata?.annotations != null and !#strings.isEmpty(post.metadata.annotations['nucma.cn/author']) ? post.metadata.annotations['nucma.cn/author'] : (theme.config.sidebar?.author_text != null and !#strings.isEmpty(theme.config.sidebar.author_text) ? theme.config.sidebar.author_text : (post.owner?.displayName ?: ''))}">
  <div class="post-layout">
    <!-- 左侧：文章内容 -->
    <article class="post-main"
             th:attr="data-article-title=${post?.spec?.title},
                      data-pair-images=${theme.config.sidebar?.pair_images != false},
                      data-credit-label=${theme.config.sidebar?.credit_label != null and !#strings.isEmpty(theme.config.sidebar.credit_label) ? theme.config.sidebar.credit_label : #messages.msg('post.creditLabel')},
                      data-highlight=${theme.config.sidebar?.highlight_enabled != false},
                      data-highlight-style=${theme.config.sidebar?.highlight_style ?: 'underline'},
                      data-article-url=${post?.status?.permalink},
                      data-article-category=${post?.categories != null and !post.categories.isEmpty() ? post.categories[0].spec?.displayName : ''},
                      data-article-author=${creditName},
                      data-author-prefix=#{post.bylinePrefix},
                      data-article-date=${#temporals.format(post.spec?.publishTime, postDatePattern)}">
      <!-- 文章头部：栏目 · 日期 · 阅读 → 标题 → 副标题（标题块居中），署名单独一行左顶格 -->
      <header class="post-header"
              th:with="deckText=${post.spec?.excerpt?.raw != null and !#strings.isEmpty(post.spec.excerpt.raw) ? post.spec.excerpt.raw : post.status?.excerpt}">
        <div class="post-kicker">
          <a class="post-cat" th:each="cat : ${post.categories}"
             th:href="@{${cat.status?.permalink}}"
             th:text="${cat.spec?.displayName}"></a>
          <span class="post-kicker-sep" aria-hidden="true">·</span>
          <time th:text="${#temporals.format(post.spec?.publishTime, postDatePattern)}"></time>
          <th:block th:if="${theme.config.sidebar?.show_views != false and post.stats?.visit != null}">
            <span class="post-kicker-sep" aria-hidden="true">·</span>
            <span th:text="${#messages.msg('post.viewsSuffix', post.stats?.visit)}"></span>
          </th:block>
        </div>

        <h1 class="post-title" th:text="${post.spec?.title}"></h1>

        <!-- 副标题：优先自定义摘要，抽屉里没填时回落到 Halo 的最终摘要（自动生成摘要=是 时只有后者有值） -->
        <p class="post-deck" th:if="${deckText != null and !#strings.isEmpty(deckText)}"
           th:text="${deckText}"></p>

        <!--
          署名：三级回落 —— 单篇元数据 nucma.cn/author（「文章署名」插件写入）→ 主题设置「文章署名文字」→ 注册作者。
        -->
        <div class="post-byline" th:if="${!#strings.isEmpty(creditName)}">
          <span class="post-byline-label" th:text="#{post.bylinePrefix}">文</span>
          <span class="post-byline-sep" aria-hidden="true">/</span>
          <span class="post-byline-name" th:text="${creditName}"></span>
        </div>
      </header>

      <!-- 文章封面 -->
      <figure class="post-cover" th:if="${theme.config.sidebar?.show_cover != false and post.spec?.cover != null and !#strings.isEmpty(post.spec?.cover)}">
        <img th:src="${post.spec?.cover}" th:alt="${post.spec?.title}"
             width="1600" height="900" loading="eager" fetchpriority="high" decoding="async"
             sizes="(max-width: 900px) 100vw, 900px" />
      </figure>

      <!-- 文章内容 -->
      <div class="post-content prose" th:utext="${post.content?.content}"></div>

      <!-- 上一篇/下一篇：对开两栏，中间一条竖线 -->
      <nav class="post-nav" th:with="cursor = ${postFinder.cursor(post.metadata.name)}"
           th:aria-label="#{post.navLabel}">
        <a th:if="${cursor.hasPrevious()}" th:href="@{${cursor.previous.status?.permalink}}" class="post-nav-item prev">
          <span class="post-nav-label" th:text="#{common.previous}">上一篇</span>
          <span class="post-nav-title" th:text="${cursor.previous.spec?.title}"></span>
        </a>
        <a th:if="${cursor.hasNext()}" th:href="@{${cursor.next.status?.permalink}}" class="post-nav-item next">
          <span class="post-nav-label" th:text="#{common.next}">下一篇</span>
          <span class="post-nav-title" th:text="${cursor.next.spec?.title}"></span>
        </a>
      </nav>

      <div class="post-tags" th:if="${theme.config.sidebar?.show_tags != false and post.tags != null and !post.tags.isEmpty()}">
        <a th:each="tag : ${post.tags}" th:href="@{${tag.status?.permalink}}"
           class="badge badge-outline badge-sm tag" th:text="|#${tag.spec?.displayName}|"></a>
      </div>

      <!-- 评论区 -->
      <section th:if="${haloCommentEnabled and theme.config.sidebar?.post_comment_enabled != false}" class="post-comments">
        <halo:comment group="content.halo.run" kind="Post" th:attr="name=${post.metadata.name}" />
      </section>
    </article>

    <!-- 右侧：侧边栏 -->
    <aside class="post-sidebar"
           th:with="sidebarOrder=${theme.config.sidebar?.section_blocks != null ? theme.config.sidebar.section_blocks.![type] : null}"
           th:data-sidebar-order="${sidebarOrder != null ? #strings.listJoin(sidebarOrder, ',') : 'menu,info,toc'}">
      <!-- 自定义菜单 -->
      <!-- sidebar_menu 只属于 sidebar 组，navigation 组从未声明该字段；旧的三元回落是永久空值死分支 -->
      <th:block th:with="sidebarMenuName = ${#strings.defaultString(theme.config.sidebar?.sidebar_menu, '')}">
        <div class="card card-border sidebar-card" data-sidebar-section="menu"
             th:if="${(sidebarOrder == null or #lists.contains(sidebarOrder, 'menu')) and !#strings.isEmpty(sidebarMenuName)}"
             th:with="menu = ${menuFinder.getByName(sidebarMenuName)}">
          <h3 class="sidebar-title" th:text="#{footer.quickNav}">快捷导航</h3>
          <nav class="sidebar-nav" th:if="${menu != null and menu.menuItems != null}">
            <a th:each="item : ${menu.menuItems}"
               th:href="@{${item.status?.href}}"
               th:text="${item.status?.displayName}"
               th:target="${item.spec?.target?.value}"></a>
          </nav>
        </div>
      </th:block>

      <!-- 文章信息 -->
      <div class="card card-border sidebar-card" data-sidebar-section="info"
           th:if="${sidebarOrder == null or #lists.contains(sidebarOrder, 'info')}">
        <h3 class="sidebar-title" th:text="#{post.articleInfo}">文章信息</h3>
        <div class="sidebar-info">
          <div class="info-item">
            <span class="info-label" th:text="#{post.publishedAt}">发布于</span>
            <span th:text="${#temporals.format(post.spec?.publishTime, postDatePattern)}"></span>
          </div>
          <div class="info-item" th:if="${post.stats?.visit != null}">
            <span class="info-label" th:text="#{post.viewsLabel}">阅读量</span>
            <span th:text="${post.stats?.visit}"></span>
          </div>
          <div class="info-item" th:if="${post.stats?.upvote != null}">
            <span class="info-label" th:text="#{about.upvotes}">点赞数</span>
            <span th:text="${post.stats?.upvote}"></span>
          </div>
        </div>
      </div>

      <!-- 目录 -->
      <div class="card card-border sidebar-card toc-card" id="tocCard"
           data-sidebar-section="toc"
           th:if="${(sidebarOrder == null or #lists.contains(sidebarOrder, 'toc')) and theme.config.sidebar?.auto_toc != false}">
        <h3 class="sidebar-title" th:text="#{common.toc}">目录</h3>
        <nav class="toc" id="toc"></nav>
      </div>
    </aside>
  </div>

</th:block>
</html>
