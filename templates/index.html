<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{modules/layout :: html(title=${site.title}, content=~{::content}, headExtra=~{modules/layout :: noHead}, description=${site.seo?.description ?: site.subtitle}, canonical=${site.url}, image=${site.logo}, pageType='website', robots=null)}">
<th:block th:fragment="content" th:with="dateFmt=${theme.config.appearance?.date_format == null or #strings.isEmpty(theme.config.appearance?.date_format) ? #messages.msg('format.date') : #strings.replace(#strings.replace(theme.config.appearance.date_format, 'YYYY', 'yyyy'), 'DD', 'dd')}">
  <!-- 新版首屏：11 套版式，内容全部来自后台「首屏 Hero」设置组 -->
  <th:block th:if="${theme.config.home_hero?.layout != 'none' and !#strings.startsWith(#strings.defaultString(theme.config.home_hero?.layout, 'p42r'), 'legacy-')}">
    <th:block th:replace="~{modules/home-hero :: hero}"></th:block>
  </th:block>

  <!-- Banner - 校园风格（关闭新版首屏时回退到原横幅） -->
  <section class="banner"
           th:with="heroConfig = ${theme.config.home_hero},
                     heroLayoutRaw = ${#strings.defaultString(theme.config.home_hero?.layout, 'p42r')},
                     legacyStyle = ${#strings.startsWith(#strings.defaultString(heroLayoutRaw, 'p42r'), 'legacy-') ? #strings.substring(heroLayoutRaw, 7) : 'floaters'},
                     backgrounds = ${heroConfig?.bg_carousel},
                     hasBackgrounds = ${backgrounds != null and !#lists.isEmpty(backgrounds)},
                     singleBackground = ${hasBackgrounds ? backgrounds[0] : null},
                     carousel = ${hasBackgrounds and #lists.size(backgrounds) > 1},
                     singleBgUrl = ${singleBackground != null and singleBackground.url != null ? singleBackground.url : ''},
                     hasBg = ${!#strings.isEmpty(singleBgUrl)},
                     bgInterval = ${heroConfig?.carousel_interval ?: 5000},
                     fullW = ${heroConfig?.full_width == true},
                     overlay = ${heroConfig?.bg_overlay != null and !#strings.isEmpty(heroConfig.bg_overlay) ? heroConfig.bg_overlay : 'medium'},
                     heroH = ${heroConfig?.min_height},
                     heroStyle = ${(hasBg or carousel) ? 'classic' : legacyStyle},
                     heroEyebrow = ${#strings.isEmpty(heroConfig?.eyebrow) ? #messages.msg('home.heroEyebrowDefault') : heroConfig.eyebrow},
                     heroLead = ${#strings.isEmpty(heroConfig?.lead) ? (!#strings.isEmpty(site.subtitle) ? site.subtitle : #messages.msg('home.heroLeadDefault')) : heroConfig.lead},
                     latestPost = ${posts != null and posts.items != null and !#lists.isEmpty(posts.items) ? posts.items[0] : null},
                     memberList = ${heroStyle != 'classic' and pluginFinder.available('PluginMembers') ? memberFinder.listApprovedMembers() : null},
                     memberTotal = ${memberList != null and memberList.items != null and !#lists.isEmpty(memberList.items) ? #aggregates.sum(memberList.items.![members.size()]) : 0},
                     linkGroups = ${heroStyle != 'classic' and pluginFinder.available('PluginLinks') ? linkFinder?.groupBy() : null},
                     linkTotal = ${linkGroups != null and !#lists.isEmpty(linkGroups) ? #aggregates.sum(linkGroups.![links.size()]) : 0},
                     heroClass = ${(hasBg or carousel ? 'has-custom-bg' : '') + ' ' + (fullW ? 'full-width' : '') + ' overlay-' + overlay + (carousel ? ' has-bg-carousel' : '') + (heroStyle == 'classic' ? '' : ' hero-' + heroStyle)},
                     heroStyleAttr = ${heroH != null ? 'min-height:' + heroH + 'px' : ''},
                     heroInterval = ${carousel ? bgInterval : null}"
           th:if="${#strings.startsWith(#strings.defaultString(theme.config.home_hero?.layout, 'p42r'), 'legacy-')}"
           th:classappend="${heroClass}"
           th:style="${heroStyle == 'classic' ? heroStyleAttr : ''}"
           th:data-bg-interval="${heroInterval}">
    <!-- 单背景 -->
    <th:block th:if="${!carousel}">
      <div class="banner-bg"
           th:style="${hasBg ? 'background-image: url(' + singleBgUrl + ')' : ''}"></div>
    </th:block>
    <!-- 多背景轮播 -->
    <th:block th:if="${carousel}">
      <div class="banner-bg-stage" aria-hidden="true">
        <div th:each="bg, bgStat : ${backgrounds}"
             class="banner-bg-slide"
             th:classappend="${bgStat.index == 0} ? 'is-active' : ''"
             th:data-bg-url="${bg.url != null and !#strings.isEmpty(bg.url) ? bg.url : null}"
             th:style="${bgStat.index == 0 and bg.url != null and !#strings.isEmpty(bg.url) ? 'background-image: url(' + bg.url + ')' : ''}"></div>
      </div>
      <!-- 条形指示线 -->
      <div class="banner-bg-indicators" role="tablist" aria-label="背景图轮播指示" th:aria-label="#{home.bannerDots}">
        <button th:each="bg, bgStat : ${backgrounds}"
                type="button"
                class="banner-bg-indicator"
                th:classappend="${bgStat.index == 0} ? 'is-active' : ''"
                th:attr="data-index=${bgStat.index}, aria-label=${bg.caption != null and !#strings.isEmpty(bg.caption) ? bg.caption : (#messages.msg('home.bannerImage') + (bgStat.index + 1))}, role='tab'"
                th:aria-selected="${bgStat.index == 0}"
                th:tabindex="${bgStat.index == 0 ? 0 : -1}"></button>
      </div>
    </th:block>
    <div class="banner-content" th:if="${heroStyle == 'classic'}">
      <div class="banner-logos">
        <div class="banner-logo-item">
          <div class="banner-logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18L19.18 8 12 11.82 4.82 8 12 4.18zM4 9.64l7 3.5V19.5l-7-3.5V9.64zm9 3.5l7 3.5V9.64l-7 3.5v3.5z"/>
            </svg>
          </div>
          <div class="banner-logo-text">
            <strong>NUCMA</strong>
            <span th:text="#{home.heroTitle}">全国高校自媒体联盟</span>
          </div>
        </div>
      </div>
      <h1 class="banner-title" th:text="${site.title}"></h1>
      <p class="banner-subtitle" th:text="${site.subtitle}"></p>
    </div>

    <!-- 首屏：浮标卡 / 杂志栏（沿用页脚 33 案的白卡 + 浅色面板语言） -->
    <div class="hero-shell" th:unless="${heroStyle == 'classic'}">
      <div class="hero-panel">
        <div class="hero-copy">
          <p class="hero-eyebrow">
            <span class="hero-eyebrow-bar" aria-hidden="true"></span>
            <span th:text="${heroEyebrow}">全国高校自媒体联盟 · CAMPUS MEDIA</span>
          </p>
          <h1 class="hero-title" th:text="${site.title}">NUCMA</h1>
          <p class="hero-lead" th:text="${heroLead}">把校园里的创作、记录与连接，放在同一个地方。</p>
          <div class="hero-actions">
            <a class="hero-btn" th:href="@{${#strings.defaultString(site.routes?.archivesUri, '/archives')}}">
              <span th:text="#{home.heroRead}">阅读文章</span><span class="hero-btn-go" aria-hidden="true">→</span>
            </a>
            <a class="hero-btn-ghost" th:href="@{/members}" th:text="#{home.heroMembers}">成员名录</a>
          </div>
          <dl class="hero-stats">
            <div class="hero-stat">
              <dt th:text="#{home.heroPostLabel}">文章</dt>
              <dd><b th:text="${posts != null ? posts.total : 0}">0</b><span th:text="#{home.heroPostUnit}">篇</span></dd>
            </div>
            <div class="hero-stat" th:if="${memberTotal > 0}">
              <dt th:text="#{home.heroMemberLabel}">已认证成员</dt>
              <dd><b th:text="${memberTotal}">0</b><span th:text="#{home.heroMemberUnit}">位</span></dd>
            </div>
            <div class="hero-stat" th:if="${linkTotal > 0}">
              <dt th:text="#{home.heroLinkLabel}">友情链接</dt>
              <dd><b th:text="${linkTotal}">0</b><span th:text="#{home.heroLinkUnit}">个</span></dd>
            </div>
          </dl>
        </div>
        <div class="hero-cards">
          <a class="hero-card hero-card-news" th:if="${latestPost != null}"
             th:href="@{${latestPost.status?.permalink}}">
            <span class="hero-card-k" th:text="#{home.heroLatest}">最新发布</span>
            <strong class="hero-card-t" th:text="${latestPost.spec?.title}">最新一篇文章</strong>
            <span class="hero-card-m" th:text="${#temporals.format(latestPost.spec?.publishTime, dateFmt)}">2026-01-01</span>
            <span class="hero-card-go"><span th:text="#{home.heroReadMore}">阅读全文</span> <i aria-hidden="true">→</i></span>
          </a>
          <a class="hero-card hero-card-members" th:if="${memberList != null and memberList.items != null and !#lists.isEmpty(memberList.items)}"
             th:href="@{/members}">
            <span class="hero-card-k" th:text="#{home.heroMembers}">成员名录</span>
            <span class="hero-avatars">
              <th:block th:each="g, gs : ${memberList.items}" th:if="${gs.index < 2}">
                <th:block th:each="mm, ms : ${g.members}" th:if="${ms.index < 2}">
                  <span class="hero-avatar">
                    <img th:if="${!#strings.isEmpty(mm.spec.avatar)}" th:src="${mm.spec.avatar}" alt="" width="34" height="34" loading="lazy" />
                    <th:block th:unless="${!#strings.isEmpty(mm.spec.avatar)}"
                              th:text="${#strings.isEmpty(mm.spec.displayName) ? 'N' : #strings.substring(mm.spec.displayName, 0, 1)}">N</th:block>
                  </span>
                </th:block>
              </th:block>
            </span>
            <span class="hero-card-m" th:text="${#messages.msg('home.heroMemberCount', memberTotal)}">0 位成员</span>
            <span class="hero-card-go"><span th:text="#{home.heroDirectory}">进入名录</span> <i aria-hidden="true">→</i></span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <div class="home-sections"
       th:with="homeBlocks=${theme.config.home_sections?.section_blocks},
                homeOrder=${homeBlocks != null ? homeBlocks.![type] : null},
                newsBlocks=${homeBlocks != null ? homeBlocks.?[type == 'news'] : null},
                memberBlocks=${homeBlocks != null ? homeBlocks.?[type == 'members'] : null},
                linkBlocks=${homeBlocks != null ? homeBlocks.?[type == 'links'] : null},
                newsBlock=${newsBlocks != null and !#lists.isEmpty(newsBlocks) ? newsBlocks[0] : null},
                memberBlock=${memberBlocks != null and !#lists.isEmpty(memberBlocks) ? memberBlocks[0] : null},
                linkBlock=${linkBlocks != null and !#lists.isEmpty(linkBlocks) ? linkBlocks[0] : null},
                newsCategories=${newsBlock?.category_blocks},
                newsCols=${newsBlock?.columns != null ? #conversions.convert(newsBlock.columns, 'java.lang.Integer') : 3},
                newsRows=${newsBlock?.news_rows != null ? #conversions.convert(newsBlock.news_rows, 'java.lang.Integer') : 0},
                newsLimit=${newsRows > 0 ? newsRows * newsCols : (newsBlock?.news_limit != null ? #conversions.convert(newsBlock.news_limit, 'java.lang.Integer') : 8)},
                newsStyle=${newsBlock?.display_style != null ? newsBlock.display_style : 'grid'},
                newsUseColumns=${newsBlock?.display_style == 'columns' and newsCategories != null and !#lists.isEmpty(newsCategories)},
                newsCard=${#lists.contains({'editorial', 'immersive', 'scrap', 'bento'}, newsBlock?.card_style) ? newsBlock.card_style : 'editorial'},
                newsTitleLines=${#lists.contains({'0', '1', '2', '3'}, newsBlock?.title_lines == null ? '' : #strings.toString(newsBlock.title_lines)) ? #strings.toString(newsBlock.title_lines) : '0'},
                memberLimit=${memberBlock?.member_limit != null ? #conversions.convert(memberBlock.member_limit, 'java.lang.Integer') : 6},
                memberPinned=${memberBlock?.member_pinned},
                linkLimit=${linkBlock?.link_limit != null ? #conversions.convert(linkBlock.link_limit, 'java.lang.Integer') : 8},
                linkPinned=${linkBlock?.link_pinned}"
       th:data-section-order="${homeOrder != null ? #strings.listJoin(homeOrder, ',') : 'news,members,links'}">

  <!-- 信息公告：三种显示样式共用这一个区块，由 home_sections 里的「文章显示样式」决定
       grid    卡片网格（默认）—— 卡片样式 / 每行列数 / 标题行数 只在 grid 下生效
       list    紧凑列表 —— 日期 + 标题，密度最高
       columns 分类分栏 —— 每个自选分类各起一栏，走 category_blocks；换回 grid 不会丢配置 -->
  <section class="section" data-home-section="news"
           th:if="${homeOrder == null or #lists.contains(homeOrder, 'news')}">

    <!-- ① 分类分栏 -->
    <div class="section-container" th:if="${newsUseColumns}">
      <div class="category-cols-wrapper"
           th:classappend="${'category-cols--count-' + #lists.size(newsCategories)}">
        <th:block th:each="col : ${newsCategories}"
                  th:with="catPostList = ${postFinder.list({page: 1, size: col.limit != null ? #conversions.convert(col.limit, 'java.lang.Integer') : 6, categoryName: col.category_name})},
                           catInfo = ${categoryFinder.getByName(col.category_name)}">
          <div class="category-col">
            <div class="section-header-bar category-col-header">
              <h2 class="section-title-bar" th:text="${col.block_title != null and !#strings.isEmpty(col.block_title) ? col.block_title : (catInfo != null ? catInfo.spec?.displayName : #messages.msg('home.categoryPosts'))}"></h2>
              <a th:if="${catInfo != null}" th:href="@{${catInfo.status?.permalink}}" class="btn btn-ghost btn-sm more-link" th:text="#{common.moreMsg}">更多</a>
            </div>
            <div class="news-list" th:if="${catPostList != null and catPostList.items != null and !#lists.isEmpty(catPostList.items)}">
              <a th:each="post : ${catPostList.items}"
                 th:href="@{${post.status?.permalink}}" target="_blank" rel="noopener noreferrer" class="news-item">
                <span class="news-date" th:text="${#temporals.format(post.spec?.publishTime, 'MM-dd')}"></span>
                <span class="news-title" th:text="${post.spec?.title}"></span>
              </a>
            </div>
            <div class="alert alert-soft alert-vertical empty-state category-col-empty" th:if="${catPostList == null or catPostList.items == null or #lists.isEmpty(catPostList.items)}">
              <span th:text="#{common.noPosts}">暂无文章</span>
            </div>
          </div>
        </th:block>
      </div>
    </div>

    <!-- ② 卡片网格 / ③ 紧凑列表
         条数按「默认显示数量」自己取数：首页分页只有一页（默认 10 条），
         直接切 posts.items 会让 11–30 的设置静默失效。 -->
    <th:block th:unless="${newsUseColumns}">
      <th:block th:with="newsItems = ${postFinder.list({page: 1, size: newsLimit})?.items}">
        <div class="section-container" th:if="${newsItems != null and !#lists.isEmpty(newsItems)}">
          <div class="section-header-bar">
            <h2 class="section-title-bar" th:text="#{home.announcements}">信息公告</h2>
            <a th:href="@{${#strings.defaultString(site.routes?.archivesUri, '/archives')}}" class="btn btn-ghost btn-sm more-link" th:text="#{common.moreMsg}">更多</a>
          </div>

          <div class="news-list" th:if="${newsStyle == 'list'}">
            <a th:each="post : ${newsItems}"
               th:href="@{${post.status?.permalink}}" target="_blank" rel="noopener noreferrer" class="news-item">
              <span class="news-date" th:text="${#temporals.format(post.spec?.publishTime, 'MM-dd')}"></span>
              <span class="news-title" th:text="${post.spec?.title}"></span>
            </a>
          </div>

          <!-- title_lines='0'（后台默认「不限」）必须真的不裁：既不能写 --title-lines，也不能挂 clamp。
               旧写法只认 1/2/3，把 0 回退成 2，导致后台选「不限」前台仍截断，状态不一致。 -->
          <div class="article-grid" th:unless="${newsStyle == 'list'}"
               th:style="${newsTitleLines != '0' ? '--title-lines:' + newsTitleLines : null}"
               th:classappend="${'article-grid--' + newsCard + (newsTitleLines != '0' ? ' article-grid--clamp' : '') + ' article-grid--c' + (newsItems == null or #lists.size(newsItems) >= newsCols ? newsCols : (#lists.size(newsItems) < 2 ? 1 : #lists.size(newsItems)))}">
            <article class="article-card" th:each="post : ${newsItems}"
                     th:with="cardAuthor=${post.metadata?.annotations != null and !#strings.isEmpty(post.metadata.annotations['nucma.cn/author']) ? post.metadata.annotations['nucma.cn/author'] : post.owner?.displayName},
                              hasCover=${post.spec?.cover != null and !#strings.isEmpty(post.spec?.cover)},
                              cardCat=${post.spec?.categories != null and !#lists.isEmpty(post.spec.categories) ? categoryFinder.getByName(post.spec.categories[0]) : null}"
                     th:classappend="${hasCover ? '' : ' article-card--note'}">
              <a class="article-link" th:href="@{${post.status?.permalink}}" target="_blank" rel="noopener noreferrer">
                <div class="article-cover" th:if="${hasCover}">
                  <img th:src="${post.spec?.cover}" th:alt="${post.spec?.title}" loading="lazy" decoding="async"
                       sizes="(max-width: 767px) 92vw, (max-width: 1023px) 46vw, 380px" width="380" height="238" />
                  <span class="article-tag" th:if="${cardCat != null}" th:text="${cardCat.spec?.displayName}">分类</span>
                </div>
                <div class="article-cover article-cover--empty" th:unless="${hasCover}" aria-hidden="true"><span>NUCMA</span></div>
                <div class="article-body">
                  <div class="article-meta">
                    <span class="article-cat" th:if="${cardCat != null}" th:text="${cardCat.spec?.displayName}">分类</span>
                    <time class="article-date" th:text="${#temporals.format(post.spec?.publishTime, 'MM-dd')}">11-03</time>
                    <span class="article-pin" th:if="${post.spec?.pinned == true}" th:text="#{home.pinned}">置顶</span>
                  </div>
                  <h3 class="article-title" th:text="${post.spec?.title}">文章标题</h3>
                  <span class="article-author" th:if="${cardAuthor != null and !#strings.isEmpty(cardAuthor)}">
                    <em th:text="#{post.bylinePrefix}">文</em><span th:text="${cardAuthor}">作者</span>
                  </span>
                  <span class="article-more"><span th:text="#{home.heroReadMore}">阅读全文</span><i aria-hidden="true">→</i></span>
                </div>
              </a>
            </article>
          </div>
        </div>
      </th:block>
    </th:block>
  </section>

  <section class="section" data-home-section="members"
           th:if="${(homeOrder == null or #lists.contains(homeOrder, 'members')) and pluginFinder.available('PluginMembers')}">
    <div class="section-container">
      <div class="section-header-bar">
        <h2 class="section-title-bar" th:text="#{home.members}">成员公示</h2>
        <a th:href="@{/members}" class="btn btn-ghost btn-sm more-link" th:text="#{common.moreMsg}">更多</a>
      </div>
      <th:block th:with="groupsResult = ${memberFinder.listApprovedMembers()}">
        <div class="member-grid" th:if="${groupsResult != null and groupsResult.items != null and !#lists.isEmpty(groupsResult.items)}"
             th:attr="data-limit=${memberLimit},
                      data-pinned-ids=${memberPinned == null or #lists.isEmpty(memberPinned) ? '' : #strings.listJoin(memberPinned, ',')}">
          <th:block th:each="group : ${groupsResult.items}">
            <th:block th:each="member : ${group.members}">
              <div class="card card-border member-card" th:attr="data-id=${#strings.defaultString(member.metadata?.name, '')}">
                <span th:if="${member.spec.background != null and !#strings.isEmpty(member.spec.background)}"
                      class="member-card-background" aria-hidden="true"
                      th:style="'background-image: url(' + ${member.spec.background} + ')'"> </span>
                <div class="member-avatar">
                  <img th:if="${member.spec.avatar != null and !#strings.isEmpty(member.spec.avatar)}"
                       th:src="${member.spec.avatar}" th:alt="${member.spec.displayName}" loading="lazy" width="48" height="48" />
                  <svg th:unless="${member.spec.avatar != null and !#strings.isEmpty(member.spec.avatar)}"
                       fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                  </svg>
                </div>
                <div class="member-info">
                  <div class="member-name" th:text="${member.spec.displayName}">名称</div>
                  <div class="member-school" th:if="${member.spec.school != null and !#strings.isEmpty(member.spec.school)}"
                       th:text="${member.spec.school}">学校</div>
                  <div class="member-school member-school-empty" th:unless="${member.spec.school != null and !#strings.isEmpty(member.spec.school)}" th:text="#{members.noBio}">暂无简介</div>
                </div>
              </div>
            </th:block>
          </th:block>
        </div>
      </th:block>
    </div>
  </section>

  <!-- 友情链接 -->
  <section class="section" data-home-section="links"
           th:if="${(homeOrder == null or #lists.contains(homeOrder, 'links')) and pluginFinder.available('PluginLinks')}">
    <div class="section-container">
      <div class="section-header-bar">
        <h2 class="section-title-bar" th:text="#{home.links}">友情链接</h2>
        <a th:href="@{/links}" class="btn btn-ghost btn-sm more-link" th:text="#{common.moreMsg}">更多</a>
      </div>
      <th:block th:with="linkGroups = ${linkFinder?.groupBy()}">
        <div class="link-grid" th:if="${linkGroups != null and !#lists.isEmpty(linkGroups)}"
             th:attr="data-limit=${linkLimit},
                      data-pinned-ids=${linkPinned == null or #lists.isEmpty(linkPinned) ? '' : #strings.listJoin(linkPinned, ',')}">
          <th:block th:each="group : ${linkGroups}">
            <th:block th:each="link : ${group?.links}">
              <a th:href="${link.spec?.url}" target="_blank" rel="noopener noreferrer"
                 class="card card-border link-card" th:title="${link.spec?.description}"
                 th:attr="data-id=${#strings.defaultString(link.metadata?.name, '')}">
                <div class="link-logo">
                  <img th:if="${link.spec?.logo != null and !#strings.isEmpty(link.spec?.logo)}"
                       th:src="${link.spec?.logo}" th:alt="${link.spec?.displayName}" loading="lazy" width="48" height="48" />
                  <span th:unless="${link.spec?.logo != null and !#strings.isEmpty(link.spec?.logo)}"
                        class="link-logo-text"
                        th:text="${link.spec?.displayName != null ? #strings.substring(link.spec?.displayName, 0, 1) : '?'}"></span>
                </div>
                <div class="link-body">
                  <div class="link-name" th:text="${link.spec?.displayName}"></div>
                </div>
              </a>
            </th:block>
          </th:block>
        </div>
        <div th:if="${linkGroups == null or #lists.isEmpty(linkGroups)}" class="alert alert-soft alert-vertical empty-state">
          <div class="empty-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
          </div>
          <p class="empty-text" th:text="#{home.noLinks}">暂无友链</p>
