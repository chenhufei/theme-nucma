          help: 适合展示组织沿革、项目阶段、年度成果或重要节点；添加“发展历程”区块后生效。
          itemLabels:
            - type: text
              label: $value.period
            - type: text
              label: $value.title
          children:
            - $formkit: text
              name: period
              label: 时间或阶段
              value: ''
              placeholder: 如：2024、2023—至今、筹备阶段
              validation: required
            - $formkit: text
              name: title
              label: 节点标题
              value: ''
              placeholder: 如：项目正式启动
              validation: required
            - $formkit: textarea
              name: description
              label: 节点说明（可选）
              value: ''
              rows: 3
              placeholder: 简要说明这一阶段发生的事情或取得的成果
            - $formkit: url
              name: url
              label: 详情链接（可选）
              value: ''
              placeholder: https://example.com/history
        - $formkit: array
          name: service_items
          label: 服务入口列表
          value: []
          addLabel: 添加入口
          emptyText: 暂无服务入口
          help: 适合放置报名、资料下载、办事指南、项目查询和常用系统入口；添加“服务入口”区块后生效。
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.description
          children:
            - $formkit: text
              name: title
              label: 入口名称
              value: ''
              placeholder: 如：活动报名
              validation: required
            - $formkit: textarea
              name: description
              label: 入口说明（可选）
              value: ''
              rows: 2
              placeholder: 说明入口提供的服务或适用对象
            - $formkit: text
              name: badge
              label: 辅助标签（可选）
              value: ''
              placeholder: 如：长期开放、校内访问
            - $formkit: url
              name: url
              label: 入口链接（可选）
              value: ''
              placeholder: https://example.com/service
        - $formkit: array
          name: project_items
          label: 项目展示列表
          value: []
          addLabel: 添加项目
          emptyText: 暂无项目
          help: 展示校园实践、公益行动、研究项目或专题成果；添加“项目展示”区块后生效。
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.status
          children:
            - $formkit: text
              name: title
              label: 项目名称
              value: ''
              placeholder: 如：乡村振兴实践计划
              validation: required
            - $formkit: textarea
              name: description
              label: 项目简介
              value: ''
              rows: 3
              placeholder: 用一两句话说明项目目标、对象或成果
              validation: required
            - $formkit: text
              name: tag
              label: 项目标签（可选）
              value: ''
              placeholder: 如：三下乡、公益、科研
            - $formkit: text
              name: status
              label: 项目状态（可选）
              value: ''
              placeholder: 如：进行中、已结项、长期开放
            - $formkit: attachment
              name: cover
              label: 项目封面（可选）
              value: ''
              accepts:
                - image/*
            - $formkit: url
              name: url
              label: 项目链接（可选）
              value: ''
              placeholder: https://example.com/project
        - $formkit: array
          name: faq_list
          label: 常见问题列表
          addLabel: 添加问题
          value:
            - question: 如何加入成员公示？
              answer: 请在成员公示页面点击右下角悬浮按钮，填写账号名称、邮箱、学校和 QQ 号等信息提交申请，管理员审核通过后即可加入成员公示。
            - question: 如何申请友链？
              answer: 请在友情链接页面点击"申请友链"按钮，填写网址、网站标题、Logo 和描述等信息提交申请，审核通过后将在友链页面展示。
            - question: 网站内容可以转载吗？
              answer: 本站原创内容版权归原作者所有，转载请联系站长获取授权，并注明来源链接。合作媒体请注明出处。
            - question: 如何联系站长？
              answer: 可通过页脚底部的联系方式（如微信公众号、QQ群）与站长取得联系，也可在成员公示页找到相关成员信息。
            - question: 成员公示的显示顺序如何决定？
              answer: 成员公示按照后台成员管理中的分组和列表排序显示，主题不会再单独设置成员优先级。
            - question: 友链显示顺序是怎么决定的？
              answer: 友链的显示顺序由后台设置的「优先级」数值决定，数值越大排序越靠前。同时可在主题设置中勾选固定显示的友链，优先排在最前面。
            - question: 提交友链后多久能审核通过？
              answer: 通常在 1-3 个工作日内完成审核。审核结果将通过您填写的邮箱通知，请留意查收邮件。
            - question: 可以修改已提交的成员或友链信息吗？
              answer: 如需修改已提交的信息，请通过页脚联系方式联系管理员，或在相关页面重新提交申请并备注说明需要更新原有信息。
          emptyText: 暂无常见问题（将不显示该区块）
          help: 添加后将显示在关于页，留空则不显示常见问题区块
          itemLabels:
            - type: text
              label: $value.question
          children:
            - $formkit: text
              name: question
              label: 问题
              placeholder: 如：如何加入成员公示？
              validation: required
            - $formkit: textarea
              name: answer
              label: 回答
              placeholder: 请输入问题的详细回答
              rows: 3
              validation: required
    - group: pages
      label: 成员页与独立页面
      formSchema:
        - $formkit: checkbox
          name: members_overview_enabled
          label: 成员页概览
          value: true
          help: 开启后成员页分组上方显示统计概览、地区分布与省份地图；关闭仅保留分组与成员列表。默认视图见本组「默认显示方式」，连线样式见本组「显示学校关联连线」
        - $formkit: text
          name: members_map_review_number
          label: 地图审图号
          value: ''
          help: 境内公开发布含中国地图的页面需标注审图号，格式如「GS(2024)1234号」。留空则不显示；未取得审图号前建议关闭成员页概览，或改用自然资源部标准地图底图。
        - $formkit: checkbox
          name: members_comment_enabled
          label: 成员页评论区
          value: false
          help: 开启后成员页底部显示评论区；成员页的默认视图见本组「默认显示方式」，连线样式见本组「显示学校关联连线」
        - $formkit: select
          name: globe_default_view
          label: 默认显示方式
          value: grid
          options:
            - label: 网格
              value: grid
            - label: 关系网
              value: network
          help: 访客首次打开成员页时使用的视图；访客手动切换后会记住自己的选择，不再跟随此处设置。
        - $formkit: checkbox
          name: globe_affinity_enabled
          label: 显示学校关联连线
          value: true
          help: 需与插件「学校关联分析」的开关同时打开；任一处关闭都不会发起 AI 分析请求。
        - $formkit: select
          name: globe_affinity_min_strength
          label: 连线显示阈值
          value: '0.35'
          options:
            - label: 全部（可能较密）
              value: '0'
            - label: 中等以上（推荐）
              value: '0.35'
            - label: 仅强关联
              value: '0.7'
          help: 只显示关联强度不低于该值的连线；阈值越高连线越少，画面更干净。线宽与透明度按当前最强关联等比归一，强关联永远最粗。
        - $formkit: checkbox
          name: globe_affinity_show_reason
          label: 显示分析依据
          value: true
          help: 在关系网下方展示参与分析的学校数、分析维度与每条关联的判断理由；鼠标移到连线上也会即时显示该条的判断理由。
        - $formkit: checkbox
          name: page_comment_enabled
          label: 自定义页评论区
          value: true
          help: 开启后自定义页面底部显示评论区
        - $formkit: checkbox
          name: links_comment_enabled
          label: 友链页评论区
          value: false
          help: 开启后友链页底部显示评论区
    - group: system_pages
      label: 系统页面（404 / 登录注册）
      formSchema:
        - $formkit: select
          name: error404_style
          id: error404_style
          key: error404_style
          label: 页面风格
          value: badge
          help: 工牌互动版会加载专用的工牌样式与脚本（仅错误页加载，不进主包）；简洁版是原来的极简 404，不加载任何额外资源。
          options:
            - label: 工牌互动版
              value: badge
            - label: 简洁版
              value: classic
        - $formkit: text
          name: error404_title
          label: 标题
          value: 这一页
          help: 与下一项「标题高亮词」拼成完整标题，例如「这一页」+「不存在」。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-title
        - $formkit: text
          name: error404_title_accent
          label: 标题高亮词
          value: 不存在
          help: 用强调色显示。留空则标题只有前半段。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-title_accent
        - $formkit: text
          name: error404_eyebrow
          label: 状态标签
          value: 页面未找到
          help: 显示在标题上方、404 数字右侧的一行小字。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-eyebrow
        - $formkit: textarea
          name: error404_subtitle
          label: 说明文字
          value: 你访问的地址没有对应的内容。它可能已被移动、改了名字，或者从来就不存在。
          rows: 3
          help: 简洁版也会把这段当作提示文字。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-subtitle
        - $formkit: text
          name: error404_home_text
          label: 主按钮文字
          value: 回到首页
          help: 按钮固定指向站点首页。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-home_text
        - $formkit: checkbox
          name: error404_show_back
          label: 显示「返回上一页」
          value: true
          help: 有关历史就后退，没有历史则回首页。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-show_back
        - $formkit: text
          name: error404_back_text
          label: 「返回上一页」按钮文字
          value: 返回上一页
          if: "$get('error404_style').value !== 'classic'"
          key: e404-back_text
        - $formkit: text
          name: error404_tip_text
          label: 底部提示文字
          value: 认识一个成员，尝试拖拽一下卡片吧！
          help: 点击会随机换一位成员并翻到档案面。留空则不显示这一行。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-tip_text
        - $formkit: checkbox
          name: error404_show_badge
          label: 显示成员工牌
          value: true
          help: 关闭后只保留右侧说明卡片，页面变单栏居中；下面的工牌相关选项随之失效。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-show_badge
        - $formkit: text
          name: error404_badge_label
          label: 工牌英文标识
          value: Members Pass
          help: 工牌正面左上角那行小字。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-badge_label
        - $formkit: select
          name: error404_badge_source
          id: error404_badge_source
          label: 成员来源
          value: plugin
          help: 「成员管理」插件（PluginMembers）只读取后台已审核通过的成员，成员增删、换头像、改分组都无需再来改主题设置。插件未启用或没有已通过成员时，自动回落到下面的手动数据与主题内置快照。
          options:
            - label: 成员管理插件（推荐）
              value: plugin
            - label: 手动数据
              value: manual
          if: "$get('error404_style').value !== 'classic'"
          key: e404-badge_source
        - $formkit: text
          name: error404_badge_groups
          key: error404-badge-groups
          label: 只展示这些分组
          if: "$get('error404_style').value !== 'classic' && $get('error404_badge_source').value === 'plugin'"
          value: ''
          placeholder: 留空展示全部分组
          help: 填后台「成员管理 → 成员分组」里的名称或标识，多个用逗号分隔，例如「重庆地区, 官方成员」。一个都没命中时退回展示全部成员，不会出现空工牌。
        - $formkit: textarea
          name: error404_badge_pick
          key: error404-badge-pick
          label: 指定展示成员
          if: "$get('error404_style').value !== 'classic' && $get('error404_badge_source').value === 'plugin'"
          value: ''
          rows: 4
          placeholder: 每行一个成员名或 QQ 号，留空展示所选分组的全部成员
          help: 名单只做过滤，不改变顺序（同一分组内按后台创建时间倒序）。不在所选分组、或尚未审核通过的成员会被忽略；一个都没命中时退回展示所选分组的全部成员。
        - $formkit: text
          name: error404_badge_member
          label: 固定展示成员
          placeholder: 留空则每次随机
          value: ''
          help: 填成员名称或 QQ 号，只能填一位。匹配不到会自动退回随机，不会白屏。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-badge_member
        - $formkit: checkbox
          name: error404_badge_random
          label: 每次进入随机换人
          value: true
          help: 关闭后固定展示第一位成员；上面填了固定成员时本项不起作用。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-badge_random
        - $formkit: checkbox
          name: error404_badge_flip
          label: 允许点击翻面
          value: true
          help: 关闭后工牌只能拖拽，不会翻到档案面。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-badge_flip
        - $formkit: code
          name: error404_badge_members
          label: 工牌成员数据（手动）
          language: json
          height: 200px
          help: 「成员来源」为「手动数据」时使用这里；选「成员管理插件」但插件没有已通过成员时，也回落到这里兜底。留空使用主题内置快照（5 位成员，含一位测试号）。格式为 JSON 数组，每项支持 name/qq/school/group/url/verified/intro/no 字段；头像由 QQ 号自动取，无需填 avatar。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-badge_members
        - $formkit: checkbox
          name: error404_show_art
          label: 显示插图
          value: true
          help: 说明卡片顶部的插画，默认是拿着放大镜的大黄鸭。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-show_art
        - $formkit: attachment
          name: error404_art
          label: 自定义插图
          value: ''
          accepts:
            - image/*
          help: 建议正方形、透明背景 PNG，显示尺寸约 116×116。留空用主题自带插图。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-art
        - $formkit: select
          name: error404_animation
          label: 入场动画
          value: full
          help: 只在「工牌互动版」生效；系统设置为「减少动态效果」时始终不播。
          options:
            - label: 完整（掉落 + 吊带回弹 + 持续慢晃）
              value: full
            - label: 轻量（掉落，不来回弹）
              value: lite
            - label: 关闭（直接显示）
              value: 'off'
          if: "$get('error404_style').value !== 'classic'"
          key: e404-animation
        - $formkit: color
          name: error404_strap_color
          label: 织带颜色
          value: '#cf3538'
          help: 挂绳织带的主色，高光与暗部由它推导。
          if: "$get('error404_style').value !== 'classic'"
          key: e404-strap_color
        - $formkit: checkbox
          name: auth_polish
          label: 启用登录页美化
          value: true
          help: 开启后登录、注册、退出、密码重置、两步验证等页面统一换成主题的「联盟暖白」外观，样式文件只在这些页面加载，不进主样式包。关闭即回到 Halo 默认样式。注意：若安装了 auth-ui 这类认证页插件并启用了它的设计，插件页面优先于主题，此项不会生效，需要先在插件里停用设计。
    - group: seo
      label: SEO 与分享
      formSchema:
        - $formkit: checkbox
          name: enable_metadata
          label: 输出 canonical 与社交分享标签
          value: true
          help: 关闭后不再输出 canonical、Open Graph 与 Twitter Card；若已由插件提供这些标签，可在此关闭以免重复。
        - $formkit: checkbox
          name: enable_structured_data
          label: 输出页面结构化数据
          value: true
          help: 关闭后不再输出 JSON-LD（schema.org）。站点 title、description、favicon 与 noindex 由 Halo 统一注入，不受此处影响。
