apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-nucma-setting
spec:
  forms:
    - group: appearance
      label: 全局设置
      formSchema:
        - $formkit: select
          name: visual_style
          label: 全站视觉风格
          value: portal
          help: 同时调整首屏构图、标题体系、列表密度、卡片边界、文章排版和页脚结构；自定义主色只覆盖强调色，专题模板仍保留独立风格。
          options:
            - label: 标准门户
              value: portal
            - label: 青年活力
              value: youth
            - label: 清新公益
              value: civic
            - label: 编辑纪实
              value: editorial
        - $formkit: select
          name: default_theme_mode
          label: 默认明暗模式
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: color
          name: primary_color
          label: 自定义主色
          value: "#D13E43"
          help: 保持默认值时跟随所选视觉风格；改为其他颜色后覆盖预设主色。
        - $formkit: checkbox
          name: back_to_top_enabled
          label: 显示返回顶部按钮
          value: true
        - $formkit: select
          name: date_format
          label: 日期格式
          value: YYYY-MM-DD
          options:
            - label: 2024-01-01
              value: YYYY-MM-DD
            - label: 2024年1月1日
              value: YYYY年MM月DD日
            - label: 01/01/2024
              value: MM/DD/YYYY
            - label: 01-01
              value: MM-DD
        - $formkit: checkbox
          name: developer_mode
          label: 开发者诊断模式
          value: false
          help: 仅排查问题时开启；开启后浏览器控制台会输出主题版本、页面模板和基础契约检查结果，不记录用户数据
        - $formkit: code
          name: custom_css
          label: 自定义 CSS
          placeholder: 直接输入 CSS 代码，无需 <style> 标签
          language: css
          height: 240px
        - $formkit: code
          name: custom_js
          label: 自定义 JS
          placeholder: 直接输入 JavaScript 代码，无需 <script> 标签
          language: javascript
          height: 240px
    - group: navigation
      label: 页头设置
      formSchema:
        - $formkit: select
          name: nav_align
          label: 菜单对齐
          value: center
          help: header 内菜单与自定义链接的水平对齐
          options:
            - label: 居中对齐
              value: center
            - label: 左侧对齐
              value: left
            - label: 右侧对齐
              value: right
        - $formkit: checkbox
          name: show_login_btn
          label: 显示登录入口
          value: true
          help: 右上角显示登录按钮，已登录用户显示头像
        - $formkit: menuSelect
          name: header_menu
          label: 顶部菜单
          clearable: true
          help: 选择 Header 顶部导航使用的菜单（从 Halo 后台已创建的菜单中选择），清空则不显示主菜单
        - $formkit: checkbox
          name: search_enabled
          label: 显示搜索入口
          value: true
        - $formkit: checkbox
          name: theme_toggle_enabled
          label: 显示明暗切换按钮
          value: true
        - $formkit: number
          name: carousel_interval
          label: 自定义链接轮播间隔（毫秒）
          value: 3500
          min: 1500
          max: 10000
          step: 500
          help: 当自定义链接超过 1 个时会自动上下滚动轮播，此处设置每个链接在导航栏上的停留显示时间，单位毫秒，默认 3500ms
        - $formkit: array
          name: custom_links
          label: 自定义链接
          value: []
          addLabel: 添加链接
          emptyText: 暂无自定义链接
          help: 在导航菜单右侧显示自定义链接，可选择图片或文字样式
          itemLabels:
            - type: text
              label: $value.text
            - type: image
              label: $value.image
            - type: text
              label: $value.url
          children:
            - $formkit: text
              name: text
              label: 链接文字
              value: ""
              placeholder: 如：加入我们（不填则显示图片或URL）
            - $formkit: text
              name: url
              label: 链接地址
              value: ""
              placeholder: https://
              validation: required
            - $formkit: attachment
              name: image
              label: 链接图片
              value: ""
              accepts: ["image/*"]
              help: 从媒体库选择图片，设置后将显示为图片按钮
            - $formkit: select
              name: target
              label: 打开方式
              value: _blank
              options:
                - label: 新标签页
                  value: _blank
                - label: 当前页
                  value: _self

    - group: home
      label: 首页设置
      formSchema:
        - $formkit: array
          name: bg_carousel
          label: 横幅背景
          value: []
          addLabel: 添加背景图
          emptyText: 留空使用默认背景
          help: 添加 1 张作为单图背景，添加多张自动轮播；建议图片尺寸一致（1920x600 以上）
          itemLabels:
            - type: image
              label: $value.url
            - type: text
              label: $value.caption
          children:
            - $formkit: attachment
              name: url
              label: 背景图片
              value: ""
              accepts: ["image/*"]
              validation: required
            - $formkit: text
              name: caption
              label: 图片说明（可选）
              value: ""
              placeholder: 如：春日校园
        - $formkit: checkbox
          name: show_hero
          label: 显示横幅
          value: true
        - $formkit: number
          name: carousel_interval
          label: 轮播间隔（毫秒）
          value: 5000
          min: 2500
          max: 15000
          step: 500
          help: 每张图停留显示的时间，单位毫秒，默认 5000ms
        - $formkit: select
          name: bg_overlay
          label: 背景遮罩
          value: medium
          help: 自定义背景图片的遮罩强度，影响文字可读性
          options:
            - label: 无遮罩
              value: none
            - label: 轻度
              value: light
            - label: 中度（推荐）
              value: medium
            - label: 重度
              value: dark
        - $formkit: checkbox
          name: full_width
          label: 铺满页面宽度
          value: false
          help: 开启后 Hero 区域顶到页面边缘和 header，不留容器边距
        - $formkit: range
          name: min_height
          label: 横幅高度（像素）
          value: 320
          min: 200
          max: 800
          step: 10
          help: 通过拖动条调节 Hero 区域最小高度（当前值会实时显示在右侧输入框中，默认 320px）

        - $formkit: array
          name: section_blocks
          label: 首页区块排序
          addLabel: 添加首页区块
          emptyText: 暂无首页区块
          value:
            - type: news
              title: 文章内容
              news_limit: 8
              category_blocks: []
            - type: members
              title: 成员公示
              member_limit: 6
              member_pinned: []
            - type: links
              title: 友情链接
              link_limit: 8
              link_pinned: []
          help: 拖动调整首页区块顺序；点击区块可设置其显示数量和内容排序。每种区块建议只添加一次
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 区块类型
              value: news
              validation: required
              options:
                - label: 文章内容
                  value: news
                - label: 成员公示
                  value: members
                - label: 友情链接
                  value: links
            - $formkit: text
              name: title
              label: 列表显示名称
              value: ""
              validation: required
              help: 仅用于后台识别排序项，不改变前台区块标题
            - $formkit: number
              key: home-news-limit
              if: "$value.type === 'news'"
              name: news_limit
              label: 默认显示数量
              value: 8
              min: 1
              max: 30
            - $formkit: array
              key: home-news-categories
              if: "$value.type === 'news'"
              name: category_blocks
              label: 分类栏内容排序（留空显示全部文章）
              value: []
              max: 3
              addLabel: 添加分类栏
              emptyText: 暂无分类栏，将显示全部文章
              help: 拖动调整分类栏顺序；添加 1-3 个分类栏，两项显示两栏，移动端自动改为单栏
              itemLabels:
                - type: text
                  label: $value.block_title
              children:
                - $formkit: categorySelect
                  name: category_name
                  label: 选择分类
                  value: ""
                  autoSelect: false
                  validation: required
                  help: 选择要展示的分类
                - $formkit: text
                  name: block_title
                  label: 区块显示标题
                  value: ""
                  validation: required
                  help: 前台显示的区块标题，如“校园新闻”
                - $formkit: number
                  name: limit
                  label: 显示数量
                  value: 6
                  min: 1
                  max: 30
            - $formkit: select
              key: home-member-limit
              if: "$value.type === 'members'"
              name: member_limit
              label: 显示数量
              value: 6
              options:
                - label: 4 个
                  value: 4
                - label: 6 个
                  value: 6
                - label: 8 个
                  value: 8
                - label: 10 个
                  value: 10
                - label: 12 个
                  value: 12
            - $formkit: select
              key: home-member-pinned
              if: "$value.type === 'members'"
              name: member_pinned
              label: 成员内容排序
              value: []
              multiple: true
              sortable: true
              clearable: true
              searchable: true
              help: 选中项优先展示，可拖动调整顺序；需启用成员插件
              action: /apis/member.plugin.halo.run/v1alpha1/members
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: metadata.name
                iconField: spec.avatar
                descriptionField: spec.school
                fieldSelectorKey: metadata.name
            - $formkit: select
              key: home-link-limit
              if: "$value.type === 'links'"
              name: link_limit
              label: 显示数量
              value: 8
              options:
                - label: 4 个
                  value: 4
                - label: 6 个
                  value: 6
                - label: 8 个
                  value: 8
                - label: 10 个
                  value: 10
                - label: 12 个
                  value: 12
            - $formkit: select
              key: home-link-pinned
              if: "$value.type === 'links'"
              name: link_pinned
              label: 友链内容排序
              value: []
              multiple: true
              sortable: true
              clearable: true
              searchable: true
              help: 选中项优先展示，可拖动调整顺序；需启用官方链接插件
              action: /apis/core.halo.run/v1alpha1/links
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: metadata.name
                iconField: spec.logo
                descriptionField: spec.url
                fieldSelectorKey: metadata.name

    - group: sidebar
      label: 文章页面
      formSchema:
        - $formkit: menuSelect
          name: sidebar_menu
          label: 侧边栏菜单
          clearable: true
          help: 选择文章页侧边栏显示的菜单，清空则不显示
        - $formkit: checkbox
          name: show_views
          label: 显示阅读量
          value: true
        - $formkit: checkbox
          name: show_cover
          label: 显示文章封面
          value: true
        - $formkit: checkbox
          name: show_tags
          label: 显示文章标签
          value: true
        - $formkit: checkbox
          name: auto_toc
          label: 自动生成文章目录
          value: true
          help: 根据文章标题自动提取目录，文章没有标题时自动隐藏
        - $formkit: checkbox
          name: post_comment_enabled
          label: 显示文章评论区
          value: true
          help: 开启后文章页底部显示评论区
        - $formkit: array
          name: section_blocks
          label: 侧边栏区块顺序
          addLabel: 添加侧栏区块
          emptyText: 暂无侧栏区块
          value:
            - type: menu
              title: 快捷导航
            - type: info
              title: 文章信息
            - type: author
              title: 作者信息
            - type: recent
              title: 最近文章
            - type: toc
              title: 文章目录
          help: 拖动调整顺序；列表中存在即显示。支持移除后重新添加，每种区块建议只添加一次
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 区块类型
              value: menu
              validation: required
              options:
                - label: 快捷导航
                  value: menu
                - label: 文章信息
                  value: info
                - label: 作者信息
                  value: author
                - label: 最近文章
                  value: recent
                - label: 文章目录
                  value: toc
            - $formkit: text
              name: title
              label: 列表显示名称
              value: ""
              validation: required
              help: 仅用于后台识别排序项，不改变前台侧栏标题
    - group: about
      label: 关于页面
      formSchema:
        - $formkit: array
          name: about_blocks
          label: 关于页区块排序
          addLabel: 添加区块
          emptyText: 暂无关于页区块
          help: 拖动调整关于页各个区块的显示顺序；列表中未添加的区块不会显示，每种区块建议只添加一次
          value:
            - type: content
              title: 站点介绍
            - type: stats
              title: 数据统计
            - type: latest
              title: 最新内容
            - type: categories
              title: 内容分类
            - type: members
              title: 成员展示
            - type: links
              title: 友情链接
            - type: timeline
              title: 发展历程
            - type: services
              title: 服务入口
            - type: projects
              title: 项目展示
            - type: faq
              title: 常见问题
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 区块类型
              value: stats
              options:
                - label: 站点介绍
                  value: content
                - label: 数据统计
                  value: stats
                - label: 最新文章
                  value: latest
                - label: 内容分类
                  value: categories
                - label: 发展历程
                  value: timeline
                - label: 服务入口
                  value: services
                - label: 项目展示
                  value: projects
                - label: 成员展示
                  value: members
                - label: 友情链接
                  value: links
                - label: 常见问题
                  value: faq
            - $formkit: text
              name: title
              label: 区块标题
              value: ""
              validation: required
              help: 用于前台区块标题，也会显示在折叠列表中
        - $formkit: array
          name: stat_items
          label: 统计项列表
          value: []
          addLabel: 添加统计项
          emptyText: 暂无统计项（将使用默认：文章数、分类数、评论数、成员数）
          help: 自由添加或排序统计项，可选预设类型或自定义数值名称
          itemLabels:
            - type: text
              label: $value.label
            - type: text
              label: $value.type
            - type: text
              label: $value.custom_number
          children:
            - $formkit: select
              name: type
              label: 统计类型
              value: post
              options:
                - label: 发布文章数
                  value: post
                - label: 内容分类数
                  value: category
                - label: 用户评论数
                  value: comment
                - label: 点赞数
                  value: upvote
                - label: 站点访问量
                  value: visit
                - label: 成员数量（需启用成员插件）
                  value: member
                - label: 友情链接数（需启用官方链接插件）
                  value: link
                - label: 自定义数值
                  value: custom
              validation: required
            - $formkit: text
              name: custom_number
              label: 自定义数值
              value: ""
              placeholder: 仅类型为「自定义数值」时生效，如：2018
              help: 当类型选择为自定义数值时，在此填写数字内容
            - $formkit: text
              name: label
              label: 覆盖显示名称（可选）
              value: ""
              placeholder: 留空则使用预设名称，如：成立年份
              help: 可替换预设的名称显示，自定义项建议填写显示名称
            - $formkit: checkbox
              name: enabled
              label: 启用此项
              value: true
              help: 临时隐藏可取消勾选，不必删除条目
        - $formkit: array
          name: timeline_items
          label: 发展历程列表
          value: []
          addLabel: 添加历程
          emptyText: 暂无发展历程
          help: 适合展示组织沿革、项目阶段、年度成果或重要节点；添加“发展历程”区块后生效。
          itemLabels:
            - type: text
              label: $value.period
            - type: text
              label: $value.title
          children:
            - $formkit: text
              name: period
              label: 时间或阶段
              value: ""
              placeholder: 如：2024、2023—至今、筹备阶段
              validation: required
            - $formkit: text
              name: title
              label: 节点标题
              value: ""
              placeholder: 如：项目正式启动
              validation: required
            - $formkit: textarea
              name: description
              label: 节点说明（可选）
              value: ""
              rows: 3
              placeholder: 简要说明这一阶段发生的事情或取得的成果
            - $formkit: url
              name: url
              label: 详情链接（可选）
              value: ""
              placeholder: https://example.com/history
        - $formkit: array
          name: service_items
          label: 服务入口列表
          value: []
          addLabel: 添加入口
          emptyText: 暂无服务入口
          help: 适合放置报名、资料下载、办事指南、项目查询和常用系统入口；添加“服务入口”区块后生效。
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.description
          children:
            - $formkit: text
              name: title
              label: 入口名称
              value: ""
              placeholder: 如：活动报名
              validation: required
            - $formkit: textarea
              name: description
              label: 入口说明（可选）
              value: ""
              rows: 2
              placeholder: 说明入口提供的服务或适用对象
            - $formkit: text
              name: badge
              label: 辅助标签（可选）
              value: ""
              placeholder: 如：长期开放、校内访问
            - $formkit: url
              name: url
              label: 入口链接（可选）
              value: ""
              placeholder: https://example.com/service
        - $formkit: array
          name: project_items
          label: 项目展示列表
          value: []
          addLabel: 添加项目
          emptyText: 暂无项目
          help: 展示校园实践、公益行动、研究项目或专题成果；添加“项目展示”区块后生效。
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.status
          children:
            - $formkit: text
              name: title
              label: 项目名称
              value: ""
              placeholder: 如：乡村振兴实践计划
              validation: required
            - $formkit: textarea
              name: description
              label: 项目简介
              value: ""
              rows: 3
              placeholder: 用一两句话说明项目目标、对象或成果
              validation: required
            - $formkit: text
              name: tag
              label: 项目标签（可选）
              value: ""
              placeholder: 如：三下乡、公益、科研
            - $formkit: text
              name: status
              label: 项目状态（可选）
              value: ""
              placeholder: 如：进行中、已结项、长期开放
            - $formkit: attachment
              name: cover
              label: 项目封面（可选）
              value: ""
              accepts: ["image/*"]
            - $formkit: url
              name: url
              label: 项目链接（可选）
              value: ""
              placeholder: https://example.com/project
        - $formkit: array
          name: faq_list
          label: 常见问题列表
          addLabel: 添加问题
          value:
            - question: 如何加入成员公示？
              answer: 请在成员公示页面点击右下角悬浮按钮，填写账号名称、邮箱、学校和 QQ 号等信息提交申请，管理员审核通过后即可加入成员公示。
            - question: 如何申请友链？
              answer: 请在友情链接页面点击"申请友链"按钮，填写网址、网站标题、Logo 和描述等信息提交申请，审核通过后将在友链页面展示。
            - question: 网站内容可以转载吗？
              answer: 本站原创内容版权归原作者所有，转载请联系站长获取授权，并注明来源链接。合作媒体请注明出处。
            - question: 如何联系站长？
              answer: 可通过页脚底部的联系方式（如微信公众号、QQ群）与站长取得联系，也可在成员公示页找到相关成员信息。
            - question: 成员公示的显示顺序如何决定？
              answer: 成员公示按照后台成员管理中的分组和列表排序显示，主题不会再单独设置成员优先级。
            - question: 友链显示顺序是怎么决定的？
              answer: 友链的显示顺序由后台设置的「优先级」数值决定，数值越大排序越靠前。同时可在主题设置中勾选固定显示的友链，优先排在最前面。
            - question: 提交友链后多久能审核通过？
              answer: 通常在 1-3 个工作日内完成审核。审核结果将通过您填写的邮箱通知，请留意查收邮件。
            - question: 可以修改已提交的成员或友链信息吗？
              answer: 如需修改已提交的信息，请通过页脚联系方式联系管理员，或在相关页面重新提交申请并备注说明需要更新原有信息。
