apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-nucma-setting
spec:
  forms:
    - group: navigation
      label: 导航
      formSchema:
        - $formkit: select
          name: nav_align
          label: 菜单对齐
          value: center
          help: header 内菜单与自定义链接的水平对齐
          options:
            - label: 居中对齐
              value: center
            - label: 左侧对齐
              value: left
            - label: 右侧对齐
              value: right
        - $formkit: menuSelect
          name: header_menu
          label: 顶部菜单
          clearable: true
          help: 选择 Header 顶部导航使用的菜单（从 Halo 后台已创建的菜单中选择），清空则不显示主菜单
        - $formkit: menuSelect
          name: footer_menu
          label: 页脚菜单
          clearable: true
          help: 选择 Footer 页脚快捷导航使用的菜单，清空则不显示
        - $formkit: menuSelect
          name: sidebar_menu
          label: 文章侧边栏菜单
          clearable: true
          help: 选择文章页侧边栏显示的菜单，清空则不显示
        - $formkit: checkbox
          name: show_login_btn
          label: 显示登录入口
          value: true
          help: 右上角显示登录按钮，已登录用户显示头像
    - group: sidebar
      label: 文章侧栏
      formSchema:
        - $formkit: select
          name: section_order
          label: 侧边栏区块顺序
          multiple: true
          sortable: true
          value: [menu, info, author, recent, toc]
          options:
            - label: 快捷导航
              value: menu
            - label: 文章信息
              value: info
            - label: 作者信息
              value: author
            - label: 最近文章
              value: recent
            - label: 文章目录
              value: toc
          help: 拖动或重新选择调整文章页侧边栏区块顺序
        - $formkit: checkbox
          name: show_menu
          label: 显示快捷导航
          value: true
        - $formkit: checkbox
          name: show_info
          label: 显示文章信息
          value: true
        - $formkit: checkbox
          name: show_author
          label: 显示作者信息
          value: true
        - $formkit: checkbox
          name: show_recent
          label: 显示最近文章
          value: true
        - $formkit: checkbox
          name: show_toc
          label: 显示文章目录
          value: true
    - group: carousel
      label: 导航链接
      formSchema:
        - $formkit: number
          name: carousel_interval
          label: 轮播间隔（毫秒）
          value: 3500
          min: 1500
          max: 10000
          step: 500
          help: 当自定义链接超过 1 个时会自动上下滚动轮播，此处设置每个链接在导航栏上的停留显示时间，单位毫秒，默认 3500ms
        - $formkit: array
          name: custom_links
          label: 自定义链接
          value: []
          addLabel: 添加链接
          emptyText: 暂无自定义链接
          help: 在导航菜单右侧显示自定义链接，可选择图片或文字样式
          itemLabels:
            - type: image
              label: $value.image
            - type: text
              label: $value.text
            - type: text
              label: $value.url
          children:
            - $formkit: text
              name: text
              label: 链接文字
              value: ""
              placeholder: 如：加入我们（不填则显示图片或URL）
            - $formkit: text
              name: url
              label: 链接地址
              value: ""
              placeholder: https://
              validation: required
            - $formkit: attachment
              name: image
              label: 链接图片
              value: ""
              accepts: ["image/*"]
              help: 从媒体库选择图片，设置后将显示为图片按钮
            - $formkit: select
              name: target
              label: 打开方式
              value: _blank
              options:
                - label: 新标签页
                  value: _blank
                - label: 当前页
                  value: _self

    - group: appearance
      label: 外观
      formSchema:
        - $formkit: select
          name: default_theme_mode
          label: 默认明暗模式
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: color
          name: primary_color
          label: 主色调
          value: "#D13E43"
        - $formkit: checkbox
          name: back_to_top_enabled
          label: 显示返回顶部按钮
          value: true
    - group: hero
      label: 首页横幅
      formSchema:
        - $formkit: checkbox
          name: show_hero
          label: 显示横幅
          value: true
        - $formkit: attachment
          name: bg_image
          label: 单张背景
          accepts: ["image/*"]
          help: 从媒体库选择一张背景图片。如需轮播多图请使用下方「多背景轮播图」设置，留空使用默认渐变背景。
        - $formkit: array
          name: bg_carousel
          label: 背景轮播
          value: []
          addLabel: 添加背景图
          emptyText: 请先添加至少 2 张轮播图
          help: 添加多张图（超过1张）会自动轮播，底部显示条形指示线，建议尺寸一致（1920x600 以上）。
          itemLabels:
            - type: image
              label: $value.url
            - type: text
              label: $value.caption
          children:
            - $formkit: attachment
              name: url
              label: 背景图片
              value: ""
              accepts: ["image/*"]
              validation: required
            - $formkit: text
              name: caption
              label: 图片说明（可选）
              value: ""
              placeholder: 如：春日校园
        - $formkit: number
          name: carousel_interval
          label: 轮播间隔（毫秒）
          value: 5000
          min: 2500
          max: 15000
          step: 500
          help: 每张图停留显示的时间，单位毫秒，默认 5000ms
        - $formkit: select
          name: bg_overlay
          label: 背景遮罩
          value: medium
          help: 自定义背景图片的遮罩强度，影响文字可读性
          options:
            - label: 无遮罩
              value: none
            - label: 轻度
              value: light
            - label: 中度（推荐）
              value: medium
            - label: 重度
              value: dark
        - $formkit: checkbox
          name: full_width
          label: 铺满页面宽度
          value: false
          help: 开启后 Hero 区域顶到页面边缘和 header，不留容器边距
        - $formkit: range
          name: min_height
          label: 横幅高度（像素）
          value: 320
          min: 200
          max: 800
          step: 10
          help: 通过拖动条调节 Hero 区域最小高度（当前值会实时显示在右侧输入框中，默认 320px）


    - group: home
      label: 首页内容
      formSchema:
        - $formkit: select
          name: section_order
          label: 首页区块顺序
          multiple: true
          sortable: true
          value: [news, categories, members, links]
          options:
            - label: 信息公告
              value: news
            - label: 分类文章
              value: categories
            - label: 成员公示
              value: members
            - label: 友情链接
              value: links
          help: 调整首页主要内容区块的显示顺序
        - $formkit: checkbox
          name: show_news
          label: 显示信息公告
          value: true
        - $formkit: checkbox
          name: show_categories
          label: 显示分类文章区块
          value: true
        - $formkit: checkbox
          name: show_members
          label: 显示成员公示区块
          value: true
        - $formkit: checkbox
          name: show_links
          label: 显示友情链接区块
          value: true
        - $formkit: select
          name: member_limit
          label: 首页成员展示数
          value: 6
          options:
            - label: 4 个
              value: 4
            - label: 6 个
              value: 6
            - label: 8 个
              value: 8
            - label: 10 个
              value: 10
            - label: 12 个
              value: 12
        - $formkit: select
          name: member_pinned
          label: 固定显示的成员（优先）
          multiple: true
          sortable: true
          clearable: true
          searchable: true
          help: 选中的成员将优先排在首页成员列表最前面，不受数量限制影响。需启用 PluginMembers 并已有成员数据。
          action: /apis/member.plugin.halo.run/v1alpha1/members
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
            fieldSelectorKey: metadata.name
        - $formkit: select
          name: link_limit
          label: 首页友链展示数
          value: 8
          options:
            - label: 4 个
              value: 4
            - label: 6 个
              value: 6
            - label: 8 个
              value: 8
            - label: 10 个
              value: 10
            - label: 12 个
              value: 12
        - $formkit: select
          name: link_pinned
          label: 固定显示的友链（优先）
          multiple: true
          sortable: true
          clearable: true
          searchable: true
          help: 选中的友链将优先排在首页友链列表最前面，不受数量限制影响。需启用 PluginLinks 并已有友链数据。
          action: /apis/core.halo.run/v1alpha1/links
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
            fieldSelectorKey: metadata.name

        - $formkit: number
          name: news_limit
          label: 默认公告显示数量
          value: 8
        - $formkit: checkbox
          name: category_columns_enabled
          label: 开启首页自选分类栏
          help: 开启后按下方已选择的分类数量展示等宽栏目，支持 1-3 栏
          value: false
        - $formkit: array
          name: category_blocks
          label: 首页分类栏（最多3栏）
          value: []
          max: 3
          addLabel: 添加分类栏
          help: 每个条目对应首页一栏；选择两个条目时显示两栏，移动端自动改为单栏
          itemLabels:
            - type: text
              label: $value.block_title
            - type: text
              label: $value.category_name
          children:
            - $formkit: categorySelect
              name: category_name
              label: 选择分类
              value: ""
              autoSelect: false
              validation: required
              help: 选择要展示的分类
            - $formkit: text
              name: block_title
              label: 区块显示标题
              value: ""
              help: 前台显示的区块标题，如“校园新闻”
            - $formkit: number
              name: limit
              label: 显示数量
              value: 6
    - group: about
      label: 关于页
      formSchema:
        - $formkit: array
          name: about_blocks
          label: 关于页区块排序
          addLabel: 添加区块
          help: 拖动调整关于页各个区块的显示顺序
          value:
            - type: stats
            - type: faq
          itemLabels:
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 区块类型
              value: stats
              options:
                - label: 数据统计
                  value: stats
                - label: 常见问题
                  value: faq
        - $formkit: array
          name: stat_items
          label: 统计项列表
          value: []
          addLabel: 添加统计项
          emptyText: 暂无统计项（将使用默认：文章数、分类数、评论数、成员数）
          help: 自由添加或排序统计项，可选预设类型或自定义数值名称
          itemLabels:
            - type: text
              label: $value.label
            - type: text
              label: $value.type
            - type: text
              label: $value.custom_number
          children:
            - $formkit: select
              name: type
              label: 统计类型
              value: post
              options:
                - label: 发布文章数
                  value: post
                - label: 内容分类数
                  value: category
                - label: 用户评论数
                  value: comment
                - label: 点赞数
                  value: upvote
                - label: 成员数量（需启用成员插件）
                  value: member
                - label: 自定义数值
                  value: custom
              validation: required
            - $formkit: text
              name: custom_number
              label: 自定义数值
              value: ""
              placeholder: 仅类型为「自定义数值」时生效，如：2018
              help: 当类型选择为自定义数值时，在此填写数字内容
            - $formkit: text
              name: label
              label: 覆盖显示名称（可选）
              value: ""
              placeholder: 留空则使用预设名称，如：成立年份
              help: 可替换预设的名称显示，自定义项建议填写显示名称
            - $formkit: checkbox
              name: enabled
              label: 启用此项
              value: true
              help: 临时隐藏可取消勾选，不必删除条目
        - $formkit: array
          name: faq_list
          label: 常见问题列表
          addLabel: 添加问题
          value:
            - question: 如何加入成员公示？
              answer: 请在成员公示页面点击右下角悬浮按钮，填写账号名称、邮箱、学校和 QQ 号等信息提交申请，管理员审核通过后即可加入成员公示。
            - question: 如何申请友链？
              answer: 请在友情链接页面点击"申请友链"按钮，填写网址、网站标题、Logo 和描述等信息提交申请，审核通过后将在友链页面展示。
            - question: 网站内容可以转载吗？
              answer: 本站原创内容版权归原作者所有，转载请联系站长获取授权，并注明来源链接。合作媒体请注明出处。
            - question: 如何联系站长？
              answer: 可通过页脚底部的联系方式（如微信公众号、QQ群）与站长取得联系，也可在成员公示页找到相关成员信息。
            - question: 成员公示的优先级如何设置？
              answer: 管理员可在 Halo 后台「成员管理」中编辑成员信息，通过设置「优先级」数值来控制排序。数值越大，排序越靠前。
            - question: 友链显示顺序是怎么决定的？
              answer: 友链的显示顺序由后台设置的「优先级」数值决定，数值越大排序越靠前。同时可在主题设置中勾选固定显示的友链，优先排在最前面。
            - question: 提交友链后多久能审核通过？
              answer: 通常在 1-3 个工作日内完成审核。审核结果将通过您填写的邮箱通知，请留意查收邮件。
            - question: 可以修改已提交的成员或友链信息吗？
              answer: 如需修改已提交的信息，请通过页脚联系方式联系管理员，或在相关页面重新提交申请并备注说明需要更新原有信息。
          emptyText: 暂无常见问题（将不显示该区块）
          help: 添加后将显示在关于页，留空则不显示常见问题区块
          itemLabels:
            - type: text
              label: $value.question
          children:
            - $formkit: text
              name: question
              label: 问题
              placeholder: 如：如何加入成员公示？
              validation: required
            - $formkit: textarea
              name: answer
              label: 回答
              placeholder: 请输入问题的详细回答
              rows: 3
              validation: required

    - group: content
      label: 内容与功能
      formSchema:
        - $formkit: select
          name: date_format
          label: 日期格式
          value: YYYY-MM-DD
          options:
            - label: 2024-01-01
              value: YYYY-MM-DD
            - label: 2024年1月1日
              value: YYYY年MM月DD日
            - label: 01/01/2024
              value: MM/DD/YYYY
            - label: 01-01
              value: MM-DD
        - $formkit: checkbox
          name: search_enabled
          label: 启用搜索功能
          value: true
        - $formkit: checkbox
          name: theme_toggle_enabled
          label: 显示主题切换按钮
          value: true
        - $formkit: checkbox
          name: auto_toc
          label: 自动生成文章目录
          value: true
          help: 根据文章标题自动提取目录，文章没有标题时自动隐藏
        - $formkit: checkbox
          name: post_comment_enabled
          label: 文章页评论区
          value: true
          help: 开启后文章页底部显示评论区
        - $formkit: checkbox
          name: page_comment_enabled
          label: 自定义页评论区
          value: true
          help: 开启后自定义页面底部显示评论区
        - $formkit: checkbox
          name: links_comment_enabled
          label: 友链页评论区
          value: false
          help: 开启后友链页底部显示评论区
        - $formkit: checkbox
          name: members_comment_enabled
          label: 成员页评论区
          value: false
          help: 开启后成员页底部显示评论区
        - $formkit: checkbox
          name: developer_mode
          label: 开发者诊断模式
          value: false
          help: 仅排查问题时开启；开启后浏览器控制台会输出主题版本、页面模板和基础契约检查结果，不记录用户数据
        - $formkit: code
          name: custom_css
          label: 自定义 CSS
          placeholder: 直接输入 CSS 代码，无需 <style> 标签
          language: css
          height: 240px
        - $formkit: code
          name: custom_js
          label: 自定义 JS
          placeholder: 直接输入 JavaScript 代码，无需 <script> 标签
          language: javascript
          height: 240px



    - group: footer
      label: 页脚
      formSchema:
        - $formkit: textarea
          name: copyright
          label: 版权信息
          placeholder: 留空使用默认格式（© 年份 站点名称）
          rows: 2
        - $formkit: text
          name: custom_column_title
          label: 自定义栏目标题
          placeholder: 如：关注我们、联系方式
          help: 留空时默认显示"关注我们"
        - $formkit: array
          name: custom_column_items
          label: 自定义栏目内容
          value: []
          addLabel: 添加项目
          emptyText: 暂无内容
          help: 添加图片或文字链接，支持简单的可视化排版
          itemLabels:
            - type: image
              label: $value.image
            - type: text
              label: $value.title
            - type: text
              label: $value.url
          children:
            - $formkit: text
              name: title
              label: 标题/文字
              value: ""
              placeholder: 如：微信公众号
            - $formkit: attachment
              name: image
              label: 图片
              value: ""
              accepts: ["image/*"]
              help: 从媒体库选择图片，如二维码、Logo 等
            - $formkit: text
              name: url
              label: 链接地址
              value: ""
              placeholder: https://（可选，留空则不可点击）
            - $formkit: select
              name: target
              label: 打开方式
              value: _blank
              options:
                - label: 新标签页
                  value: _blank
                - label: 当前页
                  value: _self
        - $formkit: text
          name: icp_number
          label: ICP 备案号
          placeholder: 京ICP备XXXXXXXX号
        - $formkit: text
          name: icp_link
          label: ICP 备案链接
          value: https://beian.miit.gov.cn/
        - $formkit: text
          name: police_number
          label: 公安备案号
          placeholder: 京公网安备XXXXXXXXXXXXXX号
        - $formkit: text
          name: police_record_code
          label: 公安备案验证码
