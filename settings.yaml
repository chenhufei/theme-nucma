        - $formkit: checkbox
          name: links_comment_enabled
          label: 友链页评论区
          value: false
          help: 开启后友链页底部显示评论区
        - $formkit: checkbox
          name: members_comment_enabled
          label: 成员页评论区
          value: false
          help: 开启后成员页底部显示评论区；成员页的默认视图与关系网连线见「成员页与关系网」组
        - $formkit: checkbox
          name: members_overview_enabled
          label: 成员页概览
          value: true
          help: 开启后成员页分组上方显示统计概览、地区分布与省份地图；关闭仅保留分组与成员列表。默认视图与关系网连线见「成员页与关系网」组
        - $formkit: text
          name: members_map_review_number
          label: 地图审图号
          value: ""
          help: 境内公开发布含中国地图的页面需标注审图号，格式如「GS(2024)1234号」。留空则不显示；未取得审图号前建议关闭成员页概览，或改用自然资源部标准地图底图。

    - group: error_page
      label: 404 页面
      formSchema:
        - $formkit: select
          name: error404_style
          label: 页面风格
          value: badge
          help: 工牌互动版会加载专用的工牌样式与脚本（仅错误页加载，不进主包）；简洁版是原来的极简 404，不加载任何额外资源。
          options:
            - label: 工牌互动版
              value: badge
            - label: 简洁版
              value: classic
        - $formkit: text
          name: error404_title
          label: 标题
          value: 这一页
          help: 与下一项「标题高亮词」拼成完整标题，例如「这一页」+「不存在」。
        - $formkit: text
          name: error404_title_accent
          label: 标题高亮词
          value: 不存在
          help: 用强调色显示。留空则标题只有前半段。
        - $formkit: text
          name: error404_eyebrow
          label: 状态标签
          value: 页面未找到
          help: 显示在标题上方、404 数字右侧的一行小字。
        - $formkit: textarea
          name: error404_subtitle
          label: 说明文字
          value: 你访问的地址没有对应的内容。它可能已被移动、改了名字，或者从来就不存在。
          rows: 3
          help: 简洁版也会把这段当作提示文字。
        - $formkit: text
          name: error404_home_text
          label: 主按钮文字
          value: 回到首页
          help: 按钮固定指向站点首页。
        - $formkit: checkbox
          name: error404_show_back
          label: 显示「返回上一页」
          value: true
          help: 有关历史就后退，没有历史则回首页。
        - $formkit: text
          name: error404_back_text
          label: 「返回上一页」按钮文字
          value: 返回上一页
        - $formkit: text
          name: error404_tip_text
          label: 底部提示文字
          value: 认识一个成员，尝试拖拽一下卡片吧！
          help: 点击会随机换一位成员并翻到档案面。留空则不显示这一行。
        - $formkit: checkbox
          name: error404_show_badge
          label: 显示成员工牌
          value: true
          help: 关闭后只保留右侧说明卡片，页面变单栏居中；下面的工牌相关选项随之失效。
        - $formkit: text
          name: error404_badge_label
          label: 工牌英文标识
          value: Members Pass
          help: 工牌正面左上角那行小字。
        - $formkit: select
          name: error404_badge_source
          label: 成员来源
          value: plugin
          help: 「成员管理」插件（PluginMembers）只读取后台已审核通过的成员，成员增删、换头像、改分组都无需再来改主题设置。插件未启用或没有已通过成员时，自动回落到下面的手动数据与主题内置快照。
          options:
            - label: 成员管理插件（推荐）
              value: plugin
            - label: 手动数据
              value: manual
        - $formkit: text
          name: error404_badge_groups
          key: error404-badge-groups
          label: 只展示这些分组
          if: "$get(error404_badge_source).value === 'plugin'"
          value: ""
          placeholder: 留空展示全部分组
          help: 填后台「成员管理 → 成员分组」里的名称或标识，多个用逗号分隔，例如「重庆地区, 官方成员」。一个都没命中时退回展示全部成员，不会出现空工牌。
        - $formkit: textarea
          name: error404_badge_pick
          key: error404-badge-pick
          label: 指定展示成员
          if: "$get(error404_badge_source).value === 'plugin'"
          value: ""
          rows: 4
          placeholder: 每行一个成员名或 QQ 号，留空展示所选分组的全部成员
          help: 名单只做过滤，不改变顺序（同一分组内按后台创建时间倒序）。不在所选分组、或尚未审核通过的成员会被忽略；一个都没命中时退回展示所选分组的全部成员。
        - $formkit: text
          name: error404_badge_member
          label: 固定展示成员
          placeholder: 留空则每次随机
          value: ""
          help: 填成员名称或 QQ 号，只能填一位。匹配不到会自动退回随机，不会白屏。
        - $formkit: checkbox
          name: error404_badge_random
          label: 每次进入随机换人
          value: true
          help: 关闭后固定展示第一位成员；上面填了固定成员时本项不起作用。
        - $formkit: checkbox
          name: error404_badge_flip
          label: 允许点击翻面
          value: true
          help: 关闭后工牌只能拖拽，不会翻到档案面。
        - $formkit: code
          name: error404_badge_members
          label: 工牌成员数据（手动）
          language: json
          height: 200px
          help: 「成员来源」为「手动数据」时使用这里；选「成员管理插件」但插件没有已通过成员时，也回落到这里兜底。留空使用主题内置快照（5 位成员，含一位测试号）。格式为 JSON 数组，每项支持 name/qq/school/group/url/verified/intro/no 字段；头像由 QQ 号自动取，无需填 avatar。
        - $formkit: checkbox
          name: error404_show_art
          label: 显示插图
          value: true
          help: 说明卡片顶部的插画，默认是拿着放大镜的大黄鸭。
        - $formkit: attachment
          name: error404_art
          label: 自定义插图
          value: ""
          accepts: ["image/*"]
          help: 建议正方形、透明背景 PNG，显示尺寸约 116×116。留空用主题自带插图。
        - $formkit: select
          name: error404_animation
          label: 入场动画
          value: full
          help: 只在「工牌互动版」生效；系统设置为「减少动态效果」时始终不播。
          options:
            - label: 完整（掉落 + 吊带回弹 + 持续慢晃）
              value: full
            - label: 轻量（掉落，不来回弹）
              value: lite
            - label: 关闭（直接显示）
              value: off
        - $formkit: color
          name: error404_strap_color
          label: 织带颜色
          value: "#cf3538"
          help: 挂绳织带的主色，高光与暗部由它推导。
    - group: auth_page
      label: 登录注册页
      formSchema:
        - $formkit: checkbox
          name: auth_polish
          label: 启用登录页美化
          value: true
          help: 开启后登录、注册、退出、密码重置、两步验证等页面统一换成主题的「联盟暖白」外观，样式文件只在这些页面加载，不进主样式包。关闭即回到 Halo 默认样式。注意：若安装了 auth-ui 这类认证页插件并启用了它的设计，插件页面优先于主题，此项不会生效，需要先在插件里停用设计。
        - $formkit: select
          name: auth_layout
          label: 版式
          value: split
          help: 分栏在 760px 以下自动折叠成单卡；关闭「显示左侧品牌面板」后分栏等同于居中单卡。
          options:
            - label: 左右分栏（左品牌 + 右表单）
              value: split
            - label: 居中单卡
              value: centered
        - $formkit: color
          name: auth_primary_color
          label: 主色
          value: "#DD3333"
          help: 按钮、链接、输入框聚焦环都跟随这个颜色；暗色模式下自动提亮。
        - $formkit: range
          name: auth_radius
          label: 卡片圆角
          value: 18
          min: 12
          max: 26
          step: 2
          help: 单位 px，12 偏硬朗、26 偏柔和。
        - $formkit: checkbox
          name: auth_story_show
          label: 显示左侧品牌面板
          value: true
          help: 只在「左右分栏」版式下出现；窄屏（760px 以下）自动隐藏，卡片内会补上品牌行。
        - $formkit: textarea
          name: auth_story_quote
          label: 品牌面板标语
          value: "互动宣教\n多元交流"
          rows: 2
          help: 支持多行，一行显示一行。
        - $formkit: textarea
          name: auth_story_note
          label: 品牌面板说明
          value: ""
          rows: 3
          help: 标语下方的一段小字，留空则用站点副标题；窄屏不显示。
        - $formkit: text
          name: auth_story_contact
          label: 品牌面板联系邮箱
          value: support@nucma.cn
          help: 留空则不显示这一行。
        - $formkit: text
          name: auth_site_name
          label: 站名
          value: ""
          help: 留空则用站点名称。
        - $formkit: text
          name: auth_brand_note
          label: 站名下方的英文标识
          value: NUCMA
          help: 留空则不显示。
        - $formkit: attachment
          name: auth_logo
          label: 自定义 Logo
          value: ""
          accepts: ["image/*"]
          help: 建议正方形 PNG。留空用站点 Logo。
        - $formkit: textarea
          name: auth_foot_text
          label: 卡片底部文案
          value: 互动宣教，多元交流
          rows: 2
          help: 表单下方那行小字，留空则整行不显示；宽屏下隐藏（左栏已展示品牌信息），窄屏才会出现。
        - $formkit: text
          name: auth_title_login
          label: 登录页标题
          value: 登录账号
          help: 卡片主标题。浏览器标签页标题是「这个标题 - 站点名」。
        - $formkit: text
          name: auth_title_signup
          label: 注册页标题
          value: 创建账号
        - $formkit: text
          name: auth_title_reset
          label: 找回密码页标题
          value: 找回密码
        - $formkit: text
          name: auth_title_logout
          label: 退出登录页标题
          value: 退出登录
        - $formkit: text
          name: auth_lead_login
          label: 登录页副标题
          value: 欢迎回来，登录后继续。
          help: 登录卡片标题下方的一行小字，留空则不显示。
        - $formkit: text
          name: auth_lead_signup
          label: 注册页副标题
          value: 几秒钟创建一个新账号。
          help: 注册卡片标题下方的一行小字，留空则不显示。
        - $formkit: text
          name: auth_lead_reset
          label: 找回密码页副标题
          value: 输入注册邮箱，我们会发送重置链接。
          help: 找回密码卡片标题下方的一行小字，留空则不显示。
        - $formkit: checkbox
          name: auth_show_switch
          label: 显示登录 / 注册互跳
          value: true
          help: 登录页底部显示「还没有账号？创建账号」，注册页显示「已有账号？前往登录」；退出、密码重置等页面不显示。
        - $formkit: checkbox
          name: auth_show_back
          label: 显示「返回首页」
          value: true
          help: 卡片右上角的胶囊按钮；分栏版左侧品牌面板底部也会出现一个文字链接。
        - $formkit: select
          name: auth_motion
          label: 入场动画
          value: full
          help: 系统开启「减少动态效果」时始终不播。
          options:
            - label: 完整（红块浮出后左右展开）
              value: full
            - label: 轻量（卡片上浮淡入）
              value: lite
            - label: 关闭（直接显示）
              value: off
        - $formkit: checkbox
          name: auth_dark_follow
          label: 跟随站点明暗模式
          value: true
          help: 读取访客在主题里保存的明暗偏好，自动切换认证页配色；关闭则始终使用浅色。
    - group: seo
      label: SEO
      formSchema:
        - $formkit: checkbox
          name: enable_metadata
          label: 输出 canonical 与社交分享标签
          value: true
          help: 关闭后不再输出 canonical、Open Graph 与 Twitter Card；若已由插件提供这些标签，可在此关闭以免重复。
        - $formkit: checkbox
          name: enable_structured_data
          label: 输出页面结构化数据
          value: true
          help: 关闭后不再输出 JSON-LD（schema.org）。站点 title、description、favicon 与 noindex 由 Halo 统一注入，不受此处影响。
