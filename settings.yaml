apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-nucma-setting
spec:
  forms:
    - group: appearance
      label: 外观与版式
      formSchema:
        - $formkit: select
          name: visual_style
          label: 全站视觉风格
          value: portal
          help: 同时调整首屏构图、标题体系、列表密度、卡片边界、文章排版和页脚结构；自定义主色只覆盖强调色，专题模板仍保留独立风格。
          options:
            - label: 标准门户
              value: portal
            - label: 青年活力
              value: youth
            - label: 清新公益
              value: civic
            - label: 编辑纪实
              value: editorial
        - $formkit: select
          name: default_theme_mode
          label: 默认明暗模式
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: color
          name: primary_color
          label: 自定义主色
          value: "#D13E43"
          help: 保持默认值时跟随所选视觉风格；改为其他颜色后覆盖预设主色。
        - $formkit: select
          name: date_format
          label: 日期格式
          value: YYYY-MM-DD
          help: 完整日期（列表页、文章页、标签页、专题页）的显示格式；归档页的年份、列表里的「03-04」紧凑格式与含时间的日期不受影响。留空则按站点语言显示。
          options:
            - label: 2024-01-01
              value: YYYY-MM-DD
            - label: 2024年1月1日
              value: YYYY年MM月DD日
            - label: 01/01/2024
              value: MM/DD/YYYY
            - label: 01-01
              value: MM-DD
        - $formkit: select
          name: site_bg
          label: 全站承接背景
          value: auto
          help: 铺在所有页面最底层。「跟随首屏」时，1/2/6/7/8/9/10/11 号首屏为纯白底；3 校墙封面、4 光斑、5 柔光渐层沿用原纹理并过渡到底色。
          options:
            - label: 跟随首屏版式
              value: auto
            - label: 纸感暖白
              value: paper
            - label: 栏目网格
              value: grid
            - label: 关闭（纯白底）
              value: "off"
        - $formkit: color
          name: site_bg_color
          label: 全站背景底色
          value: "#F8F6F1"
          help: 用于 3/4/5 号首屏和固定纹理模式：首屏底部过渡到这个颜色，滚动时没有接缝；深色模式会压暗。纯白首屏不受此项影响。
        - $formkit: checkbox
          name: developer_mode
          label: 开发者诊断模式
          value: false
          help: 仅排查问题时开启；开启后浏览器控制台会输出主题版本、页面模板和基础契约检查结果，不记录用户数据
        - $formkit: code
          name: custom_css
          label: 自定义 CSS
          placeholder: 直接输入 CSS 代码，无需 <style> 标签
          language: css
          height: 240px
        - $formkit: code
          name: custom_js
          label: 自定义 JS
          placeholder: 直接输入 JavaScript 代码，无需 <script> 标签
          language: javascript
          height: 240px
    - group: home_hero
      label: 首页首屏
      formSchema:
        - $formkit: select
          name: layout
          label: 首屏版式
          value: p42r
          help: 一个开关决定首页顶部长什么样。1–11 号是新版首屏，12–14 号是旧版横幅的三种样式，15 号不显示首屏、直接从内容开始。所有版式共用下方同一组文案、数字与按钮，切换版式不会丢内容。
          options:
            - label: 1 · 图文并置（左文右三块）
              value: p42r
            - label: 2 · 品牌墙（成员跑马灯）
              value: wall
            - label: 3 · 校墙封面（全屏底图）
              value: cover
            - label: 4 · 光斑（居中大字）
              value: aurora
            - label: 5 · 柔光渐层（左下沉降）
              value: p41
            - label: 6 · 双色分栏（右侧杏色竖面）
              value: p46
            - label: 7 · 图文并置（带小字原稿）
              value: p42
            - label: 8 · 层叠卡片（归档台）
              value: cards
            - label: 9 · 环形轨道（成员环绕）
              value: p82
            - label: 10 · 极简大字（NUCMA / 2026）
              value: minimal
            - label: 11 · 红线穿过（一条线串起校墙）
              value: p83
            - label: 12 · 旧版横幅 · 浮标卡
              value: legacy-floaters
            - label: 13 · 旧版横幅 · 杂志栏
              value: legacy-magazine
            - label: 14 · 旧版横幅 · 经典居中
              value: legacy-classic
            - label: 15 · 不显示首屏
              value: none


        - $formkit: text
          name: title_line1
          label: 主标题第一行
          value: 让每一面校园的墙
        - $formkit: text
          name: title_accent
          label: 主标题强调行
          value: 被更多人看见
          help: 显示为第二行并跟随主题主色；留空则只显示第一行。
        - $formkit: text
          name: subtitle
          label: 副标题（短句）
          value: 互动宣教 · 多元交流
        - $formkit: textarea
          name: lead
          label: 首屏简介
          value: 互动宣教，多元交流。104 所高校的栏目、作品与公告，收进同一个入口，一次发布，全站可见。
          rows: 3
        - $formkit: text
          name: eyebrow
          label: 首屏小字
          value: NUCMA / 2026
          help: 在 5 号（柔光渐层）、6 号（双色分栏）、7 号（带小字原稿）、10 号（极简大字）四种版式里显示在标题上方；其余版式忽略此项。
        - $formkit: text
          name: primary_text
          label: 主按钮文字
          value: 浏览全部内容
        - $formkit: text
          name: primary_url
          label: 主按钮链接
          value: /archives
        - $formkit: text
          name: secondary_text
          label: 次按钮文字
          value: 成员单位入口
        - $formkit: text
          name: secondary_url
          label: 次按钮链接
          value: /members

        - $formkit: array
          name: stats
          label: 首屏数字
          addLabel: 添加数字
          emptyText: 暂无数字
          help: 数字、单位、指代含义都可以改。1/2/7 号版式取前 3 个，3/4/9 号取前 4 个，6 号取前 3 个（第 1 个同时作为左侧竖面的主数字），5 号只把第 1 个放进右侧圆环，8/10/11 号不显示数字。
          itemLabels:
            - type: text
              label: $value.value
            - type: text
              label: $value.label
          value:
            - value: "104"
              unit: 所
              label: 成员单位
            - value: "356"
              unit: 篇
              label: 累计作品
            - value: "42"
              unit: 个
              label: 覆盖区县
          children:
            - $formkit: text
              name: value
              label: 数字
              value: "0"
              validation: required
            - $formkit: text
              name: unit
              label: 单位
              value: ""
              placeholder: 所 / 篇 / 个
            - $formkit: text
              name: label
              label: 指代含义
              value: ""
              placeholder: 成员单位
              validation: required

        - $formkit: array
          name: blocks
          label: 图文并置三块
          addLabel: 添加内容块
          emptyText: 暂无内容块
          help: 1 号版式右侧的三块内容：默认是色块，填了图片就换成图片；标题、说明与链接都可改。8 号版式用同样的三块生成层叠卡片，11 号版式取前三块的标题做线上标签。
          itemLabels:
            - type: text
              label: $value.title
            - type: image
              label: $value.image
          value:
            - title: 西南大学 · 酉阳支教队
              meta: 支教手记 · NO.018
              line2: 支教手记：山里的第一课
              color: "#f4c09c"
              image: ""
              url: ""
            - title: 调研 · 非遗手艺
              meta: 田野记录 · 09.12
              line2: 手艺人的年轻人
              color: "#bfd0a8"
              image: ""
              url: ""
            - title: 影像 · 清晨 06:20
              meta: 校园影像 · 06:20
              line2: 清晨的操场
              color: "#b9c4d2"
              image: ""
              url: ""
          children:
            - $formkit: text
              name: title
              label: 标题
              value: ""
              validation: required
            - $formkit: text
              name: meta
              label: 说明 / 角标
              value: ""
              placeholder: 支教手记 · NO.018
            - $formkit: text
              name: line2
              label: 第二行（卡片版式用）
              value: ""
            - $formkit: color
              name: color
              label: 默认色块颜色
              value: "#f4c09c"
            - $formkit: attachment
              name: image
              label: 替换图片（可选）
              value: ""
              accepts: ["image/*"]
              help: 选了图片后这张图会盖住色块，作为该块的背景。
            - $formkit: text
              name: url
              label: 点击链接（可选）
              value: ""
              placeholder: /archives

        - $formkit: attachment
          name: cover_image
          label: 封面底图（3 号版式）
          value: ""
          accepts: ["image/*"]
          help: 留空使用主题默认渐变；建议 1920×1080 以上、横向构图。
        - $formkit: number
          name: member_limit
          label: 每组展示数量（2 号版式）
          value: 3
          min: 1
          max: 12
          help: 未指定成员时，每个成员分组最多展示几位（最多读取 8 个分组）；指定成员时以选择为准。只影响首屏 2 号版式，首页「成员公示」区块的数量在本组下方的「首页区块」里单独设置。
        - $formkit: select
          name: member_pinned
          label: 指定展示的成员
          value: []
          multiple: true
          sortable: true
          clearable: true
          searchable: true
          help: 留空展示全部审核通过的成员；选中后只展示这些成员。需启用成员插件。只影响首屏 2 号版式，首页「成员公示」区块的指定成员在本组下方的「首页区块」里单独设置。
          action: /apis/member.plugin.halo.run/v1alpha1/members
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
            iconField: spec.avatar
            descriptionField: spec.school
            fieldSelectorKey: metadata.name
        - $formkit: text
          name: member_names
          label: 成员跑马灯兜底名单（2 号版式）
          value: 重庆大学,西南大学,西南政法大学,重庆师范大学,重庆邮电大学,四川外国语大学,重庆交通大学,重庆工商大学
          help: 逗号分隔。2 号版式的成员跑马灯在成员插件不可用、或没有审核通过的成员时用它兜底；5 号（文字行）与 9 号（环形标签）始终用它渲染文字，与插件是否可用无关。
        - $formkit: text
          name: footnote
          label: 首屏底部注脚
          value: 重庆 · 秘书处　|　nucma.cn
          help: 仅极简大字版式显示。

        - $formkit: array
          name: bg_carousel
          label: 横幅背景
          value: []
          addLabel: 添加背景图
          emptyText: 留空使用默认背景
          help: 添加 1 张作为单图背景，添加多张自动轮播；建议图片尺寸一致（1920x600 以上）。只在「首屏版式」选 12–14 号（旧版横幅）时生效。
          itemLabels:
            - type: image
              label: $value.url
            - type: text
              label: $value.caption
          children:
            - $formkit: attachment
              name: url
              label: 背景图片
              value: ""
              accepts: ["image/*"]
              validation: required
            - $formkit: text
              name: caption
              label: 图片说明（可选）
              value: ""
              placeholder: 如：春日校园
        - $formkit: number
          name: carousel_interval
          label: 横幅轮播间隔（毫秒）
          value: 5000
          min: 2500
          max: 15000
          step: 500
          help: 每张图停留显示的时间，默认 5000ms。只影响旧版横幅（12–14 号版式），页头「自定义链接」的滚动间隔在「页头」组里单独设置。
        - $formkit: select
          name: bg_overlay
          label: 背景遮罩
          value: medium
          help: 自定义背景图片的遮罩强度，影响文字可读性
          options:
            - label: 无遮罩
              value: none
            - label: 轻度
              value: light
            - label: 中度（推荐）
              value: medium
            - label: 重度
              value: dark
        - $formkit: checkbox
          name: full_width
          label: 铺满页面宽度
          value: false
          help: 开启后 Hero 区域顶到页面边缘和 header，不留容器边距
        - $formkit: range
          name: min_height
          label: 首屏最小高度（像素）
          value: 320
          min: 200
          max: 800
          step: 10
          help: 通过拖动条调节 Hero 区域最小高度（当前值会实时显示在右侧输入框中，默认 320px）

        - $formkit: array
          name: section_blocks
          label: 首页区块排序
          addLabel: 添加首页区块
          emptyText: 暂无首页区块
          value:
            - type: news
              title: 文章内容
              news_limit: 8
              category_blocks: []
            - type: members
              title: 成员公示
              member_limit: 6
              member_pinned: []
            - type: links
              title: 友情链接
              link_limit: 8
              link_pinned: []
          help: 拖动调整首页区块顺序；点击区块可设置其显示数量和内容排序。每种区块建议只添加一次
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 区块类型
              value: news
              validation: required
              options:
                - label: 文章内容
                  value: news
                - label: 成员公示
                  value: members
                - label: 友情链接
                  value: links
            - $formkit: text
              name: title
              label: 列表显示名称
              value: ""
              validation: required
              help: 仅用于后台识别排序项，不改变前台区块标题
            - $formkit: number
              key: home-news-limit
              if: "$value.type === 'news'"
              name: news_limit
              label: 默认显示数量
              value: 8
              min: 1
              max: 30
            - $formkit: array
              key: home-news-categories
              if: "$value.type === 'news'"
              name: category_blocks
              label: 分类栏内容排序（留空显示全部文章）
              value: []
              max: 3
              addLabel: 添加分类栏
              emptyText: 暂无分类栏，将显示全部文章
              help: 拖动调整分类栏顺序；添加 1-3 个分类栏，两项显示两栏，移动端自动改为单栏
              itemLabels:
                - type: text
                  label: $value.block_title
              children:
                - $formkit: categorySelect
                  name: category_name
                  label: 选择分类
                  value: ""
                  autoSelect: false
                  validation: required
                  help: 选择要展示的分类
                - $formkit: text
                  name: block_title
                  label: 区块显示标题
                  value: ""
                  validation: required
                  help: 前台显示的区块标题，如“校园新闻”
                - $formkit: number
                  name: limit
                  label: 显示数量
                  value: 6
                  min: 1
                  max: 30
            - $formkit: select
              key: home-member-limit
              if: "$value.type === 'members'"
              name: member_limit
              label: 显示数量
              value: 6
              options:
                - label: 4 个
                  value: 4
                - label: 6 个
                  value: 6
                - label: 8 个
                  value: 8
                - label: 10 个
                  value: 10
                - label: 12 个
                  value: 12
            - $formkit: select
              key: home-member-pinned
              if: "$value.type === 'members'"
              name: member_pinned
              label: 成员内容排序
              value: []
              multiple: true
              sortable: true
              clearable: true
              searchable: true
              help: 选中项优先展示，可拖动调整顺序；需启用成员插件
              action: /apis/member.plugin.halo.run/v1alpha1/members
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: metadata.name
                iconField: spec.avatar
                descriptionField: spec.school
                fieldSelectorKey: metadata.name
            - $formkit: select
              key: home-link-limit
              if: "$value.type === 'links'"
              name: link_limit
              label: 显示数量
              value: 8
              options:
                - label: 4 个
                  value: 4
                - label: 6 个
                  value: 6
                - label: 8 个
                  value: 8
                - label: 10 个
                  value: 10
                - label: 12 个
                  value: 12
            - $formkit: select
              key: home-link-pinned
              if: "$value.type === 'links'"
              name: link_pinned
              label: 友链内容排序
              value: []
              multiple: true
              sortable: true
              clearable: true
              searchable: true
              help: 选中项优先展示，可拖动调整顺序；需启用官方链接插件
              action: /apis/core.halo.run/v1alpha1/links
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: metadata.name
                iconField: spec.logo
                descriptionField: spec.url
                fieldSelectorKey: metadata.name

    - group: navigation
      label: 页头
      formSchema:
        - $formkit: select
          name: logo_mode
          label: 页头 Logo
          value: mark
          help: 全站统一生效，首页首屏自带的页头与内页页头读同一份配置。默认使用主题红色标记；可换成媒体库图片，也可以完全去掉标记只留站名。
          options:
            - label: 默认标记
              value: mark
            - label: 自定义图片
              value: image
            - label: 不显示 Logo
              value: none
        - $formkit: attachment
          name: logo_image
          label: 自定义 Logo 图片
          value: ""
          accepts: ["image/*"]
          help: 仅在「页头 Logo」选择「自定义图片」时生效，建议使用透明底 PNG/SVG。
        - $formkit: text
          name: brand_name
          label: 站名
          value: 全国高校自媒体联盟
          help: 留空则使用站点标题。
        - $formkit: text
          name: brand_en
          label: 站名英文缩写
          value: NUCMA
          help: 显示在站名右侧，同时用作默认标记的字母。
        - $formkit: text
          name: header_cta_text
          label: 页头按钮文字
          value: 加入联盟
          help: 留空则不显示页头按钮。
        - $formkit: text
          name: header_cta_url
          label: 页头按钮链接
          value: /members
        - $formkit: select
          name: nav_align
          label: 菜单对齐
          value: center
          help: 页头内菜单与自定义链接的水平对齐。本组对所有页面生效，首页首屏自带的页头也读这里的设置。
          options:
            - label: 居中对齐
              value: center
            - label: 左侧对齐
              value: left
            - label: 右侧对齐
              value: right
        - $formkit: checkbox
          name: show_login_btn
          label: 显示登录入口
          value: true
          help: 右上角显示登录按钮，已登录用户显示头像
        - $formkit: menuSelect
          name: header_menu
          label: 顶部菜单
          clearable: true
          help: 选择 Header 顶部导航使用的菜单（从 Halo 后台已创建的菜单中选择），清空则不显示主菜单
        - $formkit: checkbox
          name: search_enabled
          label: 显示搜索入口
          value: true
        - $formkit: checkbox
          name: theme_toggle_enabled
          label: 显示明暗切换按钮
          value: true
        - $formkit: number
          name: carousel_interval
          label: 链接轮播间隔（页头，毫秒）
          value: 3500
          min: 1500
          max: 10000
          step: 500
