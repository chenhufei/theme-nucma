apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-nucma-setting
spec:
  forms:
    - group: appearance
      label: 全站外观
      formSchema:
        - $formkit: select
          name: default_theme_mode
          label: 默认明暗模式
          value: system
          options:
            - label: 跟随系统
              value: system
            - label: 浅色
              value: light
            - label: 深色
              value: dark
        - $formkit: color
          name: primary_color
          label: 自定义主色
          value: '#D13E43'
          help: 默认 #D13E43 为品牌主色；改为其他颜色会覆盖全站强调色。
        - $formkit: select
          name: date_format
          label: 日期格式
          value: YYYY-MM-DD
          help: 完整日期（列表页、文章页、标签页、专题页）的显示格式；归档页的年份、列表里的「03-04」紧凑格式与含时间的日期不受影响。留空则按站点语言显示。
          options:
            - label: '2024-01-01'
              value: YYYY-MM-DD
            - label: 2024年1月1日
              value: YYYY年MM月DD日
            - label: 01/01/2024
              value: MM/DD/YYYY
            - label: 01-01
              value: MM-DD
        - $formkit: select
          name: site_bg
          label: 全站承接背景
          value: "off"
          help: 铺在所有页面最底层，默认整站纯白。切「跟随首屏」时，1/2/6/7/8/9/10/11 号首屏为纯白底；3 校墙封面、4 光斑、5 柔光渐层沿用原纹理并过渡到底色。
          options:
            - label: 跟随首屏版式
              value: auto
            - label: 纸感暖白
              value: paper
            - label: 栏目网格
              value: grid
            - label: 关闭（纯白底）
              value: 'off'
        - $formkit: color
          name: site_bg_color
          label: 全站背景底色
          value: '#FFFFFF'
          help: 用于 3/4/5 号首屏和固定纹理模式：首屏底部过渡到这个颜色，滚动时没有接缝；深色模式会压暗。纯白首屏不受此项影响。
        - $formkit: checkbox
          name: developer_mode
          label: 高级 · 开发者诊断模式
          value: false
          help: 仅排查问题时开启；开启后浏览器控制台会输出主题版本、页面模板和基础契约检查结果，不记录用户数据
        - $formkit: code
          name: custom_css
          label: 高级 · 自定义 CSS
          placeholder: 直接输入 CSS 代码，无需 <style> 标签
          language: css
          height: 240px
        - $formkit: code
          name: custom_js
          label: 自定义 JS
          placeholder: 直接输入 JavaScript 代码，无需 <script> 标签
          language: javascript
          height: 240px

    - group: home_hero
      label: 首页首屏
      formSchema:
        - $formkit: select
          name: layout
          id: layout
          key: layout
          label: 首屏版式
          value: p42r
          help: 一个开关决定首页顶部长什么样。1–11 号是新版首屏，12–14 号是旧版横幅的三种样式，15 号不显示首屏、直接从内容开始。所有版式共用同一组文案、数字与按钮，切换版式不会丢内容；下面的选项只显示当前版式会用到的那几项。
          options:
            - label: 1 · 图文并置（左文右三块）
              value: p42r
            - label: 2 · 品牌墙（成员跑马灯）
              value: wall
            - label: 3 · 校墙封面（全屏底图）
              value: cover
            - label: 4 · 光斑（居中大字）
              value: aurora
            - label: 5 · 柔光渐层（左下沉降）
              value: p41
            - label: 6 · 双色分栏（右侧杏色竖面）
              value: p46
            - label: 7 · 图文并置（带小字原稿）
              value: p42
            - label: 8 · 层叠卡片（归档台）
              value: cards
            - label: 9 · 环形轨道（成员环绕）
              value: p82
            - label: 10 · 极简大字（NUCMA / 2026）
              value: minimal
            - label: 11 · 红线穿过（一条线串起校墙）
              value: p83
            - label: 12 · 旧版横幅 · 浮标卡
              value: legacy-floaters
            - label: 13 · 旧版横幅 · 杂志栏
              value: legacy-magazine
            - label: 14 · 旧版横幅 · 经典居中
              value: legacy-classic
            - label: 15 · 不显示首屏
              value: none
        - $formkit: text
          name: title_line1
          label: 主标题第一行
          value: 让每一面校园的墙
          if: "$get('layout').value !== 'none'"
          key: hero-title_line1
        - $formkit: text
          name: title_accent
          label: 主标题强调行
          value: 被更多人看见
          help: 显示为第二行并跟随主题主色；留空则只显示第一行。
          if: "$get('layout').value !== 'none'"
          key: hero-title_accent
        - $formkit: text
          name: subtitle
          label: 副标题（仅 2 / 3 / 6 号版式）
          value: 互动宣教 · 多元交流
          help: 2 号显示在标题下方，3 号作为封面副标题，6 号竖排在右侧杏色面上。
          if: $get('layout').value === 'wall' || $get('layout').value === 'cover' || $get('layout').value === 'p46'
          key: hero-subtitle
        - $formkit: textarea
          name: lead
          label: 首屏简介（3 号版式除外）
          value: 互动宣教，多元交流。104 所高校的栏目、作品与公告，收进同一个入口，一次发布，全站可见。
          rows: 3
          if: $get('layout').value !== 'cover' && $get('layout').value !== 'none'
          key: hero-lead
        - $formkit: text
          name: eyebrow
          label: 首屏小字（仅 5 / 6 / 7 / 10 号版式）
          value: NUCMA / 2026
          help: 在 5 号（柔光渐层）、6 号（双色分栏）、7 号（带小字原稿）、10 号（极简大字）四种版式里显示在标题上方；其余版式忽略此项。
          if: $get('layout').value === 'p42' || $get('layout').value === 'p41' || $get('layout').value === 'p46' || $get('layout').value === 'minimal'
          key: hero-eyebrow
        - $formkit: text
          name: primary_text
          label: 主按钮文字
          value: 浏览全部内容
          if: "$get('layout').value !== 'none'"
          key: hero-primary_text
        - $formkit: text
          name: primary_url
          label: 主按钮链接
          value: /archives
          if: "$get('layout').value !== 'none'"
          key: hero-primary_url
        - $formkit: text
          name: secondary_text
          label: 次按钮文字
          value: 成员单位入口
          if: "$get('layout').value !== 'none'"
          key: hero-secondary_text
        - $formkit: text
          name: secondary_url
          label: 次按钮链接
          value: /members
          if: "$get('layout').value !== 'none'"
          key: hero-secondary_url
        - $formkit: array
          name: stats
          label: 首屏数字（8 / 10 / 11 号版式不显示）
          addLabel: 添加数字
          emptyText: 暂无数字
          help: 数字、单位、指代含义都可以改。1/2/7 号版式取前 3 个，3/4/9 号取前 4 个，6 号取前 3 个（第 1 个同时作为左侧竖面的主数字），5 号只把第 1 个放进右侧圆环，8/10/11 号不显示数字。
          itemLabels:
            - type: text
              label: $value.value
            - type: text
              label: $value.label
          value:
            - value: '104'
              unit: 所
              label: 成员单位
            - value: '356'
              unit: 篇
              label: 累计作品
            - value: '42'
              unit: 个
              label: 覆盖区县
          children:
            - $formkit: text
              name: value
              label: 数字
              value: '0'
              validation: required
            - $formkit: text
              name: unit
              label: 单位
              value: ''
              placeholder: 所 / 篇 / 个
            - $formkit: text
              name: label
              label: 指代含义
              value: ''
              placeholder: 成员单位
              validation: required
          if: $get('layout').value !== 'cards' && $get('layout').value !== 'minimal' && $get('layout').value !== 'p83' && $get('layout').value !== 'none' && $get('layout').value !== 'none'
          key: hero-stats
        - $formkit: array
          name: blocks
          label: 首屏三块内容（1 / 7 / 8 / 11 号版式）
          addLabel: 添加内容块
          emptyText: 暂无内容块
          help: 1 号版式是右侧三块并置，8 号版式生成三张层叠卡片，11 号版式取前三块标题做红线上的标签。每块可以关联一篇文章、一个分类（专栏），或手填链接；三块都点得动。
          itemLabels:
            - type: text
              label: $value.title
            - type: image
              label: $value.image
          value:
            - title: 西南大学 · 酉阳支教队
              meta: 支教手记 · NO.018
              line2: 支教手记：山里的第一课
              color: '#f4c09c'
              image: ''
              url: ''
              post: ''
              category: ''
            - title: 调研 · 非遗手艺
              meta: 田野记录 · 09.12
              line2: 手艺人的年轻人
              color: '#bfd0a8'
              image: ''
              url: ''
              post: ''
              category: ''
            - title: 影像 · 清晨 06:20
              meta: 校园影像 · 06:20
              line2: 清晨的操场
              color: '#b9c4d2'
              image: ''
              url: ''
              post: ''
              category: ''
          children:
            - $formkit: text
              name: title
              label: 标题
              value: ''
              validation: required
            - $formkit: text
              name: meta
              label: 说明 / 角标
              value: ''
              placeholder: 支教手记 · NO.018
            - $formkit: text
              name: line2
              label: 第二行（卡片版式用）
              value: ''
            - $formkit: color
              name: color
              label: 默认色块颜色
              value: '#f4c09c'
            - $formkit: attachment
              name: image
              label: 替换图片（可选）
              value: ''
              accepts:
                - image/*
              help: 选了图片后这张图会盖住色块，作为该块的背景。
            - $formkit: select
              name: post
              label: 关联文章（可选）
              value: ''
              clearable: true
              searchable: true
              placeholder: 输入文章标题搜索已发布的文章
              help: 选中后这一块点击就跳到那篇文章。
              action: /apis/api.content.halo.run/v1alpha1/posts
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.title
                valueField: status.permalink
                descriptionField: spec.publishTime
            - $formkit: select
              name: category
              label: 关联分类 / 专栏（可选）
              value: ''
              clearable: true
              searchable: true
              placeholder: 输入分类名搜索
              help: 选中后这一块点击就跳到该分类的归档页，适合把三块做成「专栏入口」。
              action: /apis/api.content.halo.run/v1alpha1/categories
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: status.permalink
                descriptionField: spec.description
            - $formkit: text
              name: url
              label: 手填链接（兜底）
              value: ''
              placeholder: /archives
              help: 上面两个选取器都没选时才用它。站内路径从 / 开始，例如 /archives；也可以填完整外链。
          if: $get('layout').value === 'p42r' || $get('layout').value === 'p42' || $get('layout').value === 'cards' || $get('layout').value === 'p83'
          key: hero-blocks
        - $formkit: attachment
          name: cover_image
          label: 封面底图（3 / 6 号版式）
          value: ''
          accepts:
            - image/*
          help: 3 号版式作为整屏底图，6 号版式在没有填图片的三块内容时作为右侧竖面底图。留空使用主题默认渐变；建议 1920×1080 以上、横向构图。
          if: "$get('layout').value === 'cover' || $get('layout').value === 'p46'"
          key: hero-cover_image
        - $formkit: number
          name: member_limit
          label: 每组展示数量（2 号版式）
          value: 3
          min: 1
          max: 12
          help: 未指定成员时，每个成员分组最多展示几位（最多读取 8 个分组）；指定成员时以选择为准。只影响首屏 2 号版式，首页「成员公示」区块的数量在本组下方的「首页区块」里单独设置。
          if: $get('layout').value === 'wall'
          key: hero-member_limit
        - $formkit: select
          name: member_pinned
          label: 指定展示的成员（2 号版式）
          value: []
          multiple: true
          sortable: true
          clearable: true
          searchable: true
          help: 留空展示全部审核通过的成员；选中后只展示这些成员。需启用成员插件。只影响首屏 2 号版式，首页「成员公示」区块的指定成员在本组下方的「首页区块」里单独设置。
          action: /apis/member.plugin.halo.run/v1alpha1/members
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
            iconField: spec.avatar
            descriptionField: spec.school
            fieldSelectorKey: metadata.name
          if: $get('layout').value === 'wall'
          key: hero-member_pinned
        - $formkit: text
          name: member_names
          label: 成员名单兜底（2 / 5 / 9 号版式）
          value: 重庆大学,西南大学,西南政法大学,重庆师范大学,重庆邮电大学,四川外国语大学,重庆交通大学,重庆工商大学
          help: 逗号分隔。2 号版式的成员跑马灯在成员插件不可用、或没有审核通过的成员时用它兜底；5 号（文字行）与 9 号（环形标签）始终用它渲染文字，与插件是否可用无关。
          if: $get('layout').value === 'wall' || $get('layout').value === 'p41' || $get('layout').value === 'p82'
          key: hero-member_names
        - $formkit: text
          name: footnote
          label: 底部注脚（仅 10 号版式）
          value: 重庆 · 秘书处　|　nucma.cn
          help: 仅极简大字版式显示。
          if: "$get('layout').value === 'minimal'"
          key: hero-footnote
        - $formkit: array
          name: bg_carousel
          label: 横幅背景图
          value: []
          addLabel: 添加背景图
          emptyText: 留空使用默认背景
          help: 只在「首屏版式」选 12–14 号（旧版横幅）时生效：添加 1 张作为单图背景，添加多张自动轮播；建议图片尺寸一致（1920×600 以上）。
          itemLabels:
            - type: image
              label: $value.url
            - type: text
              label: $value.caption
          children:
            - $formkit: attachment
              name: url
              label: 背景图片
              value: ''
              accepts:
                - image/*
              validation: required
            - $formkit: text
              name: caption
              label: 图片说明（可选）
              value: ''
              placeholder: 如：春日校园
          if: $get('layout').value === 'legacy-floaters' || $get('layout').value === 'legacy-magazine' || $get('layout').value === 'legacy-classic'
          key: hero-bg_carousel
        - $formkit: number
          name: carousel_interval
          label: 横幅轮播间隔（毫秒）
          value: 5000
          min: 2500
          max: 15000
          step: 500
          help: 每张图停留显示的时间，默认 5000ms。只影响旧版横幅（12–14 号版式），页头「自定义链接」的滚动间隔在「页头与导航」组里单独设置。
          if: $get('layout').value === 'legacy-floaters' || $get('layout').value === 'legacy-magazine' || $get('layout').value === 'legacy-classic'
          key: hero-carousel_interval
        - $formkit: select
          name: bg_overlay
          label: 横幅背景遮罩
          value: medium
          help: 自定义背景图片的遮罩强度，影响文字可读性
          options:
            - label: 无遮罩
              value: none
            - label: 轻度
              value: light
            - label: 中度（推荐）
              value: medium
            - label: 重度
              value: dark
          if: $get('layout').value === 'legacy-floaters' || $get('layout').value === 'legacy-magazine' || $get('layout').value === 'legacy-classic'
          key: hero-bg_overlay
        - $formkit: checkbox
          name: full_width
          label: 铺满页面宽度
          value: false
          help: 开启后 Hero 区域顶到页面边缘和 header，不留容器边距
          if: $get('layout').value === 'legacy-floaters' || $get('layout').value === 'legacy-magazine' || $get('layout').value === 'legacy-classic'
          key: hero-full_width
        - $formkit: range
          name: min_height
          label: 首屏最小高度（像素）
          value: 320
          min: 200
          max: 800
          step: 10
          help: 通过拖动条调节 Hero 区域最小高度（当前值会实时显示在右侧输入框中，默认 320px）
          if: $get('layout').value === 'legacy-floaters' || $get('layout').value === 'legacy-magazine' || $get('layout').value === 'legacy-classic'
          key: hero-min_height
    - group: home_sections
      label: 首页区块
      formSchema:
        - $formkit: array
          name: section_blocks
          label: 首页区块排序
          addLabel: 添加首页区块
          emptyText: 暂无首页区块
          value:
            - type: news
              title: 文章内容
              news_limit: 8
              news_rows: 0
              display_style: grid
              card_style: editorial
              title_lines: '0'
              columns: 3
              category_blocks: []
            - type: members
              title: 成员公示
              member_limit: 6
              member_pinned: []
            - type: links
              title: 友情链接
              link_limit: 8
              link_pinned: []
          help: 首屏之下的区块顺序与内容。拖动调整顺序，点开某个区块设置它的数量与展示方式；每种区块建议只添加一次。
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 区块类型
              value: news
              validation: required
              options:
                - label: 文章内容
                  value: news
                - label: 成员公示
                  value: members
                - label: 友情链接
                  value: links
            - $formkit: text
              name: title
              label: 列表显示名称
              value: ''
              validation: required
              help: 仅用于后台识别排序项，不改变前台区块标题
            - $formkit: number
              key: home-news-limit
              if: $value.type === 'news' && $value.display_style !== 'columns'
              name: news_limit
              label: 默认显示数量
              value: 8
              min: 1
              max: 30
            - $formkit: number
              key: home-news-rows
              if: $value.type === 'news' && $value.display_style === 'grid'
              name: news_rows
              label: 显示行数
              value: 0
              min: 0
              max: 6
              help: 填几就铺几横排，实际条数 = 行数 × 每行列数（例如 3 行 × 3 列 = 9 篇），填了就覆盖上面的「默认显示数量」；填 0 表示不按行数控制
            - $formkit: select
              key: home-news-style
              if: $value.type === 'news'
              name: display_style
              label: 文章显示样式
              value: grid
              options:
                - label: 卡片网格（封面 + 标题 + 作者 + 阅读全文）
                  value: grid
                - label: 紧凑列表（日期 + 标题）
                  value: list
                - label: 分类分栏（按分类各起一栏）
                  value: columns
              help: 卡片网格是默认样式，可按下方「卡片样式 / 每行列数 / 标题行数」细调；紧凑列表只显示日期与标题；分类分栏需要先在「分类栏内容」里加上 1–3 个分类。
            - $formkit: select
              key: home-news-card-style
              if: $value.display_style === 'grid'
              name: card_style
              label: 卡片样式
              value: editorial
              options:
                - label: 编辑部卡片（盒式 + 分类标签 + 圆形箭头）
                  value: editorial
                - label: 大图叠字（4:3 沉浸封面压白字）
                  value: immersive
                - label: 剪贴簿（纸片卡 + 微斜拍立得 + 红胶带）
                  value: scrap
                - label: 便当格（等格铺满 + 底部叠字，无封面用浅色水印格）
                  value: bento
              help: 仅「卡片网格」生效；紧凑列表不受影响
            - $formkit: select
              key: home-news-title-lines
              if: $value.display_style === 'grid'
              name: title_lines
              label: 标题最多行数
              value: '0'
              options:
                - label: 不限（写满一行再换行）
                  value: '0'
                - label: 1 行
                  value: '1'
                - label: 2 行
                  value: '2'
                - label: 3 行
                  value: '3'
              help: 仅「卡片网格」生效；选具体行数后超出部分裁掉并以省略号结尾，选「不限」则标题完整换行显示
            - $formkit: select
              key: home-news-columns
              if: $value.type === 'news' && $value.display_style === 'grid'
              name: columns
              label: 每行列数
              value: 3
              options:
                - label: 2 列
                  value: 2
                - label: 3 列
                  value: 3
                - label: 4 列
                  value: 4
              help: 只驱动「卡片网格」的列数（行数非 0 时还参与取数：显示行数 × 每行列数）。「分类分栏」的列数由「分类栏内容」的条目数决定，最多 3 栏，不会读这里；紧凑列表不铺卡片，也不读这里。平板自动降为 2 列、手机单列。
            - $formkit: array
              key: home-news-categories
              if: $value.display_style === 'columns'
              name: category_blocks
              label: 分类栏内容（选「分类分栏」时必填）
              value: []
              max: 3
              addLabel: 添加分类栏
              emptyText: 暂无分类栏，将显示全部文章
              help: 拖动调整顺序；添加 1–3 个分类栏，两项显示两栏，移动端自动改为单栏。留空则该区块不输出任何内容。
              itemLabels:
                - type: text
                  label: $value.block_title
              children:
                - $formkit: categorySelect
                  name: category_name
                  label: 选择分类
                  value: ''
                  autoSelect: false
                  validation: required
                  help: 选择要展示的分类
                - $formkit: text
                  name: block_title
                  label: 区块显示标题
                  value: ''
                  validation: required
                  help: 前台显示的区块标题，如“校园新闻”
                - $formkit: number
                  name: limit
                  label: 显示数量
                  value: 6
                  min: 1
                  max: 30
            - $formkit: select
              key: home-member-limit
              if: $value.type === 'members'
              name: member_limit
              label: 显示数量
              value: 6
              options:
                - label: 4 个
                  value: 4
                - label: 6 个
                  value: 6
                - label: 8 个
                  value: 8
                - label: 10 个
                  value: 10
                - label: 12 个
                  value: 12
            - $formkit: select
              key: home-member-pinned
              if: $value.type === 'members'
              name: member_pinned
              label: 成员内容排序
              value: []
              multiple: true
              sortable: true
              clearable: true
              searchable: true
              help: 选中项优先展示，可拖动调整顺序；需启用成员插件
              action: /apis/member.plugin.halo.run/v1alpha1/members
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: metadata.name
                iconField: spec.avatar
                descriptionField: spec.school
                fieldSelectorKey: metadata.name
            - $formkit: select
              key: home-link-limit
              if: $value.type === 'links'
              name: link_limit
              label: 显示数量
              value: 8
              options:
                - label: 4 个
                  value: 4
                - label: 6 个
                  value: 6
                - label: 8 个
                  value: 8
                - label: 10 个
                  value: 10
                - label: 12 个
                  value: 12
            - $formkit: select
              key: home-link-pinned
              if: $value.type === 'links'
              name: link_pinned
              label: 友链内容排序
              value: []
              multiple: true
              sortable: true
              clearable: true
              searchable: true
              help: 选中项优先展示，可拖动调整顺序；需启用官方链接插件
              action: /apis/core.halo.run/v1alpha1/links
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: metadata.name
                iconField: spec.logo
                descriptionField: spec.url
                fieldSelectorKey: metadata.name
    - group: navigation
      label: 页头与导航
      formSchema:
        - $formkit: select
          name: logo_mode
          id: logo_mode
          key: logo_mode
          label: 页头 Logo
          value: mark
          help: 全站统一生效，首页首屏自带的页头与内页页头读同一份配置。默认使用主题红色标记；可换成媒体库图片，也可以完全去掉标记只留站名。
          options:
            - label: 默认标记
              value: mark
            - label: 自定义图片
              value: image
            - label: 不显示 Logo
              value: none
        - $formkit: attachment
          name: logo_image
          label: 自定义 Logo 图片
          value: ''
          accepts:
            - image/*
          help: 仅在「页头 Logo」选择「自定义图片」时生效，建议使用透明底 PNG/SVG。
          if: "$get('logo_mode').value === 'image'"
          key: nav-logo_image
        - $formkit: text
          name: brand_name
          label: 站名
          value: 全国高校自媒体联盟
          help: 留空则使用站点标题。
        - $formkit: text
          name: brand_en
          label: 站名英文缩写
          value: NUCMA
          help: 显示在站名右侧，同时用作默认标记的字母。
        - $formkit: text
          name: header_cta_text
          label: 页头按钮文字
          value: 加入联盟
          help: 留空则不显示页头按钮。
        - $formkit: text
          name: header_cta_url
          label: 页头按钮链接
          value: /members
        - $formkit: select
          name: nav_align
          label: 菜单对齐
          value: right
          help: 页头内菜单与自定义链接的水平对齐。本组对所有页面生效，首页首屏自带的页头也读这里的设置。
          options:
            - label: 居中对齐
              value: center
            - label: 左侧对齐
              value: left
            - label: 右侧对齐
              value: right
        - $formkit: checkbox
          name: show_login_btn
          label: 显示登录入口
          value: true
          help: 右上角显示登录按钮，已登录用户显示头像
        - $formkit: menuSelect
          name: header_menu
          label: 顶部菜单
          clearable: true
          help: 选择 Header 顶部导航使用的菜单（从 Halo 后台已创建的菜单中选择），清空则不显示主菜单
        - $formkit: checkbox
          name: search_enabled
          label: 显示搜索入口
          value: true
        - $formkit: checkbox
          name: theme_toggle_enabled
          label: 显示明暗切换按钮
          value: true
        - $formkit: number
          name: carousel_interval
          label: 链接轮播间隔（页头，毫秒）
          value: 3500
          min: 1500
          max: 10000
          step: 500
          help: 页头「自定义链接」超过 1 个时会自动上下滚动轮播，此处设置每个链接的停留时间，默认 3500ms。只影响页头，旧版横幅的轮播间隔在「首页首屏」组里单独设置。
        - $formkit: array
          name: custom_links
          label: 自定义链接
          value: []
          addLabel: 添加链接
          emptyText: 暂无自定义链接
          help: 在导航菜单右侧显示自定义链接，可选择图片或文字样式
          itemLabels:
            - type: text
              label: $value.text
            - type: image
              label: $value.image
            - type: text
              label: $value.url
          children:
            - $formkit: text
              name: text
              label: 链接文字
              value: ''
              placeholder: 如：加入我们（不填则显示图片或URL）
            - $formkit: text
              name: url
              label: 链接地址
              value: ''
              placeholder: https://
              validation: required
            - $formkit: attachment
              name: image
              label: 链接图片
              value: ''
              accepts:
                - image/*
              help: 从媒体库选择图片，设置后将显示为图片按钮
            - $formkit: select
              name: target
              label: 打开方式
              value: _blank
              options:
                - label: 新标签页
                  value: _blank
                - label: 当前页
                  value: _self
            - $formkit: text
              name: badge
              label: 数字角标（可选）
              value: ''
              placeholder: 如 38
              help: 首页「极简大字」「光斑」版式把这些链接排成右侧编号列表时，用作行首编号；其它位置忽略。
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: select
          name: footer_style
          id: footer_style
          key: footer_style
          label: 页脚样式
          value: default
          help: 选择页脚视觉风格；默认沿用主题原有页脚，另提供 12 号（品牌水印）与 33 号（卡片漂浮）两套可选样式。
          options:
            - label: 默认（主题原页脚）
              value: default
            - label: 12 号 · 品牌水印
              value: style12
            - label: 33 号 · 卡片漂浮
              value: style33
        - $formkit: text
          name: footer_join_url
          label: 「加入我们」链接
          placeholder: 留空则不显示按钮（如 /claim 或 https://xxx）
          help: 12 号与 33 号页脚共用；留空时 12 号回退为指向首页、33 号不显示按钮。
          if: "$get('footer_style').value === 'style12' || $get('footer_style').value === 'style33'"
          key: footer-join_url
        - $formkit: text
          name: footer_join_text
          label: 「加入我们」文字
          value: 加入我们
          help: 按钮文案，默认「加入我们」。
          if: "$get('footer_style').value === 'style12' || $get('footer_style').value === 'style33'"
          key: footer-join_text
        - $formkit: select
          name: footer_join_style
          label: 「加入我们」样式
          value: solid
          options:
            - label: 实心渐变（默认）
              value: solid
            - label: 描边
              value: outline
            - label: 文字链接
              value: ghost
            - label: 深色实心
              value: dark
          help: 仅影响页脚 CTA 按钮，不改变页脚其他元素。
          if: "$get('footer_style').value === 'style12' || $get('footer_style').value === 'style33'"
          key: footer-join_style
        - $formkit: select
          name: footer_join_icon
          label: 「加入我们」图标
          value: arrow
          options:
            - label: 箭头（默认）
              value: arrow
            - label: 加号
              value: plus
            - label: 邀请用户
              value: user-plus
            - label: 对话气泡
              value: chat
            - label: 邮件
              value: mail
            - label: 外链
              value: external
            - label: 无图标
              value: none
          help: 内置开源矢量图标，跟随按钮文字颜色；选「无图标」只保留文字。
          if: "$get('footer_style').value === 'style12' || $get('footer_style').value === 'style33'"
          key: footer-join_icon
        - $formkit: attachment
          name: footer_join_image
          label: 「加入我们」自定义图标
          value: ''
          accepts:
            - image/*
          help: 可选。上传后会替换上面的内置图标，建议使用透明背景的方形图片（16–24px 显示）。
          if: "$get('footer_style').value === 'style12' || $get('footer_style').value === 'style33'"
          key: footer-join_image
        - $formkit: array
          name: footer_menus
          label: 页脚菜单栏目
          value: []
          addLabel: 添加菜单栏目
          emptyText: 暂无菜单栏目
          help: 可添加多个带标题的 Halo 菜单栏目；每个栏目对应一个菜单。留空时回退到「页头设置」里选择的顶部菜单，顶部菜单也没有配置才使用内置的首页/文章/分类/成员四项。
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.menu
          children:
            - $formkit: text
              name: title
              label: 栏目标题
              value: ''
              validation: required
            - $formkit: select
              name: menu
              label: 菜单
              clearable: true
              validation: required
              searchable: true
              action: /api/v1alpha1/menus
              requestOption:
                method: GET
                pageField: page
                sizeField: size
                totalField: total
                itemsField: items
                labelField: spec.displayName
                valueField: metadata.name
                fieldSelectorKey: metadata.name
          if: "$get('footer_style').value !== 'style33'"
          key: footer-menus
        - $formkit: text
          name: footer_slogan
          label: 页脚标语
          value: 互动宣教 · 多元交流
          placeholder: 留空则用站点副标题
          help: 12 号（品牌水印）与 33 号（卡片漂浮）页脚品牌卡上的那行小字；留空时用站点副标题，两者都没有则不显示这一行。
          if: "$get('footer_style').value === 'style12' || $get('footer_style').value === 'style33'"
          key: footer-slogan
        - $formkit: textarea
          name: copyright
          label: 版权信息
          placeholder: 留空使用默认格式（© 年份 站点名称）
          rows: 2
        - $formkit: text
          name: custom_column_title
          label: 自定义栏目标题
          placeholder: 如：关注我们、联系方式
          help: 留空时默认显示"关注我们"
          if: "$get('footer_style').value !== 'style33'"
          key: footer-custom_column_title
        - $formkit: array
          name: custom_column_items
          label: 自定义栏目内容
          value: []
          addLabel: 添加项目
          emptyText: 暂无内容
          help: 添加图片或文字链接，支持简单的可视化排版
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.url
          children:
            - $formkit: text
              name: title
              label: 标题/文字
              value: ''
              placeholder: 如：微信公众号
              validation: required
            - $formkit: attachment
              name: image
              label: 图片
              value: ''
              accepts:
                - image/*
              help: 从媒体库选择图片，如二维码、Logo 等；不需要图就留空，只显示标题文字
            - $formkit: text
              name: url
              label: 链接地址
              value: ''
              placeholder: https://（可选，留空则不可点击）
            - $formkit: select
              name: target
              label: 打开方式
              value: _blank
              options:
                - label: 新标签页
                  value: _blank
                - label: 当前页
                  value: _self
          if: "$get('footer_style').value !== 'style33'"
          key: footer-custom_column_items
        - $formkit: text
          name: icp_number
          label: ICP 备案号
          placeholder: 京ICP备XXXXXXXX号
        - $formkit: text
          name: icp_link
          label: ICP 备案链接
          value: https://beian.miit.gov.cn/
        - $formkit: text
          name: police_number
          label: 公安备案号
          placeholder: 京公网安备XXXXXXXXXXXXXX号
        - $formkit: text
          name: police_record_code
          label: 公安备案验证码
    - group: sidebar
      label: 文章页与侧边栏
      formSchema:
        - $formkit: menuSelect
          name: sidebar_menu
          label: 侧边栏菜单
          clearable: true
          help: 选择文章页侧边栏显示的菜单，清空则不显示
        - $formkit: checkbox
          name: show_views
          label: 显示阅读量
          value: true
        - $formkit: checkbox
          name: show_cover
          label: 显示文章封面
          value: true
        - $formkit: checkbox
          name: show_tags
          label: 显示文章标签
          value: true
        - $formkit: select
          name: date_style
          label: 发布日期精度
          value: day
          options:
            - label: 年月日（跟随「外观与版式 → 日期格式」）
              value: day
            - label: 年月（2026年11月）
              value: month
            - label: 仅年份（2026年）
              value: year
          help: 只影响文章页（标题下方与侧栏「发布于」）和首页卡片的日期，归档页与其他列表不受影响；做专题合集时选「年月」更耐看。
          key: post-date_style
        - $formkit: checkbox
          name: pair_images
          label: 连续图片自动并排
          value: true
          help: 正文里前后相邻的两张横图会自动排成一行（各带图注）；竖图、手机端仍为上下排列。关闭后所有图片一律通栏。
          key: post-pair_images
        - $formkit: text
          name: author_text
          label: 文章署名文字
          value: ""
          help: '留空＝沿用注册作者（后台登录账号，例如 Administrator）。填了就全站文章统一显示这段文字，不再绑定注册用户。单篇要单独署名时，在文章编辑页的「高级 → 自定义元数据」加键 nucma.cn/author、值写作者名，优先级高于这里（文章页署名、首页卡片、归档与 SEO 会一起生效）。'
          key: post-author_text
        - $formkit: text
          name: credit_label
          label: 文末署名标题
          value: 署名
          help: '正文末尾「【拍摄: …】」这类署名区的标题，留空则不显示标题。'
          key: post-credit_label
        - $formkit: checkbox
          name: highlight_enabled
          id: highlight_enabled
          label: 允许划线
          value: true
          help: 读者选中正文即可划线、生成分享图，无需登录。划线记录只保存在读者自己的浏览器里；关闭后旧划线也不再显示。
          key: post-highlight_enabled
        - $formkit: select
          name: highlight_style
          label: 划线样式
          value: underline
          options:
            - label: 红色下划线（同公众号）
              value: underline
            - label: 荧光笔底色
              value: wash
          if: $get('highlight_enabled').value != false
          key: post-highlight_style
        - $formkit: checkbox
          name: auto_toc
          label: 自动生成文章目录
          value: true
          help: 根据文章标题自动提取目录，文章没有标题时自动隐藏
        - $formkit: checkbox
          name: post_comment_enabled
          label: 显示文章评论区
          value: true
          help: 开启后文章页底部显示评论区
        - $formkit: array
          name: section_blocks
          label: 侧边栏区块顺序
          addLabel: 添加侧栏区块
          emptyText: 暂无侧栏区块
          value:
            - type: menu
              title: 快捷导航
            - type: info
              title: 文章信息
            - type: author
              title: 作者信息
            - type: recent
              title: 最近文章
            - type: toc
              title: 文章目录
          help: 拖动调整顺序；列表中存在即显示。支持移除后重新添加，每种区块建议只添加一次。这是文章页侧边栏的配置，与「首页首屏」里的首页区块排序互不影响。
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 区块类型
              value: menu
              validation: required
              options:
                - label: 快捷导航
                  value: menu
                - label: 文章信息
                  value: info
                - label: 作者信息
                  value: author
                - label: 最近文章
                  value: recent
                - label: 文章目录
                  value: toc
            - $formkit: text
              name: title
              label: 列表显示名称
              value: ''
              validation: required
              help: 仅用于后台识别排序项，不改变前台侧栏标题
    - group: about
      label: 关于页
      formSchema:
        - $formkit: array
          name: about_blocks
          label: 关于页区块排序
          addLabel: 添加区块
          emptyText: 暂无关于页区块
          help: 拖动调整关于页各个区块的显示顺序；列表中未添加的区块不会显示，每种区块建议只添加一次
          value:
            - type: content
              title: 站点介绍
            - type: stats
              title: 数据统计
            - type: latest
              title: 最新内容
            - type: categories
              title: 内容分类
            - type: members
              title: 成员展示
            - type: links
              title: 友情链接
            - type: timeline
              title: 发展历程
            - type: services
              title: 服务入口
            - type: projects
              title: 项目展示
