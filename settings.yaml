          answer: 全国高校自媒体联盟（NUCMA）是由校园墙组织共同发起的第三方校园媒体协作组织，关注校园墙规范运营、校园信息互助与青年表达。
        - question: 重庆校墙联和全国校墙联是什么关系？
          answer: 重庆校墙联是全国校墙联的发源地，成立于 2021 年 7 月，是全国高校自媒体联盟发展脉络中的重要起点。
        - question: 联盟宗旨是什么？
          answer: 宗旨目标为“互动宣教，多元交流”。互动为主、宣教为辅，交流为主、多元互促。
        - question: 如何联系联盟？
          answer: 如有组织咨询、成员信息或技术支持问题，可通过 support@nucma.cn 联系，我们会尽快处理。
