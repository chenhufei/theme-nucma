apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-nucma-setting
spec:
  forms:
  - group: appearance
    label: 外观样式
    formSchema:
    - $el: div
      attrs:
        style: width:100%;max-width:920px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;margin:0 0 18px;
      children:
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: default_theme_mode
          label: 默认配色模式
          value: system
          options:
          - label: 跟随系统
            value: system
          - label: 浅色
            value: light
          - label: 深色
            value: dark
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: card_radius
          label: 卡片圆角
          value: xl
          options:
          - label: 小（8px）
            value: sm
          - label: 中（12px）
            value: md
          - label: 大（16px）
            value: xl
          - label: 超大（24px）
            value: 2xl
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: body_font
          label: 正文字体
          value: system
          options:
          - label: 系统默认
            value: system
          - label: 霞鹜文楷
            value: lxgw-wenkai
          - label: MiSans
            value: misans
          - label: 自定义
            value: custom
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: misans_weight
          label: MiSans 字重
          value: medium
          help: 仅 MiSans 字体生效
          options:
          - label: Regular（细）
            value: regular
          - label: Medium（中）
            value: medium
          - label: Bold（粗）
            value: bold
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: attachment
          name: custom_font_url
          label: 自定义字体 CSS 链接
          placeholder: https://fonts.googleapis.com/css2?family=...
          help: 可上传字体 CSS 文件，也可粘贴外部 CSS 链接
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: custom_font_family
          label: 自定义字体名称
          placeholder: '''MyFont'', sans-serif'
          help: 自定义字体生效
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: enable_animations
          label: 启用滚动动效
          value: true
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: enable_smooth_scroll
          label: 启用平滑滚动
          value: false
          help: 默认关闭以保证性能；开启后使用 Lenis 平滑滚动。
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: enable_back_to_top
          label: 显示返回顶部按钮
          value: true
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: enable_login_style
          label: 启用登录/注册页美化
          value: true
          help: 关闭后使用 Halo 默认样式
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: enable_profile_style
          label: 启用用户中心页美化
          value: true
          help: 关闭后尽量保留 Halo 默认用户中心样式
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: enable_console_style
          label: 启用后台美化辅助样式
          value: true
          help: 主题能影响的后台/网关页面将应用轻量玻璃背景
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: background_mode
          label: 全局背景模式
          value: mesh
          options:
          - label: 柔和渐变
            value: mesh
          - label: 极光流彩
            value: aurora
          - label: 校园网格
            value: campus-grid
          - label: 纸感微纹
            value: paper
          - label: 光谱棱镜
            value: prism
          - label: 夜幕星点
            value: night
          - label: 纯净浅底
            value: plain
          - label: 自定义图片
            value: image
          - label: 关闭背景
            value: none
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: attachment
          name: background_image
          label: 自定义背景图片
          value: ''
          placeholder: https://.../background.jpg
          help: 背景模式选择“自定义图片”时生效
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: background_position
          label: 背景图片位置
          value: center center
          options:
          - label: 居中
            value: center center
          - label: 顶部居中
            value: center top
          - label: 底部居中
            value: center bottom
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: background_image_opacity
          label: 背景图片强度
          value: '0.28'
          help: 建议 0.12 - 0.45，越高图片越明显
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: background_pattern_opacity
          label: 背景纹理强度
          value: '0.52'
          help: 建议 0 - 0.8，影响网格/光纹可见度
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: glass_strength
          label: 液态玻璃强度
          value: standard
          options:
          - label: 轻量
            value: soft
          - label: 标准
            value: standard
          - label: 强化
            value: strong
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: glass_refraction
          label: 液态折射效果
          value: adaptive
          options:
          - label: 自适应
            value: adaptive
          - label: 始终开启
            value: 'on'
          - label: 关闭折射
            value: 'off'
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: glass_density
          label: 玻璃表面密度
          value: balanced
          options:
          - label: 通透
            value: airy
          - label: 均衡
            value: balanced
          - label: 厚重
            value: solid
  - group: header
    label: 导航栏
    formSchema:
    - $formkit: text
      name: site_title
      label: Header 网站标题
      placeholder: 留空使用站点标题
    - $formkit: attachment
      name: logo_image
      label: Header Logo
      placeholder: 留空使用站点 Logo
    - $formkit: select
      name: menu_align
      label: 菜单位置
      value: center
      options:
      - label: 居左
        value: left
      - label: 居中
        value: center
      - label: 居右
        value: right
    - $formkit: select
      name: search_expand_mode
      label: 搜索展开方式
      value: hover
      options:
      - label: 鼠标放置自动展开
        value: hover
      - label: 点击展开/再次点击外部收起
        value: click
    - $formkit: checkbox
      name: show_search
      label: 显示搜索入口
      value: true
    - $formkit: checkbox
      name: show_theme_toggle
      label: 显示主题切换按钮
      value: true
    - $formkit: checkbox
      name: show_user_avatar
      label: 显示用户头像/登录按钮
      value: true
    - $formkit: array
      name: promo_links
      label: Header 活动图片链接
      help: 可用于限时活动、专题入口；支持上传外显图片。
      value: []
      itemLabels:
      - type: text
        label: $value.label
      addLabel: 添加活动入口
      emptyText: 暂无活动入口
      children:
      - $formkit: checkbox
        name: enabled
        label: 启用
        value: true
      - $formkit: text
        name: label
        label: 名称
        validation: required
      - $formkit: attachment
        name: image
        label: 外显图片
      - $formkit: text
        name: text
        label: 无图片时显示文字
        placeholder: 活动
      - $formkit: text
        name: url
        label: 链接地址
        validation: required
      - $formkit: checkbox
        name: open_in_new
        label: 新窗口打开
        value: true
  - group: home
    label: 首页设置
    formSchema:
    - $el: div
      attrs:
        style: width:100%;max-width:920px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;margin:0 0 18px;
      children:
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: show_hero
          label: 显示 Hero 区块
          value: true
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: hero_show_badge
          label: 显示 Hero 徽标
          value: true
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: hero_badge_text
          label: Hero 徽标文字
          value: National University Campus Media Alliance
          placeholder: 留空使用默认英文徽标
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: home_subtitle
          label: 首页副标题
          value: 互动宣教，多元交流
          placeholder: 覆盖站点副标题，留空使用默认
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: hero_motto
          label: Hero 宗旨
          value: 看见你，看见我们！
          help: 留空则不显示
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: attachment
          name: hero_panel_logo
          label: Hero 右侧服务台 Logo
          placeholder: 可上传图片，留空使用站点 Logo 或字母 N
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: hero_panel_kicker
          label: Hero 右侧服务台小标题
          value: NUCMA Campus Desk
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: text
          name: hero_panel_title
          label: Hero 右侧服务台标题
          value: 校园协作服务台
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: hero_subtitle_size
          label: Hero 副标题字号
          value: xl
          options:
          - label: 小
            value: sm
          - label: 中
            value: md
          - label: 大
            value: lg
          - label: 超大
            value: xl
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: select
          name: hero_motto_size
          label: Hero 宗旨字号
          value: md
          options:
          - label: 小
            value: sm
          - label: 中
            value: md
          - label: 大
            value: lg
      - $el: div
        attrs:
          style: min-width:0;align-self:start;width:100%;display:flex;flex-direction:column;
        children:
        - $formkit: checkbox
          name: hero_show_scroll_hint
          label: 显示滚动提示
          value: true
      - $formkit: array
        name: section_order_items
        label: 首页区块配置（排序/内容/启用）
        help: 拖动条目调整首页区块顺序；关闭启用可隐藏区块；标题和副标题会在前台自动应用。
        value:
        - section_key: hero
          section_label: Hero
          enabled: true
        - section_key: about-alliance
          section_label: 组织介绍
          enabled: true
          eyebrow: 组织介绍
          title: 把“校园墙”从信息流，升级为可信赖的协作网络
          description: 全国高校自媒体联盟（NUCMA）由校园墙组织共同发起，关注校园自媒体的规范运营、信息互助与青年表达。
          quote: 互动为主，宣教为辅；交流为主，多元互促。
        - section_key: service-directions
          section_label: 服务方向
          enabled: true
          eyebrow: 服务方向
          title: 四个稳定场景，支撑一个长期门户
          subtitle: 每个入口都对应真实页面或已适配插件，减少无效跳转。
        - section_key: site-portal
          section_label: 功能入口
          enabled: true
          eyebrow: 功能入口
          title: 为 Halo 生态预留的扩展底座
          subtitle: 基础能力直接可用；搜索、友链、图库、瞬间按插件可用性输出，不制造空入口。
        - section_key: posts
          section_label: 文章区块
          enabled: true
          eyebrow: 信息流
          title: 最新公告
          subtitle: 用清晰卡片承载公开通知、活动记录和组织动态。
        - section_key: links
          section_label: 友情链接
          enabled: true
          title: 友情链接
          subtitle: 协同传播的校园伙伴
        - section_key: members
          section_label: 成员公示
          enabled: true
          title: 成员公示
          subtitle: 共同维护校园沟通秩序
        - section_key: reviews
          section_label: 校园反馈
          enabled: true
          title: 校园反馈
          subtitle: 来自校园群体的真实体验
        - section_key: faq
          section_label: FAQ
          enabled: true
          title: 常见问题
          subtitle: 常见问题解答
        itemLabels:
        - type: text
          label: $value.section_label
        - type: text
          label: $value.section_key
        addLabel: 添加首页区块
        emptyText: 暂无首页区块
        children:
        - $el: div
          attrs:
            style: display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;
          children:
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: select
              name: section_key
              label: 区块标识
              validation: required
              options:
              - label: Hero
                value: hero
              - label: 组织介绍
                value: about-alliance
              - label: 服务方向
                value: service-directions
              - label: 功能入口
                value: site-portal
              - label: 文章区块
                value: posts
              - label: 友情链接
                value: links
              - label: 成员公示
                value: members
              - label: 校园反馈
                value: reviews
              - label: FAQ
                value: faq
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: text
              name: section_label
              label: 后台显示名称
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: checkbox
              name: enabled
              label: 启用该区块
              value: true
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: text
              name: eyebrow
              label: 小标签/分类文字
              placeholder: 留空则使用模板默认值
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: text
              name: title
              label: 区块标题
              placeholder: 留空则使用模板默认值
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: textarea
              name: subtitle
              label: 区块副标题/说明
              rows: 2
              placeholder: 留空则使用模板默认值
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: textarea
              name: description
              label: 组织介绍详细说明
              rows: 3
              placeholder: 留空则使用模板默认值
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: text
              name: quote
              label: 组织原则引语
              placeholder: 留空则使用模板默认值
      - $formkit: array
        name: alliance_principles
        label: 组织介绍原则卡片
        help: 用数组统一管理组织介绍中的原则卡片，可拖动排序。
        value:
        - index: '01'
          title: 公开
          description: 用公示、归档和成员名录建立基本信任。
        - index: '02'
          title: 响应
          description: 把投稿、咨询和协作事项导向明确入口。
        - index: '03'
          title: 沉淀
          description: 让公告、活动图文和重要记录可追溯。
        - index: '04'
          title: 连接
          description: 连接高校媒体、校园用户和合作伙伴。
        itemLabels:
        - type: text
          label: $value.title
        - type: text
          label: $value.index
        addLabel: 添加原则卡片
        emptyText: 暂无原则卡片
        children:
        - $el: div
          attrs:
            style: display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;
          children:
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: text
              name: index
              label: 序号
              placeholder: '01'
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: text
              name: title
              label: 卡片标题
              validation: required
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: textarea
              name: description
              label: 卡片说明
              rows: 2
              validation: required
      - $formkit: array
        name: service_cards
        label: 服务方向卡片
        help: 首页服务方向区块的卡片数组；可设置插件依赖，插件不可用时自动隐藏。
        value:
        - title: 公开发布
          description: 联盟建设、成员扶持、阶段安排和重要名单统一归档。
          url: /archives
          enabled: true
        - title: 组织说明
          description: 清晰展示联盟定位、发源脉络、联系邮箱和协作边界。
          url: /about
          enabled: true
        - title: 校园影像
          description: 接入图库插件后承载活动照片、专题影像和视觉资料。
          url: /photos
          plugin_key: PluginPhotos
          plugin_alt_key: PluginGallery
          enabled: true
        - title: 成员公示
          description: 公开成员单位和相关名单，帮助用户识别可靠校园渠道。
          url: '#members'
          enabled: true
        itemLabels:
        - type: text
          label: $value.title
        - type: text
          label: $value.url
        addLabel: 添加服务卡片
        emptyText: 暂无服务卡片
        children:
        - $el: div
          attrs:
            style: display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;
          children:
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: checkbox
              name: enabled
              label: 启用卡片
              value: true
          - $el: div
            attrs:
              style: min-width:0;align-self:start;width:100%;
            children:
            - $formkit: text
