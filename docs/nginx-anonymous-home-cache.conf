# Nucma anonymous homepage cache for Halo behind Nginx.
# Put the proxy_cache_path and map blocks in http {}, then merge the
# proxy_cache directives into the existing server/location that proxies Halo.

proxy_cache_path /var/cache/nginx/halo-home levels=1:2 keys_zone=halo_home:32m
                 inactive=30m max_size=512m use_temp_path=off;

map $request_method $nucma_skip_method {
  default 1;
  GET 0;
  HEAD 0;
}

map $uri $nucma_skip_uri {
  default 1;
  / 0;
}

map $args $nucma_has_query {
  default 1;
  "" 0;
}

map $http_cookie $nucma_has_login_cookie {
  default 0;
  ~*(SESSION|remember|halo|Authorization|XSRF|csrf|admin|console) 1;
}

# Add inside the location that proxies Halo.
proxy_cache halo_home;
proxy_cache_methods GET HEAD;
proxy_cache_key "$scheme://$host$uri";
proxy_cache_valid 200 5m;
proxy_cache_lock on;
proxy_cache_background_update on;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_hide_header Set-Cookie;
proxy_cache_bypass $nucma_skip_method $nucma_skip_uri $nucma_has_query $nucma_has_login_cookie $http_authorization;
proxy_no_cache     $nucma_skip_method $nucma_skip_uri $nucma_has_query $nucma_has_login_cookie $http_authorization;
add_header X-Nucma-Home-Cache $upstream_cache_status always;
