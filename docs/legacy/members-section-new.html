<!-- ===== 成员块（需要安装成员插件） ===== -->
<section id="members" data-section="members" class="py-16 sm:py-20"
         style="background:rgba(255,255,255,0.55); display: none;"
         th:if="${theme.config.home?.show_members_section == null or theme.config.home.show_members_section != false}">
  <div class="mx-auto px-4 sm:px-6" style="max-width:var(--container-max-w);">
    <div class="text-center mb-10 reveal">
      <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-tight mb-2">团队成员</h2>
      <p class="text-sm text-slate-400 dark:text-slate-500">一起创作的伙伴</p>
    </div>
    <div id="membersContainer" class="grid gap-3" style="grid-template-columns: repeat(5, 1fr); grid-auto-rows: 180px; overflow: hidden;"></div>
  </div>

  <style>
    .member-card {
      position: relative;
      width: 100%;
      height: 100%;
      perspective: 1000px;
      cursor: pointer;
    }

    .member-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    .member-card.flipped .member-card-inner {
      transform: rotateY(180deg);
    }

    .member-card-front,
    .member-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 1rem;
      box-sizing: border-box;
      overflow: hidden;
    }

    [data-theme="dark"] .member-card-front,
    [data-theme="dark"] .member-card-back {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(71, 85, 105, 0.5);
    }

    .member-card-back {
      transform: rotateY(180deg);
      background: rgba(255,255,255,1);
    }

    [data-theme="dark"] .member-card-back {
      background: rgba(30, 41, 59, 1);
    }

    .member-avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(99, 102, 241, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .member-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .member-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e293b;
      text-align: center;
      margin-bottom: 0.25rem;
    }

    [data-theme="dark"] .member-name {
      color: #f1f5f9;
    }

    .member-bio {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    [data-theme="dark"] .member-bio {
      color: #94a3b8;
    }

    @media (max-width: 640px) {
      #membersContainer {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }
    @media (min-width: 641px) and (max-width: 900px) {
      #membersContainer {
        grid-template-columns: repeat(4, 1fr) !important;
      }
    }
  </style>

  <script th:inline="javascript">
  (function() {
    const section = document.getElementById('members');
    const container = document.getElementById('membersContainer');
    if (!container) return;

    let allMembers = [];

    // 获取静态成员配置
    const staticMembersJson = /*[[${theme.config.home?.static_members}]]*/ '';
    let staticMembers = [];

    try {
      if (staticMembersJson && staticMembersJson !== 'null' && staticMembersJson.trim()) {
        staticMembers = typeof staticMembersJson === 'string' ? JSON.parse(staticMembersJson) : staticMembersJson;
        if (Array.isArray(staticMembers) && staticMembers.length > 0) {
          console.log('[Members] 使用静态成员配置:', staticMembers.length, '个');
        }
      }
    } catch (e) {
      staticMembers = [];
    }

    // API 端点列表
    const apiEndpoints = [
      '/apis/api.plugin.halo.run/v1alpha1/plugins/PluginMembers/members',
      '/apis/anonymous.member.plugin.halo.run/v1alpha1/members',
      '/apis/member.plugin.halo.run/v1alpha1/members'
    ];

    async function fetchMembers() {
      // 优先使用静态配置
      if (staticMembers.length > 0) {
        return staticMembers.map(m => ({ spec: m }));
      }

      // 尝试从 API 获取
      for (const endpoint of apiEndpoints) {
        try {
          const response = await fetch(endpoint);
          if (response.ok && response.headers.get('content-type')?.includes('application/json')) {
            const data = await response.json();
            let members = [];

            if (data.items && Array.isArray(data.items)) {
              if (data.items.length > 0 && data.items[0].members) {
                data.items.forEach(group => {
                  if (group.members) members.push(...group.members);
                });
              } else {
                members = data.items;
              }
            } else if (Array.isArray(data)) {
              members = data;
            }

            if (members.length > 0) return members;
          }
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    function createMemberCard(frontMember, backMember) {
      const frontSpec = frontMember.spec || frontMember;
      const backSpec = backMember.spec || backMember;

      const card = document.createElement('div');
      card.className = 'member-card';
      // 存储当前正面成员的链接
      card.dataset.link = frontSpec.qqFriendLink || frontSpec.url || '';
      card.innerHTML = `
        <div class="member-card-inner">
          <div class="member-card-front">
            <div class="member-avatar">
              ${frontSpec.avatar ?
                `<img src="${frontSpec.avatar.replace('http://', 'https://')}" alt="${frontSpec.displayName || frontSpec.name}" />` :
                `<div style="font-size: 2rem;">👤</div>`
              }
            </div>
            <div class="member-name">${frontSpec.displayName || frontSpec.name || '未命名'}</div>
            ${(frontSpec.bio || frontSpec.school) ? `<div class="member-bio">${frontSpec.bio || frontSpec.school}</div>` : ''}
          </div>
          <div class="member-card-back">
            <div class="member-avatar">
              ${backSpec.avatar ?
                `<img src="${backSpec.avatar.replace('http://', 'https://')}" alt="${backSpec.displayName || backSpec.name}" />` :
                `<div style="font-size: 2rem;">👤</div>`
              }
            </div>
            <div class="member-name">${backSpec.displayName || backSpec.name || '未命名'}</div>
            ${(backSpec.bio || backSpec.school) ? `<div class="member-bio">${backSpec.bio || backSpec.school}</div>` : ''}
          </div>
        </div>
      `;

      // 点击跳转
      card.addEventListener('click', () => {
        const link = card.dataset.link;
        if (link) window.open(link, '_blank', 'noopener,noreferrer');
      });

      return card;
    }

    function updateCardBack(card, member) {
      const spec = member.spec || member;
      const isFlipped = card.classList.contains('flipped');
      const targetSide = isFlipped ?
        card.querySelector('.member-card-front') :
        card.querySelector('.member-card-back');

      targetSide.innerHTML = `
        <div class="member-avatar">
          ${spec.avatar ?
            `<img src="${spec.avatar.replace('http://', 'https://')}" alt="${spec.displayName || spec.name}" />` :
            `<div style="font-size: 2rem;">👤</div>`
          }
        </div>
        <div class="member-name">${spec.displayName || spec.name || '未命名'}</div>
        ${(spec.bio || spec.school) ? `<div class="member-bio">${spec.bio || spec.school}</div>` : ''}
      `;

      // 翻转后更新链接为新成员的链接
      setTimeout(() => {
        card.dataset.link = spec.qqFriendLink || spec.url || '';
        // 有链接时显示指针样式
        card.style.cursor = card.dataset.link ? 'pointer' : 'default';
      }, 350);
    }

    function startAutoFlip() {
      const cards = container.querySelectorAll('.member-card');
      if (cards.length === 0) return;

      cards.forEach((card) => {
        card.dataset.paused = 'false';

        // hover 时暂停翻转
        card.addEventListener('mouseenter', () => { card.dataset.paused = 'true'; });
        card.addEventListener('mouseleave', () => { card.dataset.paused = 'false'; });

        const initialDelay = Math.random() * 5000;
        const interval = 3000 + Math.random() * 4000;

        setTimeout(() => {
          setInterval(() => {
            if (card.dataset.paused === 'true') return;
            const newMember = allMembers[Math.floor(Math.random() * allMembers.length)];
            updateCardBack(card, newMember);
            setTimeout(() => card.classList.toggle('flipped'), 50);
          }, interval);
        }, initialDelay);
      });
    }

    fetchMembers().then(async members => {
      if (!members || members.length === 0) {
        console.warn('[Members] 没有成员数据');
        return;
      }

      allMembers = members;

      // 获取筛选 ID
      const featuredIds = /*[[${theme.config.home?.featured_member_ids}]]*/ '';
      let displayMembers = members;

      if (featuredIds && featuredIds.trim()) {
        const ids = featuredIds.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id) && id > 0);
        if (ids.length > 0) {
          displayMembers = ids.map(id => members[id - 1] || members.find(m => {
            const mId = m.metadata?.name || m.id || m.spec?.id;
            return mId == id || mId == String(id);
          })).filter(m => m);
        }
      }

      if (displayMembers.length === 0) displayMembers = members;

      // 固定 10 个格子，不足则重复填充
      const totalNeeded = 10;
      const finalMembers = [];
      while (finalMembers.length < totalNeeded) {
        finalMembers.push(...displayMembers);
      }
      const membersToShow = finalMembers.slice(0, totalNeeded);

      // 创建卡片（正反面使用不同成员）
      membersToShow.forEach((member, i) => {
        const backMember = allMembers[(i + 1) % allMembers.length];
        container.appendChild(createMemberCard(member, backMember));
      });

      section.style.display = 'block';
      setTimeout(startAutoFlip, 1000);
    });
  })();
  </script>
</section>
